<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="only light">
<title>AI 曝光工作台</title>
<style>
/* ───────── 颜色和字体：和有赞龙虾客户端用同一套 ─────────
   页面是白底：工作台嵌在客户端的内容区里，客户端的内容区本身就是白的。分区靠细线和留白，不靠灰底 */
:root {
  --bg: #ffffff; --side: #fafbfb; --canvas: #ffffff; --subtle: #f7f8f9; --hover: #f1f3f4;
  --line: #eceef0; --line-2: #d9dcdf;
  --ink: #1f2328; --ink-2: #5f656b; --ink-3: #8b9197; --ink-4: #b6babe;
  --brand: #155bd4; --brand-2: #114bb8; --brand-soft: #eaf2ff; --brand-line: #b8d0f5;
  --ok: #238a57; --ok-soft: #eaf7f0; --warn: #b7791f; --warn-soft: #fff7e6; --bad: #d83b32; --bad-soft: #fff0ef;
  --c1: #155bd4; --c2: #0f8a9d; --c3: #8b5cf6; --c4: #c2410c; --c5: #238a57; --c6: #c0408f; --c7: #b7791f; --c0: #c3c7cb;
  --shadow: 0 1px 2px rgba(31, 35, 40, .04);
  --shadow-lg: 0 16px 48px rgba(31, 35, 40, .18);
  --r: 12px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased;
  font: 14px/1.6 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
}
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
button, select { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.noscript { padding: 24px 16px; }
.tnum { font-variant-numeric: tabular-nums; }

/* ───────── 外框：左侧导航 + 顶栏 + 内容 ───────── */
.app { display: flex; min-height: 100vh; }
.side { position: sticky; top: 0; z-index: 20; display: flex; flex: none; flex-direction: column; width: 232px; height: 100vh; padding: 16px 12px 12px; overflow-y: auto; border-right: 1px solid var(--line); background: var(--side); }
.side-brand { display: flex; align-items: center; padding: 0 6px 12px; }
.mascot { flex: none; width: 36px; height: 36px; margin-right: 10px; border-radius: 10px; background: var(--canvas); box-shadow: 0 0 0 1px var(--line); }
.side-brand .t1 { font-size: 12px; line-height: 1.3; color: var(--ink-3); }
.side-brand .t2 { max-width: 150px; overflow: hidden; font-size: 15px; font-weight: 700; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }
.side-state { display: block; margin: 0 6px 6px; }
.side-state .pill { width: 100%; justify-content: center; line-height: 26px; }
.side-state:hover { text-decoration: none; opacity: .85; }
.nav-label { padding: 14px 10px 6px; font-size: 12px; letter-spacing: .04em; color: var(--ink-3); }
.sec-label { margin-top: 20px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.note-gap { margin-top: 12px; }
/* 体检报告：每期一份独立的文件。单独打开时自带标题；嵌在工作台里时（地址带 #embed）不带标题，靠左对齐，和工作台的其他页面一致 */
.app.report { display: block; }
.rpt { max-width: 1080px; margin: 0 auto; }
.app.report.embedded .rpt { max-width: none; margin: 0; }
.rpt-head { display: flex; align-items: center; padding: 20px 28px 12px; }
.rpt-head .mascot { width: 40px; height: 40px; margin-right: 12px; }
.rpt-title { min-width: 0; }
.rpt-title .t1 { font-size: 19px; font-weight: 700; line-height: 1.4; }
.rpt-title .t2 { font-size: 13px; color: var(--ink-3); }
.rpt-head .sp { flex: 1; min-width: 12px; }
.rpt-head .btn { flex: none; margin: 0; }
.rpt-toc { position: sticky; top: 0; z-index: 8; display: flex; overflow-x: auto; padding: 8px 22px; border-bottom: 1px solid var(--line); background: var(--bg); white-space: nowrap; }
.rpt-toc a { margin-right: 4px; border-radius: 999px; padding: 4px 12px; color: var(--ink-2); font-size: 13px; }
.rpt-toc a:hover { background: var(--hover); color: var(--ink); text-decoration: none; }
.stack > .rpt-h2 { margin: 32px 0 0; font-size: 18px; font-weight: 700; scroll-margin-top: 52px; }
.stack > .rpt-h2:first-child, .stack > .demo-strip + .rpt-h2 { margin-top: 4px; }
.rpt-h2 small { margin-left: 10px; font-size: 13px; font-weight: 400; color: var(--ink-3); }
.stack > .rpt-h2 + * { margin-top: 12px; }
.rpt-foot { padding: 8px 0 0; font-size: 12px; color: var(--ink-3); text-align: center; }
@media (max-width: 900px) {
  .rpt-head { padding: 16px 16px 10px; }
  .rpt-title .t1 { font-size: 17px; }
  .rpt-toc { padding: 8px 10px; }
  .rpt-h2 small { display: block; margin: 2px 0 0; }
}
.demo-strip { border: 1px dashed var(--warn); border-radius: 10px; padding: 8px 14px; background: var(--warn-soft); color: var(--warn); font-size: 13px; font-weight: 600; }
.finding { padding: 14px 0; border-top: 1px solid var(--line); }
.finding:first-of-type { border-top: 0; padding-top: 4px; }
.finding-t { font-weight: 700; line-height: 1.5; }
.finding-t .tag { margin-right: 8px; }
.finding-d { max-width: 68em; margin-top: 6px; color: var(--ink-2); line-height: 1.7; }
.finding-a { margin-top: 6px; line-height: 1.7; }
.finding-a .k { margin-right: 8px; color: var(--ink-3); font-size: 12px; }
.finding-q { display: block; width: 100%; margin-top: 8px; padding: 8px 12px; border: 0; border-left: 3px solid var(--line); border-radius: 0 8px 8px 0; background: var(--hover); color: var(--ink-2); font: inherit; font-size: 13px; line-height: 1.6; text-align: left; cursor: pointer; }
.finding-q:hover { border-left-color: var(--brand); }
.finding-q .who { display: block; font-size: 12px; color: var(--ink-3); }
.edge-list { margin: 4px 0 0; padding-left: 20px; }
.edge-list li { margin: 6px 0; line-height: 1.6; }
.edge-list .tag { margin-left: 8px; }
.nav a { display: flex; align-items: center; height: 36px; margin-bottom: 2px; padding: 0 10px; border-radius: 8px; color: var(--ink-2); font-size: 14px; }
.nav a:hover { background: var(--hover); text-decoration: none; }
.nav a.on { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.nav a:focus-visible { outline-offset: -2px; }
.nav a svg { flex: none; margin-right: 10px; }
.nav .cnt { min-width: 20px; margin-left: auto; border-radius: 10px; padding: 0 6px; background: var(--hover); color: var(--ink-2); font-size: 12px; font-weight: 600; line-height: 20px; text-align: center; }
.nav .cnt.bad { background: var(--bad-soft); color: var(--bad); }
.nav .rpt-link { height: 34px; font-size: 13px; }
.nav .rpt-link .cnt { background: var(--brand-soft); color: var(--brand); }
.main { flex: 1; min-width: 0; }
.topbar { position: sticky; top: 0; z-index: 8; display: flex; align-items: center; min-height: 60px; padding: 10px 32px; border-bottom: 1px solid var(--line); background: rgba(255, 255, 255, .9); -webkit-backdrop-filter: saturate(1.4) blur(10px); backdrop-filter: saturate(1.4) blur(10px); }
.topbar h1 { margin: 0; font-size: 18px; font-weight: 700; white-space: nowrap; }
.card-h h3, .banner .verdict, .stack > .rpt-h2, .paper-title, .finding-t, .sheet-head h3 { text-wrap: balance; }
.topbar .sub { margin-left: 12px; overflow: hidden; font-size: 13px; color: var(--ink-3); text-overflow: ellipsis; white-space: nowrap; }
.topbar .sub:empty { display: none; }
.topbar .upd { margin-left: 14px; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.topbar .sp { flex: 1; min-width: 8px; }
.topbar .pill { margin-left: 8px; }
.topbar .act { margin-left: 14px; font-size: 13px; white-space: nowrap; }
/* 跟员工说：页面是只读的，能说的话收在顶栏这一个按钮里，点开才出现 */
.saybtn { display: inline-flex; flex: none; align-items: center; margin-left: 12px; border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 12px 4px 10px; background: var(--canvas); color: var(--ink-2); font-size: 13px; white-space: nowrap; cursor: pointer; }
.saybtn[hidden] { display: none; }
.saybtn svg { margin-right: 6px; }
.saybtn:hover, .saybtn.on { border-color: var(--brand-line); color: var(--brand); }
.saypop { position: absolute; right: 24px; top: calc(100% - 4px); z-index: 25; width: 300px; max-width: calc(100vw - 24px); border: 1px solid var(--line); border-radius: 12px; padding: 6px; background: var(--canvas); box-shadow: var(--shadow-lg); animation: pop-in .16s ease-out; }
@keyframes pop-in { from { transform: translateY(-4px); opacity: 0; } to { transform: none; opacity: 1; } }
.saypop button { display: flex; align-items: center; width: 100%; border: 0; border-radius: 8px; padding: 9px 10px; background: none; font-size: 14px; text-align: left; cursor: pointer; }
.saypop button:hover { background: var(--hover); }
.saypop button span { flex: 1; min-width: 0; }
.saypop button svg { flex: none; margin-left: 10px; color: var(--ink-4); }
.saypop button:hover svg { color: var(--brand); }
.saypop .foot { padding: 6px 10px 4px; border-top: 1px solid var(--line); margin-top: 4px; font-size: 12px; color: var(--ink-3); }
/* 在工作台里看报告：顶栏和侧栏不动，内容区整个交给报告（一个内嵌的页面），只有它自己滚动 */
.main.host { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
.content.host { display: flex; flex: 1; flex-direction: column; min-height: 0; max-width: none; padding: 0; }
.rpt-frame { display: block; flex: 1; width: 100%; min-height: 0; border: 0; background: var(--bg); }
.frame-hint { padding: 8px 28px; border-bottom: 1px solid var(--line); background: var(--subtle); font-size: 13px; color: var(--ink-2); }
.psel { height: 34px; max-width: 190px; margin-left: 8px; border: 1px solid var(--line-2); border-radius: 8px; padding: 0 8px; background: var(--canvas); font-size: 13px; }
.menu-btn { display: none; align-items: center; justify-content: center; width: 36px; height: 36px; margin: 0 8px 0 -6px; border: 0; border-radius: 8px; background: none; cursor: pointer; }
.menu-btn:hover { background: var(--hover); }
.scrim { display: none; }
.content { max-width: 1200px; padding: 28px 32px 64px; }
@media (max-width: 900px) {
  .side { position: fixed; left: 0; top: 0; transform: translateX(-102%); transition: transform .22s ease; }
  .side.open { transform: none; box-shadow: var(--shadow-lg); }  /* 收起时不带阴影，免得白底上左边缘露出一道灰 */
  .scrim.open { display: block; position: fixed; left: 0; right: 0; top: 0; bottom: 0; z-index: 19; background: rgba(15, 18, 21, .45); }
  .menu-btn { display: inline-flex; }
  .topbar { padding: 8px 16px; }
  .topbar .sub, .topbar .upd, .topbar .pill { display: none; }
  .saypop { right: 12px; }
  .frame-hint { padding: 8px 16px; }
  .psel { max-width: 172px; }
  .content { padding: 16px 16px 48px; }
}
@media (prefers-reduced-motion: reduce) { .side { transition: none; } .saypop { animation: none; } }

/* ───────── 通用组件 ───────── */
.row { display: grid; gap: 16px; }
.stack > * + * { margin-top: 24px; }
.row.c4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 901px) {
  .row.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
  .row.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .row.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
.card { min-width: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--canvas); padding: 16px; }
@media (min-width: 901px) { .card { padding: 20px 24px; } }
.card-h { display: flex; align-items: center; margin-bottom: 14px; }
.card-h h3 { margin: 0; font-size: 15px; font-weight: 600; }
.card-h .count { margin-left: 8px; font-size: 12px; color: var(--ink-3); }
.card-h .more { margin-left: auto; padding-left: 12px; font-size: 13px; white-space: nowrap; }
.card.flush { padding: 0; overflow: hidden; }
.card.flush .card-h { margin: 0; padding: 16px 16px 10px; }
.card.flush .pad { padding: 0 16px 16px; }
@media (min-width: 901px) { .card.flush .card-h { padding: 20px 24px 12px; } .card.flush .pad { padding: 0 24px 18px; } }
/* 状态：一个小圆点加两三个字，不用整块的彩色底 */
.st { display: inline-flex; flex: none; align-items: center; font-size: 12px; font-weight: 500; color: var(--ink-3); white-space: nowrap; }
.st::before { content: ''; flex: none; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: currentColor; }
.st.warn { color: var(--warn); }
.st.ok { color: var(--ok); }
.st.bad { color: var(--bad); }
.st.brand { color: var(--brand); }
.notice { border-radius: 10px; padding: 10px 14px; background: var(--warn-soft); color: var(--warn); font-size: 13px; font-weight: 500; }
.lead { max-width: 68em; margin: 0 0 14px; font-size: 13px; color: var(--ink-2); }
.pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 0 9px; font-size: 12px; font-weight: 600; line-height: 22px; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.brand { background: var(--brand-soft); color: var(--brand); }
.pill.plain { background: var(--hover); color: var(--ink-2); }
.tag { display: inline-block; margin-right: 6px; border-radius: 6px; padding: 0 6px; background: var(--hover); color: var(--ink-2); font-size: 12px; font-weight: 400; line-height: 20px; white-space: nowrap; vertical-align: 1px; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.empty { padding: 6px 0; font-size: 13px; color: var(--ink-3); }
.btn { display: inline-flex; align-items: center; margin: 0 8px 0 0; border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 14px; background: var(--canvas); color: var(--ink); font-size: 13px; font-weight: 600; cursor: pointer; }
.btn:hover { border-color: var(--brand-line); text-decoration: none; }
.btn.primary { border-color: var(--brand); background: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-2); }
.btn svg { margin-left: 6px; }
.textbtn { border: 0; padding: 0; background: none; color: var(--brand); font-size: 13px; cursor: pointer; }
.textbtn.more { margin-left: auto; padding-left: 12px; white-space: nowrap; }
.seg { display: inline-flex; max-width: 100%; overflow-x: auto; border-radius: 8px; padding: 3px; background: var(--hover); }
.seg button { border: 0; border-radius: 6px; padding: 4px 12px; background: none; font-size: 13px; color: var(--ink-2); white-space: nowrap; cursor: pointer; }
.seg button.on { background: var(--canvas); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(31, 35, 40, .14); }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { padding: 9px 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: none; font-size: 12px; font-weight: 500; color: var(--ink-3); text-align: left; white-space: nowrap; }
.tbl td { padding: 12px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl th:first-child, .tbl td:first-child { padding-left: 16px; }
.tbl th:last-child, .tbl td:last-child { padding-right: 16px; }
@media (min-width: 901px) { .tbl th:first-child, .tbl td:first-child { padding-left: 24px; } .tbl th:last-child, .tbl td:last-child { padding-right: 24px; } }
.tbl .r { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .c { text-align: center; }
.tbl .nw { white-space: nowrap; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--subtle); }
.tbl b { font-weight: 700; font-variant-numeric: tabular-nums; }
.pbar { display: block; height: 6px; min-width: 72px; border-radius: 3px; background: var(--hover); overflow: hidden; }
.pbar i { display: block; height: 100%; min-width: 2px; border-radius: 3px; background: var(--brand); }
.pbar.gray i { background: var(--ink-4); }
.kv { display: grid; grid-template-columns: 76px 1fr; gap: 8px 12px; margin: 0; font-size: 14px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; word-break: break-word; }
.d { display: inline-block; width: 12px; height: 12px; margin: 0 2.5px; border-radius: 50%; background: var(--line-2); opacity: .7; vertical-align: middle; }
.d.h { background: var(--brand); opacity: 1; }
.d.x { height: 2px; border-radius: 1px; }
.legend { display: flex; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; margin: 0 14px 4px 0; }
.legend .d { width: 9px; height: 9px; margin: 0 6px 0 0; }
/* 报告最下面的一行“可以这样跟员工说”：安静的一行，不加框 */
.say { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-top: 4px; }
.say .tt { margin-right: 4px; font-size: 12px; color: var(--ink-3); }
.say button { border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; background: var(--canvas); color: var(--ink-2); font-size: 13px; cursor: pointer; }
.say button:hover { border-color: var(--brand-line); color: var(--brand); }

/* ───────── 工作台首页 ───────── */
.banner { display: flex; align-items: flex-start; border: 1px solid var(--line); border-radius: var(--r); padding: 20px 18px; background: var(--canvas); }
@media (min-width: 901px) { .banner { padding: 24px 28px; } }
.banner .mascot { width: 40px; height: 40px; margin-right: 16px; }
.banner .body { flex: 1; min-width: 0; }
.banner .tt { font-size: 12px; font-weight: 500; letter-spacing: .02em; color: var(--ink-3); }
.banner .verdict { margin: 4px 0 0; font-size: 21px; font-weight: 700; line-height: 1.4; letter-spacing: -.01em; }
.banner .verdict b { color: var(--brand); }
.banner .brief { max-width: 46em; margin-top: 8px; font-size: 14px; line-height: 1.75; color: var(--ink-2); }
.banner .brief.clamp { display: -webkit-box; overflow: hidden; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.banner .textbtn { margin-top: 2px; }
.banner .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.banner .acts .btn { margin: 0; }
.banner.plain { border-color: var(--line); background: var(--canvas); }
.steps { margin: 0; padding: 0; list-style: none; }
.steps li { position: relative; display: flex; align-items: center; min-height: 40px; padding: 6px 0 6px 34px; font-size: 14px; }
.steps li::before { content: ''; position: absolute; left: 10px; top: 30px; bottom: -10px; width: 1px; background: var(--line); }
.steps li:last-child::before { display: none; }
.steps .mk { position: absolute; left: 0; top: 9px; display: flex; align-items: center; justify-content: center; width: 21px; height: 21px; border-radius: 50%; border: 1.5px solid var(--line-2); background: var(--canvas); color: #fff; }
.steps li.done .mk { border-color: var(--ok); background: var(--ok); }
.steps li.doing .mk { border-color: var(--brand); box-shadow: inset 0 0 0 4px var(--canvas); background: var(--brand); }
.steps .nm { flex: 1; min-width: 0; }
.steps li.todo .nm { color: var(--ink-3); }
.steps li.doing .nm { font-weight: 700; }
.steps .st { margin-left: 12px; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.steps li.doing .st { color: var(--brand); font-weight: 600; }
.kpi { position: relative; display: block; color: var(--ink); cursor: pointer; transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease; }
.kpi:hover { border-color: var(--brand-line); box-shadow: var(--shadow); transform: translateY(-1px); text-decoration: none; }
.kpi.static { cursor: default; }
.kpi.static:hover { border-color: var(--line); box-shadow: none; transform: none; }
@media (prefers-reduced-motion: reduce) { .kpi { transition: none; } .kpi:hover { transform: none; } }
.kpi-top { display: flex; align-items: center; min-height: 20px; font-size: 13px; color: var(--ink-3); }
.kpi-ico { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 26px; height: 26px; margin-right: 8px; border-radius: 8px; background: var(--brand-soft); color: var(--brand); }
.kpi-ico.bad { background: var(--bad-soft); color: var(--bad); }
.kpi-ico.ok { background: var(--ok-soft); color: var(--ok); }
.kpi-ico.plain { background: var(--hover); color: var(--ink-2); }
.kpi-num { display: block; margin-top: 10px; font-size: 32px; font-weight: 600; line-height: 1.15; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi-num.text { padding: 6px 0 5px; overflow: hidden; font-size: 18px; line-height: 1.4; letter-spacing: 0; text-overflow: ellipsis; white-space: nowrap; }
.kpi-num small { margin-left: 2px; font-size: 13px; font-weight: 400; color: var(--ink-3); letter-spacing: 0; }
.kpi-hint { display: block; margin-top: 6px; font-size: 12px; line-height: 1.5; color: var(--ink-3); }
/* 每个 AI 各提到几次：三根细条，代替一长串文字 */
.pmini { display: grid; grid-template-columns: max-content minmax(24px, 1fr) max-content; align-items: center; gap: 5px 8px; margin-top: 12px; font-size: 12px; line-height: 1.3; color: var(--ink-3); }
.pmini .pbar { min-width: 0; height: 4px; }
.pmini b { font-weight: 500; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.kpi .spark { position: absolute; right: 16px; top: 16px; width: 64px; height: 26px; }
@media (max-width: 640px) { .kpi .spark { position: static; display: block; margin-top: 8px; } }  /* 窄屏卡片放不下，走势图挪到最下面，不压住标题 */
/* 几个数放在一条里，中间用细线隔开，不各占一张卡片 */
.row.kpis { gap: 0; grid-template-columns: repeat(2, minmax(0, 1fr)); overflow: hidden; border: 1px solid var(--line); border-radius: var(--r); background: var(--canvas); }
.row.kpis > .kpi { border: 0; border-radius: 0; }
.row.kpis > .kpi:nth-child(2n) { border-left: 1px solid var(--line); }
.row.kpis > .kpi:nth-child(n+3) { border-top: 1px solid var(--line); }
@media (min-width: 901px) {
  .row.kpis.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .row.kpis.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .row.kpis > .kpi + .kpi { border-left: 1px solid var(--line); }
  .row.kpis > .kpi:nth-child(n+3) { border-top: 0; }
}
.row.kpis > .kpi:hover { border-color: var(--line); background: var(--subtle); box-shadow: none; transform: none; }
/* 首页和报告最上面的结论：不加框，大字直接放在白底上 */
.banner.hero { border: 0; border-radius: 0; padding: 4px 0 0; background: none; }
.banner.hero .verdict { font-size: 24px; letter-spacing: -.015em; }
@media (max-width: 640px) { .banner.hero .verdict { font-size: 20px; } }
.todos { margin: 0; padding: 0; list-style: none; counter-reset: todo; }
.todos li { position: relative; padding: 11px 0 11px 36px; border-top: 1px solid var(--line); }
.todos li:first-child { border-top: 0; padding-top: 2px; }
.todos li:last-child { padding-bottom: 2px; }
.todos li::before { counter-increment: todo; content: counter(todo); position: absolute; left: 0; top: 12px; width: 22px; height: 22px; border-radius: 50%; background: var(--brand); color: #fff; font-size: 12px; font-weight: 700; line-height: 22px; text-align: center; }
.todos li:first-child::before { top: 3px; }
.todos .t { font-weight: 600; }
.todos .w { margin-top: 1px; font-size: 13px; color: var(--ink-2); }
.mini-issue { display: flex; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.mini-issue:first-of-type { border-top: 0; padding-top: 2px; }
.mini-issue .tag { flex: none; margin-top: 1px; }
.mini-issue .tx { flex: 1; min-width: 0; }
.mini-issue .tx div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chart { display: block; width: 100%; height: 64px; margin-top: 8px; }
.t-axis { display: flex; justify-content: space-between; margin-top: 2px; font-size: 11px; color: var(--ink-3); }

/* ───────── 提及分析 ───────── */
.plat b { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.plat .pbar { margin-top: 8px; }
.qbar { display: flex; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.qtable { width: 100%; border-collapse: collapse; }
.qtable th { padding: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--ink-3); text-align: left; }
.qtable th.c { width: 88px; text-align: center; }
.qtable td { padding: 11px 0; border-top: 1px solid var(--line); vertical-align: middle; }
.qtable td.c { text-align: center; }
.qtable tr.grp td { padding: 18px 0 6px; border-top: 0; font-size: 12px; font-weight: 700; color: var(--ink-3); }
.qtable tbody tr.grp:first-child td { padding-top: 2px; }
.q-text { font-size: 14px; font-weight: 500; }
.qno { display: inline-block; min-width: 30px; margin-right: 6px; font-size: 12px; font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.qtable tr.hit .q-text { font-weight: 700; }
.q-meta { margin-top: 2px; font-size: 12px; color: var(--ink-3); }
.dotbtn { display: inline-flex; align-items: center; justify-content: center; min-width: 52px; border: 0; border-radius: 8px; padding: 9px 8px; background: none; cursor: pointer; }
.dotbtn:hover { background: var(--hover); }
.dotbtn:disabled { cursor: default; background: none; }
@media (max-width: 640px) {
  .qtable thead { display: none; }
  .qtable tr { display: flex; flex-wrap: wrap; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); }
  .qtable td { border: 0; padding: 0; }
  .qtable td:first-child { flex: 1 0 100%; padding-bottom: 8px; }
  .qtable td.c { display: flex; flex: 1 1 0; align-items: center; text-align: left; }
  .qtable td.c::before { content: attr(data-label); margin-right: 2px; font-size: 12px; color: var(--ink-3); }
  .qtable tr.grp { display: block; border-top: 0; padding: 14px 0 0; }
  .qtable tbody tr.grp:first-child { padding-top: 0; }
  .qtable tr.grp td { padding: 0; }
  .qtable tr.grp + tr { border-top: 0; }
  .dotbtn { min-width: 0; padding: 7px 6px; }
}

/* ───────── 报告里“和店铺资料对不上的说法”：是一条发现，不是警报，用中性的底色 ───────── */
.issue { padding: 0; overflow: hidden; }
.issue-top { display: flex; flex-wrap: wrap; align-items: center; padding: 14px 16px 0; }
.issue-top > * { margin: 0 8px 4px 0; }
.issue-top .meta { font-size: 12px; color: var(--ink-3); }
.ino { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
.issue-cmp { display: grid; gap: 8px; padding: 8px 16px 0; }
.cmp { border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.cmp .k { display: block; margin-bottom: 2px; font-size: 12px; font-weight: 700; }
.cmp.ai, .cmp.fact { border: 1px solid var(--line); background: var(--subtle); }
.cmp.ai .k, .cmp.fact .k { color: var(--ink-2); }
.issue-src { display: flex; align-items: flex-start; padding: 10px 16px 0; font-size: 13px; color: var(--ink-2); }
.issue-src svg { flex: none; margin: 3px 6px 0 0; color: var(--ink-3); }
.issue-src span { min-width: 0; word-break: break-word; }
.issue-fix { margin: 12px 16px 16px; border-radius: 10px; padding: 10px 12px; background: var(--brand-soft); font-size: 14px; }
.issue-fix .k { display: block; margin-bottom: 2px; font-size: 12px; font-weight: 700; color: var(--brand); }
@media (min-width: 901px) {
  .issue-top { padding: 16px 20px 0; }
  .issue-cmp { grid-template-columns: 1fr 1fr; gap: 10px; padding: 8px 20px 0; }
  .issue-src { padding: 10px 20px 0; }
  .issue-fix { margin: 12px 20px 18px; }
}

/* ───────── 同类店、内容来源 ───────── */
.rank { display: grid; grid-template-columns: 20px minmax(92px, 34%) 1fr 48px; align-items: center; column-gap: 10px; padding: 7px 0; font-size: 14px; }
.rank .i { font-size: 12px; color: var(--ink-3); text-align: center; }
.rank .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .track { height: 8px; border-radius: 4px; background: var(--hover); overflow: hidden; }
.rank .track i { display: block; height: 100%; min-width: 3px; border-radius: 4px; background: var(--ink-4); }
.rank .v { font-size: 13px; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
.rank.self .n { font-weight: 700; color: var(--brand); }
.rank.self .track i { background: var(--brand); }
.rank-table { margin: 14px -16px -16px; }
.rank-table .tbl th:first-child, .rank-table .tbl td:first-child { padding-left: 16px; }
.rank-table .tbl th:last-child, .rank-table .tbl td:last-child { padding-right: 16px; }
@media (min-width: 901px) {
  .rank-table { margin: 16px -20px -18px; }
  .rank-table .tbl th:first-child, .rank-table .tbl td:first-child { padding-left: 20px; }
  .rank-table .tbl th:last-child, .rank-table .tbl td:last-child { padding-right: 20px; }
}
.stackbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--hover); }
.stackbar i { display: block; height: 100%; }
.stack-legend { margin: 12px 0 0; padding: 0; list-style: none; }
.stack-legend li { display: flex; align-items: center; padding: 3px 0; font-size: 13px; }
.stack-legend .sw { flex: none; width: 8px; height: 8px; margin-right: 8px; border-radius: 2px; }
.stack-legend .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stack-legend .pc { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.refs { margin: 12px 0 0; padding: 0; list-style: none; }
.refs li { display: flex; padding: 10px 0; border-top: 1px solid var(--line); }
.refs li:first-child { border-top: 0; }
.refs li > div { min-width: 0; }
.refs .ico { display: flex; flex: none; align-items: center; justify-content: center; width: 28px; height: 28px; margin-right: 10px; border-radius: 8px; background: var(--hover); color: var(--ink-2); }
.refs .tt { display: -webkit-box; overflow: hidden; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 14px; line-height: 1.45; color: var(--ink); word-break: break-word; }
.refs a.tt:hover { color: var(--brand); text-decoration: none; }
.refs .mt { margin-top: 2px; font-size: 12px; color: var(--ink-3); }
.quotes { display: grid; gap: 16px 24px; }
@media (min-width: 901px) { .quotes { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.quote { position: relative; padding-left: 30px; }
.quote::before { content: '\201C'; position: absolute; left: 0; top: -6px; font: 700 40px/1 Georgia, 'Times New Roman', serif; color: var(--brand-line); }
.quote .who { font-size: 12px; font-weight: 700; color: var(--ink-3); }
.quote .say-text { margin-top: 2px; font-size: 14px; }
.gap-row { display: flex; align-items: flex-start; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.gap-row:first-of-type { border-top: 0; padding-top: 0; }
.gap-row:last-child { padding-bottom: 0; }
.gap-row .tag { flex: none; margin-top: 2px; }

/* ───────── 监测设置 ───────── */
.rowlist { margin: 0; padding: 0; list-style: none; }
.rowlist li { padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.rowlist li:first-child { border-top: 0; padding-top: 0; }
.rowlist li:last-child { padding-bottom: 0; }
.rowlist .mt { margin-top: 2px; font-size: 12px; color: var(--ink-3); }
.blk-text .p { white-space: pre-wrap; word-break: break-word; }
.blk-text .gap { height: 8px; }
.t-strong { margin-top: 4px; font-weight: 700; }
.note-tags { margin-top: 12px; }
.note-tags span { display: inline-block; margin: 0 8px 4px 0; color: var(--brand); font-size: 14px; }
/* 每周问的问题：一题两行，第一行是问题，第二行灰字写替谁问、他在意什么 */
.qlist { margin: 0; padding: 0; list-style: none; }
.qlist li { display: flex; align-items: baseline; padding: 12px 16px; border-top: 1px solid var(--line); }
.qlist li:first-child { border-top: 0; }
.qlist .qno { flex: none; width: 36px; }
.qlist .qb { flex: 1; min-width: 0; }
.qlist .qt { font-size: 14px; font-weight: 500; line-height: 1.55; }
.qlist .qm { margin-top: 2px; font-size: 12px; color: var(--ink-3); }
.qlist li.qgrp { display: block; padding: 18px 16px 6px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
@media (min-width: 901px) { .qlist li { padding: 12px 24px; } .qlist li.qgrp { padding: 20px 24px 6px; } }

/* ───────── 内容：一篇一行，点开从右边滑出稿子 ───────── */
.clist { display: block; }
.card.flush > .card-h + .clist { border-top: 1px solid var(--line); }
.cgrp { padding: 14px 16px 4px; font-size: 12px; font-weight: 600; color: var(--ink-3); }
.cgrp ~ .cgrp { margin-top: 6px; border-top: 1px solid var(--line); }
.cgrp + .crow { border-top: 0; }
@media (min-width: 901px) { .cgrp { padding: 16px 24px 4px; } }
.crow { display: flex; align-items: center; width: 100%; border: 0; border-top: 1px solid var(--line); padding: 14px 16px; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.crow:first-child { border-top: 0; }
.crow:hover { background: var(--subtle); }
.crow:focus-visible { outline-offset: -2px; }
.crow .cm { display: block; flex: 1; min-width: 0; }
.crow .t { display: block; overflow: hidden; font-size: 15px; font-weight: 600; line-height: 1.45; text-overflow: ellipsis; white-space: nowrap; }
.crow .m { display: block; margin-top: 3px; overflow: hidden; font-size: 12px; color: var(--ink-3); text-overflow: ellipsis; white-space: nowrap; }
.crow .st { margin-left: 16px; }
.crow .chev { display: flex; flex: none; margin-left: 8px; color: var(--ink-4); }
.crow:hover .chev { color: var(--ink-2); }
@media (min-width: 901px) { .crow { padding: 14px 24px; } }
@media (max-width: 640px) { .crow .t { white-space: normal; } }
.siterow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.siterow .cm { flex: 1; min-width: 180px; }
.siterow .t { font-size: 15px; font-weight: 600; }
.siterow .m { margin-top: 2px; font-size: 12px; color: var(--ink-3); }
.siterow .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.siterow .acts .btn { margin: 0; }
/* 稿子抽屉：电脑上从右边滑出，手机上铺满 */
.sheet.drawer { align-items: stretch; justify-content: flex-end; padding: 0; }
.sheet.drawer .sheet-panel { display: flex; flex-direction: column; width: 600px; max-width: 100%; height: 100%; max-height: none; overflow: hidden; border-radius: 0; box-shadow: var(--shadow-lg); animation: drawer-in .28s cubic-bezier(.19, 1, .22, 1); }
@keyframes drawer-in { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet.drawer .sheet-panel { animation: none; } }
.sheet.drawer .sheet-head { padding: 18px 24px 14px; }
.sheet.drawer .sheet-head h3 { font-size: 18px; }
.drawer-body { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 24px 32px; }
.drawer-foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 24px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--canvas); }
.drawer-foot .btn { margin: 0; }
.dmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; font-size: 12px; color: var(--ink-3); }
.dinfo { margin-top: 16px; border-radius: 10px; padding: 12px 14px; background: var(--subtle); font-size: 13px; line-height: 1.7; }
.dinfo dd { color: var(--ink-2); }
.dlabel { margin-top: 22px; font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--ink-3); }
.ans-text.read { max-width: 36em; margin-top: 18px; font-size: 15px; line-height: 1.85; }
.dlabel + .ans-text.read { margin-top: 8px; }
.ans-text.read .h { margin-top: 18px; font-size: 16px; }
.ans-text.read .p { margin-top: 6px; }

/* ───────── 点开一格：AI 的原话 ───────── */
.sheet { position: fixed; left: 0; right: 0; top: 0; bottom: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center; background: rgba(15, 18, 21, .5); }
.sheet[hidden] { display: none; }
.sheet-panel { width: 100%; max-width: 760px; max-height: 90vh; overflow-y: auto; -webkit-overflow-scrolling: touch; border-radius: 16px 16px 0 0; background: var(--canvas); animation: sheet-up .28s cubic-bezier(.19, 1, .22, 1); }
@keyframes sheet-up { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (min-width: 760px) { .sheet { align-items: center; padding: 24px; } .sheet-panel { border-radius: 16px; box-shadow: var(--shadow-lg); } }
@media (prefers-reduced-motion: reduce) { .sheet-panel { animation: none; } }
.sheet-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: flex-start; padding: 16px 18px 12px; border-bottom: 1px solid var(--line); background: var(--canvas); }
.sheet-head h3 { flex: 1; margin: 0; font-size: 16px; line-height: 1.45; }
.sheet-head .who { display: block; margin-bottom: 2px; font-size: 12px; font-weight: 700; color: var(--brand); }
.sheet-x { display: flex; flex: none; align-items: center; justify-content: center; width: 32px; height: 32px; margin-left: 12px; border: 0; border-radius: 50%; background: var(--hover); cursor: pointer; }
.ans { padding: 16px 18px 18px; border-top: 8px solid var(--bg); }
.sheet-head + .ans { border-top: 0; }
.link-input { display: block; width: 100%; margin: 10px 0 12px; border: 1px solid var(--line-2); border-radius: 8px; padding: 8px 10px; background: var(--canvas); color: var(--ink); font-size: 13px; }
.sheet.preview .sheet-panel { display: flex; flex-direction: column; max-width: 460px; height: 88vh; overflow: hidden; }
.sheet.preview .sheet-head { align-items: center; }
.sheet.preview .sheet-head .btn { flex: none; margin: 0 0 0 12px; }
.preview-frame { flex: 1; width: 100%; min-height: 0; border: 0; background: #fff; }
.ans:last-child { padding-bottom: calc(18px + env(safe-area-inset-bottom)); }
.ans-flags { display: flex; flex-wrap: wrap; align-items: center; }
.ans-flags > * { margin: 0 8px 6px 0; }
.ans-no { font-size: 13px; font-weight: 700; }
.ans-text { font-size: 14.5px; line-height: 1.75; }
.ans-text .h { margin-top: 10px; font-weight: 700; }
.ans-text .p { margin-top: 4px; white-space: pre-wrap; word-break: break-word; }
.ans-text .gap { height: 6px; }
mark { border-radius: 4px; padding: 0 3px; background: var(--brand-soft); color: var(--brand); font-weight: 700; }
.ans details { margin-top: 14px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; }
.ans details > summary { padding: 10px 0; font-size: 13px; font-weight: 600; cursor: pointer; }
.ans details .refs { margin-top: 0; border-top: 1px solid var(--line); }
.toast { position: fixed; left: 50%; bottom: 28px; z-index: 40; transform: translateX(-50%); border-radius: 8px; padding: 8px 14px; background: var(--ink); color: var(--canvas); font-size: 13px; box-shadow: var(--shadow-lg); }
</style>
</head>
<body>
<noscript><p class="noscript">这个页面需要开启 JavaScript 才能显示。</p></noscript>
<div id="app" class="app"></div>
<div id="sheet" class="sheet" hidden><div class="sheet-panel" role="dialog" aria-modal="true" aria-label="AI 的原话"></div></div>
<script type="application/json" id="geo-data">__GEO_DATA__</script>
<script>
(function () {

  /* 在工作台里看某一期的报告：把那一期的报告文件嵌进内容区。报告文件是独立的，也可以单独打开。 */

    var third = S.buyEntry
      ? withTip(kpi('cart', S.buyEntry.count ? 'ok' : 'plain', '给出购买入口', S.buyEntry.count, '/ ' + S.buyEntry.valid, ''), BUY_TIP)
      : (rivals.length ? kpi('users', 'plain', '最常被提到的店', rivals[0].name, '', rivals[0].count + ' 次，你 ' + S.mention.hits + ' 次', null, null, null, true) : null);
    var cellsKpi = [
      kpi('eye', 'brand', '没点名时提到你', S.mention.hits, '/ ' + S.mention.valid, before ? '上一期 ' + before.mention.before : providerMini(S.mention)),
      kpi('ext', S.refs.own ? 'ok' : 'plain', '你的内容被引用', S.refs.own, '次', before && before.ownRefs.before !== null ? '上一期 ' + before.ownRefs.before + ' 次' : '门店页 ' + S.refs.storePages + ' 次 · 别人写你 ' + S.refs.aboutStore + ' 次'),
      third,
      kpi('list', 'plain', '这一期拿到的回答', S.returned, '/ ' + S.expected, S.complete ? '数据完整' : '这一期数据不全')].filter(Boolean);
    root.appendChild(row.apply(null, ['c' + cellsKpi.length + ' kpis'].concat(cellsKpi)));
    findingsCard(root);
    if ((DATA.actions.todos || []).length) {
      var todos = card('这一期建议你做的', DATA.actions.todos.length + ' 件');
      todoList(todos);
      root.appendChild(todos);
    }
    add(root, notesCard('读这份报告前要知道的'));
  }
  function reportMentions(root, S) {
    var questions = DATA.questions || [];
    var period = { dots: DATA.dots || {} };
    var open = questions.filter(function (q) { return q.kind === 'open'; });
    var hitCount = open.filter(function (q) { return hasHit(period, q.id); }).length;
    root.appendChild(h2('mentions', 'AI 有没有提到你', open.length + ' 道没点名的题里，' + hitCount + ' 道提到了你'));
    var tiles = el('div', 'row c3');
    DATA.providers.forEach(function (p) {
      var bucket = S.mention.byProvider[p.id] || { hits: 0, valid: 0 };
      tiles.appendChild(add(card(p.name), add(el('div', 'plat'), el('b', '', ratio(bucket)), el('span', 'small muted', ' 个回答提到你'), pbar(bucket.hits, bucket.valid || 1))));
    });
    root.appendChild(tiles);
    var box = card('每个问题的结果');
    var t = el('table', 'qtable');
    var head = el('tr');
    head.appendChild(el('th', '', '问题'));
    DATA.providers.forEach(function (p) { head.appendChild(el('th', 'c', p.name)); });
    t.appendChild(add(el('thead'), head));
    var body = el('tbody');
    var openRows = [];
    function group(kind, label) {
      var list = questions.filter(function (q) { return q.kind === kind; });
      if (!list.length) { return; }
      var cell = el('td', '', label);
      cell.colSpan = DATA.providers.length + 1;
      body.appendChild(add(el('tr', 'grp'), cell));
      list.forEach(function (question) {
        var hit = hasHit(period, question.id);
        var tr = el('tr', hit ? 'hit' : '');
        var who = [question.audience ? '替“' + question.audience + '”问' : '', question.worry ? '在意：' + question.worry : ''].filter(Boolean).join(' · ');
        add(tr, add(el('td'), add(el('div', 'q-text'), el('span', 'qno', qno(question.id)), question.text), el('div', 'q-meta', [question.tag, who].filter(Boolean).join(' · '))));
        DATA.providers.forEach(function (p) {
          var td = el('td', 'c');
          td.setAttribute('data-label', p.name);
          tr.appendChild(add(td, cellButton('dotbtn', question, p.id, (period.dots[question.id] || {})[p.id] || '', true)));
        });
        body.appendChild(tr);
        if (kind === 'open') { openRows.push({ row: tr, hit: hit }); }
      });
    }
    group('open', '顾客没点名时');
    group('brand', '顾客点名问你时');
    var filter = el('div', 'seg');
    var buttons = [];
    [['all', '全部 ' + open.length], ['hit', '提到你的 ' + hitCount], ['miss', '没提到的 ' + (open.length - hitCount)]].forEach(function (option, index) {
      var btn = button(index === 0 ? 'on' : '', option[1], function () {
        buttons.forEach(function (b) { b.className = b === btn ? 'on' : ''; });
        openRows.forEach(function (entry) { entry.row.style.display = option[0] === 'all' || (option[0] === 'hit') === entry.hit ? '' : 'none'; });
      });
      buttons.push(btn);
      filter.appendChild(btn);
    });
    add(box, add(el('div', 'qbar'), filter), add(t, body), legend());
    root.appendChild(box);
  }
  function reportRivals(root, S) {
    root.appendChild(h2('rivals', '顾客没点名时，AI 提到了哪些店'));
    var period = { shops: DATA.shops || [], mention: S.mention };
    if (DATA.shopsPending) { root.appendChild(add(card(), el('div', 'empty', '员工还有 ' + DATA.shopsPending + ' 个回答没读完，读完这里才会列出来。'))); return; }
    if (!period.shops.length) { root.appendChild(add(card(), el('div', 'empty', '这一期 AI 的回答里没有推荐别的店。'))); return; }
    rivalsSection(root, period);
  }
  function reportSources(root, S) {
    root.appendChild(h2('sources', 'AI 读的是哪里的内容'));
    var sources = DATA.sources || {};
    var totals = {};
    DATA.providers.forEach(function (p) { (sources[p.id] || []).forEach(function (item) { totals[item.type] = (totals[item.type] || 0) + item.count; }); });
    var order = Object.keys(totals).filter(function (t) { return t !== '其他网站'; }).sort(function (a, b) { return totals[b] - totals[a]; });
    function color(type) { var index = order.indexOf(type); return index >= 0 && index < 7 ? 'var(--c' + (index + 1) + ')' : 'var(--c0)'; }
    var grid = el('div', 'row c3');
    DATA.providers.forEach(function (p) {
      var box = card(p.name + ' 常读');
      var list = (sources[p.id] || []).slice(0, 5);
      if (!list.length) { grid.appendChild(add(box, el('div', 'empty', '这个平台这一期没有返回引用。'))); return; }
      var bar = el('div', 'stackbar');
      var items = el('ul', 'stack-legend');
      list.forEach(function (item) {
        var segment = el('i');
        segment.style.width = item.pct + '%';
        segment.style.background = color(item.type);
        segment.title = item.type + ' ' + item.pct + '%';
        bar.appendChild(segment);
        var swatch = el('span', 'sw');
        swatch.style.background = color(item.type);
        add(items, add(el('li'), swatch, el('span', 'nm', item.type), el('span', 'pc', item.pct + '%')));
      });
      grid.appendChild(add(box, bar, items));
    });
    root.appendChild(grid);
    var related = card('被 AI 引用的、和你有关的内容', '你的账号和网站 ' + S.refs.own + ' 次 · 门店页 ' + S.refs.storePages + ' 次 · 别人写你 ' + S.refs.aboutStore + ' 次');
    var groups = [['own', '你的账号和网站', '这一期 AI 没有引用你自己的账号和网站上的内容。'], ['store', '你的门店页', '这一期 AI 没有引用地图或点评上的门店页。'], ['about', '别人写你的', '这一期 AI 没有引用别人写你的内容。']];
    var seg = el('div', 'seg');
    var holder = el('div');
    var segButtons = [];
    var data = DATA.related || {};
    var fill = function (group) {
      holder.textContent = '';
      var list = data[group[0]] || [];
      if (!list.length) { holder.appendChild(el('div', 'empty', group[2])); return; }
      holder.appendChild(refList(list.slice(0, 10).map(function (item) {
        return { t: item.title, u: item.url, k: item.type, s: [item.source, '用在 ' + item.usedIn.length + ' 个回答里'].filter(Boolean).join(' · '), r: '' };
      })));
    };
    var first = 0;
    for (var g = 0; g < groups.length; g++) { if ((data[groups[g][0]] || []).length) { first = g; break; } }
    groups.forEach(function (group, index) {
      var btn = button(index === first ? 'on' : '', group[1] + ' ' + (data[group[0]] || []).length, function () {
        segButtons.forEach(function (b) { b.className = b === btn ? 'on' : ''; });
        fill(group);
      });
      segButtons.push(btn);
      seg.appendChild(btn);
    });
    fill(groups[first]);
    root.appendChild(add(related, seg, holder));
    add(root, gapsCard());
  }
  function reportSays(root, S) {
    root.appendChild(h2('says', 'AI 怎么介绍你', '顾客点名问你时'));
    var descriptions = DATA.descriptions || {};
    var said = DATA.providers.filter(function (p) { return descriptions[p.id]; });
    if (said.length) {
      var quotes = el('div', 'quotes');
      said.forEach(function (p) { quotes.appendChild(add(el('div', 'quote'), el('div', 'who', p.name), el('div', 'say-text', descriptions[p.id]))); });
      root.appendChild(add(card(), quotes));
    }
    var issues = DATA.issues || [];
    if (!issues.length) {
      root.appendChild(add(card(), el('div', 'small muted', S.judged
        ? '员工把这些回答和你的店铺资料逐条对过，没有发现对不上的说法。'
        : '员工还在核对这些回答，核对完这里会更新。')));
      return;
    }
    /* 有对不上的才列出来。它只是这一期的一种发现，不是每家店都有 */
    var unsure = DATA.factsFrom === 'public' && !DATA.factsConfirmed;
    root.appendChild(el('div', 'sec-label', unsure
      ? '其中有 ' + issues.length + ' 处和员工整理的资料对不上。这份资料还没经过你确认，不一定是 AI 说错'
      : '其中有 ' + issues.length + ' 处和你的店铺资料对不上'));
    issues.forEach(function (issue) { root.appendChild(issueCard(issue)); });
  }
  function reportFooter(root) {
    var written = DATA.contents || [];
    if (written.length) {
      var box = card('这一期替你写的内容', written.length + ' 篇', nav('去工作台看稿子', 'content', 'more'));
      /* 报告生成后不再更新，这里不写状态（确认、发布都是之后的事），现在的状态在工作台上看 */
      written.forEach(function (item) {
        box.appendChild(add(el('div', 'gap-row'), el('span', 'tag', item.typeName), el('b', '', item.title)));
      });
      root.appendChild(box);
    }
    var silent = DATA.providers.filter(function (p) { return !((DATA.summary.mention.byProvider[p.id] || {}).hits); });
    var issues = DATA.issues || [];
    root.appendChild(sayBlock([silent.length ? '为什么' + silent[0].name + '不提我' : '怎么让 AI 多提我',
      '把 Q3 换一个问法', '把同类店换成我真正的对手', issues.length && issues[0].no ? issues[0].no + ' 号我改好了' : '重新体检一次']));
    root.appendChild(el('div', 'rpt-foot', '第 ' + P.no + ' 期体检 · 生成于 ' + updatedAt()));
  }
  /* 嵌在工作台里时，显示出来以后跟外面打个招呼（外面据此知道报告显示成功了）。一层一层往上说，中间隔着别的壳也能传到 */
  function tellAncestors(message) {
    try {
      var w = window;
      for (var i = 0; i < 4 && w.parent && w.parent !== w; i++) { w = w.parent; w.postMessage(message, '*'); }
    } catch (error) { /* 说不出去不影响报告本身 */ }
  }
  function renderReport() {
    var S = DATA.summary;
    var wrap = el('div', 'rpt');
    var head = null;
    if (!EMBED) {
      /* 单独打开时自带标题和回工作台的入口；嵌在工作台里时这些由工作台的顶栏和侧栏负责 */
      head = el('header', 'rpt-head');
      var back = null;
      if (BASE) { back = el('a', 'btn', '回工作台'); back.href = BASE + '#/overview'; }
      add(head, mascot(), add(el('div', 'rpt-title'), el('div', 't1', (DATA.store.name || '本店') + ' · AI 曝光体检报告'),
        el('div', 't2', '第 ' + P.no + ' 期 · ' + cnDate(P.date) + '体检')), el('span', 'sp'), back);
    }
    var toc = el('nav', 'rpt-toc');
    SECTIONS.forEach(function (section) { var a = el('a', '', section[1]); a.href = '#' + section[0]; toc.appendChild(a); });
    content = el('main', 'content stack');
    add(content, demoStrip());
    reportSummary(content, S);
    reportMentions(content, S);
    reportRivals(content, S);
    reportSources(content, S);
    reportSays(content, S);
    reportFooter(content);
    add(app, add(wrap, head, toc, content));
    app.className = 'app report' + (EMBED ? ' embedded' : '');
    document.title = '第 ' + P.no + ' 期体检报告 · ' + (DATA.store.name || '本店');
    var hash = String(location.hash || '');
    var jump = EMBED ? (hash.split('/')[1] || '') : hash.slice(1);
    var target = jump ? document.getElementById(jump) : null;
    if (target && target.scrollIntoView) { target.scrollIntoView(); }
    if (EMBED) { tellAncestors({ geo: 'report-ready', date: P.date }); }
  }

  try { connectHost(); } catch (error) { /* 连不上客户端不影响页面 */ }
  if (KIND === 'report') {
    if (EMBED) { window.addEventListener('message', onAskAnswered); }
    renderReport();
  } else {
    renderShell();
    window.addEventListener('hashchange', route);
    window.addEventListener('message', onFrameMessage);
    route();
  }
})();
</script>
</body>
</html>
