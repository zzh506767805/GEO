taskKey: geo-weekly-check
taskTemplateCode: ''
templateName: 每周 AI 曝光体检
templateDesc: 每周一上午替你问一遍各个 AI 助手，出一份体检报告、更新工作台，并按平台备好一篇内容。
taskType: timer
scheduleType: cron
cronExpression: 0 9 * * 1
intervalSeconds: 0
runDate: ''
timezone: Asia/Shanghai
taskConfig: ''
promptTemplate: |-
  先查 geo-profile 状态；尚未建档时只建档并请商家确认，firstCheckPending 为 true 时只提醒等待首次确认，不体检、不写内容。
  完成首次确认后，依次使用 geo-check 和 geo-weekly 完成本周体检和周报；以后每次触发直接执行，不询问用户确认。
  还没有建档时先使用 geo-profile 建档；已经建档的，体检前按 geo-profile 重新读一遍店铺资料。
  体检结果要生成这一期的体检报告并同步工作台，周报里给这一期报告的链接。
  这一期写的内容要先登记到工作台，等商家确认后再发或存入草稿箱；现在还不能替商家写内容时不写，只请商家看一眼工作台的“监测设置”。
  任务结束后总结成一句话：
  “本周体检完成：Y 个回答里有 X 个提到本店，本周内容：待确认 / 未写。”
enabled: 1
sortOrder: 0
