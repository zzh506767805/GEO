人均约¥112），以及**储缘蛋糕(留下镇店)**、**优口食品(西溪路店)** 等烘焙店。","mentioned":false,"memory":false,"refs":[{"t":"【木子木烘焙店(西溪店)】地址,电话,路线,周边设施_360地图","s":"360公司官网","u":"https://m.map.360.cn/m/search/detail/pid=1cf134d25d404460","k":"地图","r":""},{"t":"杭州有哪些正宗的欧包店？","s":"zhihu","u":"https://www.zhihu.com/question/292071931#0","k":"知乎","r":""},{"t":"杭州市西湖区魏祖星烘焙店 - 企业工商信息 - 天眼查","s":"天眼查","u":"https://www.tianyancha.com/company/3283251645","k":"其他网站","r":""},{"t":"布诺滋烘焙","s":"Apple Maps: Directio","u":"https://maps.apple.com/place?auid=1118368896041747\u0026lsp=57879","k":"地图","r":""},{"t":"杭州市西湖区麦的日尝烘培店（个体工商户） - 企业工商信息 - 天眼查","s":"天眼查","u":"https://www.tianyancha.com/company/6980858527","k":"其他网站","r":"about"},{"t":"號麥吐司店 (杭州 黃龍體育中心/浙江大學玉泉及西溪校區)－餐牌、食評及資訊｜Trip.com","s":"Trip.com","u":"https://hk.trip.com/restaurant/china/hangzhou/detail/restaurant-133732121/","k":"其他网站","r":""},{"t":"红焙悦.西溪君逸汇店","s":"Apple Maps: Directio","u":"https://maps.apple.com/place?place-id=H2710I3F95B3073B140\u0026_provider=57879","k":"地图","r":""},{"t":"杭州市西湖区莱福面包店（个体工商户） - 企业工商信息 - 天眼查","s":"天眼查","u":"https://www.tianyancha.com/company/7329721085","k":"其他网站","r":""},{"t":"【BUNUOZI布诺滋】地址,电话,路线,周边设施_360地图","s":"360公司官网","u":"https://m.map.360.cn/m/search/detail/pid=ddea6d2a9a9ff07c","k":"地图","r":""},{"t":"","s":"杭州本地宝","u":"http://hz.bendibao.com/wangdian/dian/3945820.shtm","k":"其他网站","r":""},{"t":"慕斯先生(留下店)_电话_地址|在哪里|地图-杭州本地宝","s":"杭州本地宝","u":"http://hz.bendibao.com/wangdian/dian/3945776.shtm","k":"其他网站","r":""}]}],"q11_doubao":[{"text":"给你挑了留下附近两家风格完全不一样的面包店，一家社区小店主打抹茶面包，一家商场里适合逛街歇脚：\n \n麦的日尝·daily(西溪店)｜社区宝藏，抹茶爱好者首选\n \n📍西湖区留下街道西溪路596号701室‑2\n✅亮点：社区小店，面包用料扎实，五十铃抹茶吐司、抹茶乳酪草莓恰巴塔口碑很高，抹茶是清苦挂，不会齁甜。有少量座位，适合简单坐下来吃；米面包、恰巴塔、贝果品类多，很适合喜欢日式面包的人。\n✅适合：想吃高品质抹茶面包、安静小坐，就在西溪路沿街。\n \n\n \n取乑(西溪印象城店)｜商场里，选择多，可歇脚\n \n📍余杭区五常大道1号西溪印象城MA栋B1M层\n✅亮点：地铁3号线洪园站直达，米面包、小方蛋糕、罐子蛋糕是招牌，青提小方、开心果树莓罐子蛋糕很受欢迎，有免费试吃，品类丰富。商场店座位多，逛完印象城可以停下来下午茶。\n✅适合：逛西溪印象城，想要选择多、方便停车地铁，兼顾面包+小蛋糕。\n \n\n \n快速选：\n \n偏爱抹茶、日式米面包，想逛西溪路沿街 → 麦的日尝\n\n逛印象城、要交通便利、面包蛋糕都想吃 → 取乑\n \n如果你更偏向碱水、贝果，或者想要更多座位，我可以再帮你筛备选。","mentioned":true,"memory":false,"refs":[]},{"text":"如果你更喜欢碱水、硬欧，我可以再帮你筛附近其他店。","mentioned":false,"memory":false,"refs":[]}],"q11_hunyuan":[{"text":"杭州西溪路留下附近有不少不错的烘焙选择，如果看重口味品质，优先推荐去 **DRUNK BAKER** 或 **Cycle\u0026Cycle**。我按不同的口味偏好帮你挑了几家：\n\n### 一、偏爱西式创意面包\n\n#### 1. DRUNK BAKER（杭州西溪印象城店）｜西溪印象城好评榜首\n在西溪印象城面包蛋糕好评榜排第 1，招牌提子奶酪恰巴塔和抹茶柚子蛋糕都很值得试，适合喜欢丰富搭配的人。\n\n\n\n\n\n#### 2. Cycle\u0026Cycle Artisan（天目里店）｜古墩路沿线热门榜首\n这家是古墩路沿线面包蛋糕热门榜第 1，主打工艺独特的盐面包和生吐司，人均 38 元性价比很高。\n\n\n\n\n\n### 二、偏爱中式传统糕饼\n\n#### 1. 南宋胡记（杭州灵隐寺店）｜宋韵中式糕饼\n主打宋韵中式糕饼，荷花酥和龙井茶酥是招牌，人均 36 元，适合买来送人或自己解馋。\n\n\n\n\n\n#### 2. 知味观食品（和家园店）｜老牌中式点心\n主打老牌中式糕饼，条头糕和龙井酥都是经典招牌，人均 39 元，离你大概 1.4 公里。\n\n\n\n\n\n### 三、追求用料扎实\n\n#### 1. UH祐禾（杭州西溪印象城店）｜料足味好\n西溪印象城甜品热门榜第 1，招牌红豆肉松吐司用料特别扎实，人均 39 元，适合喜欢咸甜交织口感的朋友。\n\n\n\n\n\n### 怎么选\n- **想吃西式创意面包**：首选 **DRUNK BAKER**，或者去天目里的 **Cycle\u0026Cycle**。\n- **偏爱中式传统糕点**：选 **南宋胡记** 或 **知味观**。\n- **想要用料扎实的吐司**：去印象城的 **UH祐禾** 准没错。\n\n你是打算买点早餐面包，还是下午茶解馋？我可以再帮你看看哪家更合适。","mentioned":false,"memory":false,"refs":[{"t":"储缘烘焙(留下镇店)","s":"city8","u":"https://m.city8.com/hz/cater/8c1o0o785cl5b206cb","k":"其他网站","r":""},{"t":"360地图 - 出门之前,搜一下","s":"360地图","u":"https://ditu.so.com/site/detail/a857dd4a8149c1ae","k":"其他网站","r":""},{"t":"莫卡乡村(留下大街店)","s":"百度百科","u":"https://baike.baidu.com/item/莫卡乡村（留下大街店）/14305245","k":"百度系","r":""},{"t":"欢乐颂烘焙(留下店)","s":"携程旅行","u":"https://you.ctrip.com/food/hangzhou14/17024822-sight.html","k":"携程","r":""},{"t":"在杭州还好没错过这家面包店","s":"携程旅行","u":"https://m.ctrip.com/webapp/you/community/detail?articleId=83299490","k":"携程","r":""},{"t":"浙大学长学姐严选!开学季美食打卡清单,快收好","s":"美丽西湖","u":"http://mp.weixin.qq.com/s?src=11\u0026timestamp=1791466867\u0026ver=7014\u0026signature=VRXZHpJTODwv6XZGIRE6OtoEuBvgbBxXJmnVm15n9mtgSrK4VwzYcz7H6V8g4HFpI7BXiBVzxZ-1ujfhNwX57-yOjZLM0756XcvtxXGMk4kfmal2ETTJ2YLnrBxnB5XM\u0026new=1","k":"微信公众号","r":""}]},{"text":"留下附近想吃现烤面包，**DRUNK BAKER** 和 **UH祐禾** 都在西溪印象城里，距离相近，可以一起逛；想就近买中式糕饼，选 **知味观食品（和家园店）**。如果只想找一家坐下喝咖啡，可以去 **东坡的寂寞**。\n\n### 一、逛商场顺路买\n\n#### 1. DRUNK BAKER（杭州西溪印象城店）\n\n提子奶酪恰巴塔、抹茶柚子蛋糕是代表性选择，适合买现烤欧包和甜点；就在西溪印象城 BM 层。\n\n\n\n[](@replace=media_8a71a14bf29162be)\n\n\n#### 2. UH祐禾（杭州西溪印象城店）\n\n主打红豆肉松吐司，肉松量比较足，适合喜欢咸甜口味的人；与 DRUNK BAKER 同在印象城，逛街时可以顺路对比。\n\n\n\n[](@replace=media_60d5df36d5088805)\n\n\n### 二、想就近买中式点心\n\n#### 3. 知味观食品（和家园店）\n\n主打条头糕、龙井酥等中式糕饼，更偏传统点心路线；离留下片区较近，但晚间可能已经休息，出发前建议确认营业状态。\n\n\n\n[](@replace=media_9a94074752542570)\n\n\n### 三、想坐下喝咖啡\n\n#### 4. 东坡的寂寞\n\n这是一家带窑烤面包的咖啡馆，位于留下老街，有落地窗、卡座和阅读空间；想坐着慢慢吃、喝咖啡，比单纯买外带面包更合适。\n\n### 四、快速帮你选\n\n- 想买现烤欧包和蛋糕，选 **DRUNK BAKER**。\n- 喜欢咸甜吐司，选 **UH祐禾**。\n- 想吃条头糕、龙井酥，选 **知味观食品**。\n- 想坐下来喝咖啡，选 **东坡的寂寞**。\n\n你是想买几款面包带回去，还是找一家能坐下来喝咖啡的？","mentioned":false,"memory":false,"refs":[{"t":"储缘烘焙(留下镇店)","s":"city8","u":"https://m.city8.com/hz/cater/8c1o0o785cl5b206cb","k":"其他网站","r":""},{"t":"莫卡乡村(留下大街店)","s":"百度百科","u":"https://baike.baidu.com/item/莫卡乡村（留下大街店）/14305245","k":"百度系","r":""},{"t":"【独家专访】零投放月销50万!平价手作烘焙,一条小红书笔记带火的社区小店!","s":"东京烘焙职业人","u":"http://mp.weixin.qq.com/s?src=11\u0026timestamp=1791466895\u0026ver=7014\u0026signature=JY3cuYc9iPT*EjiYOAgU3vPlPb9ZoczBRZzd0gDRwuLhGOitfYS*JgCbbkZHWY3RJoFaUfT5uVwP7bdzVo9PyRgFN33-ahtHlF0jpJTn823p1Mt5xYG-E3jUE3azBrkM\u0026new=1","k":"微信公众号","r":""},{"t":"【优优蛋糕屋】优优蛋糕屋电话,优优蛋糕屋地址_360地图","s":"360地图","u":"https://ditu.so.com/site/detail/1d2fbf85145e4aea","k":"其他网站","r":""},{"t":"浙大学长学姐严选!开学季美食打卡清单,快收好","s":"美丽西湖","u":"http://mp.weixin.qq.com/s?src=11\u0026timestamp=1791466895\u0026ver=7014\u0026signature=VRXZHpJTODwv6XZGIRE6OtoEuBvgbBxXJmnVm15n9mtgSrK4VwzYcz7H6V8g4HFpdfTGD-ZBRSnjd44iRsP0-7NecsfhJukd2-*WXuomiXloj8TWO6wEOEfoSiVcoMmO\u0026new=1","k":"微信公众号","r":""}]}],"q12_deepseek":[{"text":"上城区江城路望江门附近这几家面包店可以看看：\n\n### 🍞 推荐面包店\n\n**钱谷融面包工坊（江城路店）**\n位于江城路693号附近，靠近望江门。人均约15元，属于性价比不错的小店，有现点现做、味道不错、价格实惠的评价。\n\n**九月生活（江城路二店）**\n位于江城路725号（近联华超市），是杭州本地连锁烘焙品牌。招牌是榨菜鲜肉月饼，同时也提供面包、蛋糕等常规西点，人均约11元。\n\n**可莎蜜儿（江城路店）**\n位于江城路853-2-2号。有评价提到一进门香味四溢，面包蛋糕看起来都挺好吃，店面干净，价格也比较平价。\n\n**熊猫家日式面包甜品咖啡店**\n位于望江路115号，从江城路地铁站E口步行约380米。主打日式面包和甜品咖啡，营业时间较长（8:00-22:00）。\n\n**K姐吐司**\n在望江街道的杭罐街区。这家店比较有故事，店主曾是阿里架构师，坚持手工烘焙、天然酵液、拒绝冷冻面团，主打干净平价的吐司，还提供几公里范围内免费配送。\n\n### 📝 其他备选\n江城路沿线还有 **伊莎贝尔蛋糕店**（江城路693号）、**克莉丝汀（江城店）**（江城路324-1号）等，也可以顺路看看。","mentioned":false,"memory":false,"refs":[{"t":"熊猫家日式面包甜品咖啡店","s":"Apple Maps: Directio","u":"https://maps.apple.com/place?auid=1118694081827324\u0026lsp=57879","k":"地图","r":""},{"t":"杭州市上城区江小甜烘焙店（个体工商户） - 企业工商信息 - 天眼查","s":"天眼查","u":"https://www.tianyancha.com/company/6950381036","k":"其他网站","r":""},{"t":"【猫咪面团nekopan(上城店)】猫咪面团nekopan(上城店)电话，猫咪面团nekopan(上城店)地址_360地图","s":"360地图","u":"https://map.360.cn/?pid=1e74b8d6f69bccb3\u0026src=pc_shenbian","k":"地图","r":""},{"t":"【克莉丝汀(江城店)】克莉丝汀(江城店)电话，克莉丝汀(江城店)地址_360地图","s":"360地图","u":"https://map.360.cn/?pid=2d8ef22ec97a21a1\u0026src=pc_shenbian","k":"地图","r":""},{"t":"钱谷融面包工坊(江城路店)","s":"西藏科技智能制造有限公司","u":"https://m.city8.com/hz/cater/8c3xy37857mjb69ec9","k":"其他网站","r":""},{"t":"伊莎贝尔蛋糕店 - 电话邦","s":"Dianhua","u":"https://www.dianhua.cn/dt/4a4766965cec42399d8b820b311aa938/67319ea6bc891bbc153e177a31a2d68c","k":"其他网站","r":""},{"t":"九月生活（江城路一店）","s":"百度百科","u":"https://baike.baidu.com/item/%E4%B9%9D%E6%9C%88%E7%94%9F%E6%B4%BB%EF%BC%88%E6%B1%9F%E5%9F%8E%E8%B7%AF%E4%B8%80%E5%BA%97%EF%BC%89/14206427","k":"百度系","r":""},{"t":"360问答,总有你的答案 江南面包蛋糕(新建路店)_360问答搜索","s":"360问答","u":"https://m.wenda.so.com/search/?q=%E6%B1%9F%E5%8D%97%E9%9D%A2%E5%8C%85%E8%9B%8B%E7%B3%95(%E6%96%B0%E5%BB%BA%E8%B7%AF%E5%BA%97)\u0026srcg=\u0026nav=\u0026src=m_tab_map\u0026abv=","k":"其他网站","r":""},{"t":"酵一缕麦香 守一份初心-上城新闻网","s":"Hzsc","u":"https://www.hzsc.com.cn/content/content_9929549.html","k":"其他网站","r":""},{"t":"【携程美食林】杭州可莎蜜兒(江城店)餐馆,一進門香味四溢，麵包、蛋糕看起來都很好吃！店很乾淨，麵包也很平價…","s":"携程","u":"https://you.ctrip.com/food/hangzhou14/12468640-dianping128282784.html","k":"携程","r":""}]},{"text":"上城区江城路望江门附近有几家面包店，以下是相关信息：\n\n### 🍞 具体店铺\n\n**九月生活（江城路一店）**\n位于江城路725号，人均约11元。推荐产品包括榨菜鲜肉月饼、流沙面包等。\n\n**可莎蜜儿（江城路店）**\n位于江城路853-2-2号，营业时间为07:00-22:00。有用户评价“种类也多”，面包平价。\n\n**熊猫家日式面包甜品咖啡店**\n位于望江路115号（江城路地铁站E口步行380米），营业时间为每天8:00-22:00。\n\n**伊莎贝尔蛋糕店**\n位于江城路693号（江城路地铁站H口步行190米）。\n\n**K姐吐司**\n位于望江街道杭罐街区，主打手工吐司，拒绝冷冻面团，坚持天然酵液慢发酵。提供几公里范围内免费配送服务。\n\n**钱谷融面包工坊**\n位于江城路693号陆家河头小区底商。\n\n### 📝 补充信息\n\n此外，附近还有**克莉丝汀（江城店）**（江城路324-1号）、**ZHAO MAI朝麦中式糕点**（江城路585号）等店铺。不过需要注意，部分店铺信息可能因经营调整而变化，建议前往前先确认。","mentioned":false,"memory":false,"refs":[{"t":"熊猫家日式面包甜品咖啡店","s":"Apple Maps: Directio","u":"https://maps.apple.com/place?auid=1118694081827324\u0026lsp=57879","k":"地图","r":""},{"t":"伊莎贝尔蛋糕店 - 电话邦","s":"Dianhua","u":"https://www.dianhua.cn/dt/4a4766965cec42399d8b820b311aa938/67319ea6bc891bbc153e177a31a2d68c","k":"其他网站","r":""},{"t":"杭州市上城区江小甜烘焙店（个体工商户） - 企业工商信息 - 天眼查","s":"天眼查","u":"https://www.tianyancha.com/company/6950381036","k":"其他网站","r":""},{"t":"【克莉丝汀(江城店)】克莉丝汀(江城店)电话，克莉丝汀(江城店)地址_360地图","s":"360地图","u":"https://map.360.cn/?pid=2d8ef22ec97a21a1\u0026src=pc_shenbian","k":"地图","r":""},{"t":"九月生活（江城路一店）","s":"百度百科","u":"https://baike.baidu.com/item/%E4%B9%9D%E6%9C%88%E7%94%9F%E6%B4%BB%EF%BC%88%E6%B1%9F%E5%9F%8E%E8%B7%AF%E4%B8%80%E5%BA%97%EF%BC%89/14206427","k":"百度系","r":""},{"t":"酵一缕麦香 守一份初心-上城新闻网","s":"Hzsc","u":"https://www.hzsc.com.cn/content/content_9929549.html","k":"其他网站","r":""},{"t":"【猫咪面团nekopan(上城店)】猫咪面团nekopan(上城店)电话，猫咪面团nekopan(上城店)地址_360地图","s":"360地图","u":"https://map.360.cn/?pid=1e74b8d6f69bccb3\u0026src=pc_shenbian","k":"地图","r":""},{"t":"360问答,总有你的答案 江南面包蛋糕(新建路店)_360问答搜索","s":"360问答","u":"https://m.wenda.so.com/search/?q=%E6%B1%9F%E5%8D%97%E9%9D%A2%E5%8C%85%E8%9B%8B%E7%B3%95(%E6%96%B0%E5%BB%BA%E8%B7%AF%E5%BA%97)\u0026srcg=\u0026nav=\u0026src=m_tab_map\u0026abv=","k":"其他网站","r":""},{"t":"【携程美食林】杭州可莎蜜兒(江城店)餐馆,一進門香味四溢，麵包、蛋糕看起來都很好吃！店很乾淨，麵包也很平價…","s":"携程","u":"https://you.ctrip.com/food/hangzhou14/12468640-dianping128282784.html","k":"携程","r":""},{"t":"【携程美食林】杭州可莎蜜兒(江城店)餐馆,口感还挺好 种类也多 正好在住的楼下 比较方便携带","s":"携程","u":"https://you.ctrip.com/food/hangzhou14/12468640-dianping129923609.html","k":"携程","r":""}]}],"q12_doubao":[{"text":"我给你挑两家风格不一样的，一家社区安静小店，一家地铁口人气款，都在江城路/望江门片区，兼顾买面包+坐下来小坐。\n \n1. 卢小姐的店｜社区安静小店，爱吃碱水优先选\n \n📍上城区望江门外直街84号（靠近望江门）\n✅亮点：藏在小区楼下，氛围安静松弛；碱水结口碑很好，碱水味足不发干，适合慢悠悠坐下来吃面包喝咖啡，人不会太嘈杂。\n适合：追求安静、想吃碱水，避开游客区。\n \n\n \n2. 富贵里面包公司(河坊街店)｜地铁口人气首选，品类丰富\n \n📍上城区河坊街11号，江城路地铁站出来几步路\n✅亮点：门店明亮干净，可堂食；招牌猪肉脯吐司、猪肉脯可颂很出圈，米面包、甜口面包选择多；面包种类全，路过买或者下午茶小坐都合适，交通非常方便。\n⚠️小提醒：游客多，周末座位会紧张。\n \n\n \n快速帮你选\n \n想要安静社区氛围、吃碱水面包、避开游客 → 优先卢小姐的店\n\n看重地铁便利、面包品类多、热闹一点 → 选富贵里面包公司\n \n你更偏向安静小坐，还是方便好逛？我可以再帮你筛备选。","mentioned":false,"memory":false,"refs":[]},{"text":"我给你挑两家风格不一样的，一个大众稳妥，一个本地烟火气，都在江城路望江门一带，你按喜好选：\n \n1. 达克布蕾（河坊街店）｜综合首选，面包+甜品都有\n \n📍河坊街43号，江城路地铁站D口步行80米，离望江门不远\n✅亮点：动物奶油，甜度克制，品类很全，吐司、手撕包、毛巾卷、小蛋糕都有，品质稳定，性价比高；店面干净，适合逛街随手买，也可以买小甜品吃。\n⚠️适合：想要选择多、兼顾面包+甜品，口味不踩雷，不想冒险试小众店。\n \n\n \n2. 九月生活SepBakery（江河店）｜本地烟火气，咸口点心强\n \n📍江城路725‑1号，距离望江门公交站约190米，位置很近\n✅亮点：杭州老牌本地烘焙，招牌鲜肉榨菜饼很出圈，刚出炉酥香多汁；也有吐司、黑米糕等日常面包，性价比高，很适合买了当早餐或者边走边吃。\n⚠️适合：偏爱咸口点心、喜欢本地风味；甜品选择相对少，主打面包酥饼。\n \n\n \n快速二选一\n \n想吃面包+甜品，口味稳妥、选择丰富 → 达克布蕾\n\n想吃咸口酥饼、本地老杭州味道，就近随手买 → 九月生活\n \n如果你偏爱低糖健康欧包，那还是选之前聊的麦的日尝，但会稍微远一点点。\n \n需要我再帮你对比下麦的日尝和这两家的差别吗？","mentioned":true,"memory":true,"refs":[]}],"q12_hunyuan":[{"text":"望江门这一带能买到的面包店不多，按场景给你挑几家：\n\n### 🥖 日式软包 · 家庭回购\n**熊猫家 PANDA BAKERY（望江店）**\n- 石窑现烤，温泉吐司、斑斓兔兔吐司是招牌，软糯不甜腻[1][16]。\n- 位置：上城区望江路 115 号（农贸市场沿街商铺），地铁 7 号线江城路站 E 口步行约 600 米[16]。\n\n**猫咪面团 NEKOPAN（河坊街店）**\n- 斑斓神户吐司湿润回弹、盐面包常年销量第一，滨江起家的本地口碑店[5]。\n- 位置：上城区河坊街 31 号，5/7 号线江城路站 D 口步行约 100 米[5]。\n\n### 🍰 社区小店 · 现烤吐司\n**啊呜一口蛋糕屋**\n- 藏在望江家园东园底商，原味吐司蓬松拉丝、抹茶红豆包和芒果千层都稳，晚上七点后面包打折[3]。\n- 位置：望江家园东园 42 号楼底商[3]。\n\n**黎明屋 DawnHouse**\n- 家庭式温馨小店，脸盘大蛋挞、可露丽、香蕉派造型可爱，性价比高[6]。\n- 位置：望江路近万泰城[6]。\n\n### 🥐 老牌连锁 · 顺路买\n**浮力森林（江城店）**\n- 杭州老牌烘焙，抹茶慕斯、肉松面包口碑稳，分量适中适合尝鲜[2]。\n- 位置：上城区江城路[2]。\n\n**可莎蜜儿（江城路店）**\n- 连锁老店，面包蛋糕品种多、常有银行卡优惠，离城站火车站近，顺路带早餐方便[7]。\n- 位置：上城区江城路[7]。\n\n### 怎么选\n- 要软糯日式吐司、带孩子 → **熊猫家** 或 **猫咪面团**\n- 只想楼下买个现烤面包当早餐 → **啊呜一口** 或 **黎明屋**\n- 赶火车顺路、图省心 → **浮力森林** 或 **可莎蜜儿**\n\n要不要我帮你按“明早当早餐”还是“下午茶顺便逛鼓楼”排一条步行动线？[](@ma","mentioned":false,"memory":false,"refs":[{"t":"熊猫家面包店PANDA BRKERY","s":"city8","u":"https://m.city8.com/hz/cater/8c3vyo78575db6d744","k"   /* 每一期的报告：工作台聚合的方式就是这张表，一行一期，点了就在这里打开那一期的报告 */
  function reportsCard(limit) {

      : '每期体检出一份报告。这是第一期，也是之后对比的基线；从第二期开始，上面的数会带上和上一期的对比。')

  /* ── 监测设置：每周替商家问什么、和谁比，以及员工另外记下的几样信息 ──

  /* ── 员工填的页面：由几种固定的内容块拼成，不用为每个新页面写代码 ──
     块的类型和 geo_report.py 的 BLOCK_TYPES 一致：text、list、table、stats、links、say。 */

    var grid = el('div', 'row c3');
    DATA.providers.forEach(function (p) {
      var box = card(p.name + ' 常读');
      var list = (sources[p.id] || []).slice(0, 5);
      if (!list.length) { grid.appendChild(add(box, el('div', 'empty', '这个平台这一期没有返回引用。'))); return; }
      var bar = el('div', 'stackbar');
      var items = el('ul', 'stack-legend');
      list.forEach(function (item) {
        var segment = el('i');
        segment.style.width = item.pct + '%';
        segment.style.background = color(item.type);
        segment.title = item.type + ' ' + item.pct + '%';
        bar.appendChild(segment);
        var swatch = el('span', 'sw');
        swatch.style.background = color(item.type);
        add(items, add(el('li'), swatch, el('span', 'nm', item.type), el('span', 'pc', item.pct + '%')));
      });
      grid.appendChild(add(box, bar, items));
    });
    root.appendChild(grid);
    var related = card('被 AI 引用的、和你有关的内容', '你的账号和网站 ' + S.refs.own + ' 次 · 门店页 ' + S.refs.storePages + ' 次 · 别人写你 ' + S.refs.aboutStore + ' 次');
    var groups = [['own', '你的账号和网站', '这一期 AI 没有引用你自己的账号和网站上的内容。'], ['store', '你的门店页', '这一期 AI 没有引用地图或点评上的门店页。'], ['about', '别人写你的', '这一期 AI 没有引用别人写你的内容。']];
    var seg = el('div', 'seg');
    var holder = el('div');
    var segButtons = [];
    var data = DATA.related || {};
    var fill = function (group) {
      holder.textContent = '';
      var list = data[group[0]] || [];
      if (!list.length) { holder.appendChild(el('div', 'empty', group[2])); return; }
      holder.appendChild(refList(list.slice(0, 10).map(function (item) {
        return { t: item.title, u: item.url, k: item.type, s: [item.source, '用在 ' + item.usedIn.length + ' 个回答里'].filter(Boolean).join(' · '), r: '' };
      })));
    };
    var first = 0;
    for (var g = 0; g < groups.length; g++) { if ((data[groups[g][0]] || []).length) { first = g; break; } }
    groups.forEach(function (group, index) {
      var btn = button(index === first ? 'on' : '', group[1] + ' ' + (data[group[0]] || []).length, function () {
        segButtons.forEach(function (b) { b.className = b === btn ? 'on' : ''; });
        fill(group);
      });
      segButtons.push(btn);
      seg.appendChild(btn);
    });
    fill(groups[first]);
    root.appendChild(add(related, seg, holder));
    add(root, gapsCard());
  }
  function reportSays(root, S) {
    root.appendChild(h2('says', 'AI 怎么介绍你', '顾客点名问你时'));
    var descriptions = DATA.descriptions || {};
    var said = DATA.providers.filter(function (p) { return descriptions[p.id]; });
    if (said.length) {
      var quotes = el('div', 'quotes');
      said.forEach(function (p) { quotes.appendChild(add(el('div', 'quote'), el('div', 'who', p.name), el('div', 'say-text', descriptions[p.id]))); });
      root.appendChild(add(card(), quotes));
    }
    var issues = DATA.issues || [];
    if (!issues.length) {
      root.appendChild(add(card(), el('div', 'small muted', S.judged
        ? '员工把这些回答和你的店铺资料逐条对过，没有发现对不上的说法。'
        : '员工还在核对这些回答，核对完这里会更新。')));
      return;
    }
    /* 有对不上的才列出来。它只是这一期的一种发现，不是每家店都有 */
    var unsure = DATA.factsFrom === 'public' && !DATA.factsConfirmed;
    root.appendChild(el('div', 'sec-label', unsure
      ? '其中有 ' + issues.length + ' 处和员工整理的资料对不上。这份资料还没经过你确认，不一定是 AI 说错'
      : '其中有 ' + issues.length + ' 处和你的店铺资料对不上'));
    issues.forEach(function (issue) { root.appendChild(issueCard(issue)); });
  }
  function reportFooter(root) {
    var written = DATA.contents || [];
    if (written.length) {
      var box = card('这一期替你写的内容', written.length + ' 篇', nav('去工作台看稿子', 'content', 'more'));
      written.forEach(function (item) {
        var label = CONTENT_LABEL[item.status] || CONTENT_LABEL.preview;
        box.appendChild(add(el('div', 'gap-row'), el('span', 'tag', item.typeName), add(el('span'), el('b', '', item.title), ' ', pill(label[0], label[1]))));
      });
      root.appendChild(box);
    }
    var silent = DATA.providers.filter(function (p) { return !((DATA.summary.mention.byProvider[p.id] || {}).hits); });
    var issues = DATA.issues || [];
    root.appendChild(sayBlock([silent.length ? '为什么' + silent[0].name + '不提我' : '怎么让 AI 多提我',
      '把 Q3 换一个问法', '把同类店换成我真正的对手', issues.length && issues[0].no ? issues[0].no + ' 号我改好了' : '重新体检一次'],
      '点一句可以复制，回到龙虾发给员工。'));
    root.appendChild(el('div', 'rpt-foot', '这份报告记的是第 ' + P.no + ' 期体检当时的情况，生成于 ' + updatedAt() + '。之后做了什么、改了什么，在工作台上看。'));
  }
  /* 嵌在工作台里时，显示出来以后跟外面打个招呼（外面据此知道报告显示成功了）。一层一层往上说，中间隔着别的壳也能传到 */
  function tellAncestors(message) {
    try {
      var w = window;
      for (var i = 0; i < 4 && w.parent && w.parent !== w; i++) { w = w.parent; w.postMessage(message, '*'); }
    } catch (error) { /* 说不出去不影响报告本身 */ }
  }
  function renderReport() {
    var S = DATA.summary;
    var wrap = el('div', 'rpt');
    var head = null;
    if (!EMBED) {
      /* 单独打开时自带标题和回工作台的入口；嵌在工作台里时这些由工作台的顶栏和侧栏负责 */
      head = el('header', 'rpt-head');
      var back = null;
      if (BASE) { back = el('a', 'btn', '回工作台'); back.href = BASE + '#/overview'; }
      add(head, mascot(), add(el('div', 'rpt-title'), el('div', 't1', (DATA.store.name || '本店') + ' · AI 曝光体检报告'),
        el('div', 't2', '第 ' + P.no + ' 期 · ' + cnDate(P.date) + '体检')), el('span', 'sp'), back);
    }
    var toc = el('nav', 'rpt-toc');
    SECTIONS.forEach(function (section) { var a = el('a', '', section[1]); a.href = '#' + section[0]; toc.appendChild(a); });
    content = el('main', 'content stack');
    add(content, demoStrip());
    reportSummary(content, S);
    reportMentions(content, S);
    reportRivals(content, S);
    reportSources(content, S);
    reportSays(content, S);
    reportFooter(content);
    add(app, add(wrap, head, toc, content));
    app.className = 'app report' + (EMBED ? ' embedded' : '');
    document.title = '第 ' + P.no + ' 期体检报告 · ' + (DATA.store.name || '本店');
    var hash = String(location.hash || '');
    var jump = EMBED ? (hash.split('/')[1] || '') : hash.slice(1);
    var target = jump ? document.getElementById(jump) : null;
    if (target && target.scrollIntoView) { target.scrollIntoView(); }
    if (EMBED) { tellAncestors({ geo: 'report-ready', date: P.date }); }
  }

  if (KIND === 'report') {
    renderReport();
  } else {
    renderShell();
    window.addEventListener('hashchange', route);
    window.addEventListener('message', onFrameMessage);
    route();
  }
})();
</script>
</body>
</html>
