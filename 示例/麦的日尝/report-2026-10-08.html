<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>AI 曝光工作台</title>
<style>
/* ───────── 颜色和字体：和有赞龙虾客户端用同一套 ───────── */
:root {
  --bg: #f6f7f8; --side: #f1f2f3; --canvas: #ffffff; --subtle: #f7f8f8; --hover: #eceeef;
  --line: #e6e8ea; --line-2: #d5d8db;
  --ink: #1f2328; --ink-2: #5f656b; --ink-3: #8b9197; --ink-4: #b6babe;
  --brand: #155bd4; --brand-2: #114bb8; --brand-soft: #eaf2ff; --brand-line: #b8d0f5;
  --ok: #238a57; --ok-soft: #eaf7f0; --warn: #b7791f; --warn-soft: #fff7e6; --bad: #d83b32; --bad-soft: #fff0ef;
  --c1: #155bd4; --c2: #0f8a9d; --c3: #8b5cf6; --c4: #c2410c; --c5: #238a57; --c6: #c0408f; --c7: #b7791f; --c0: #c3c7cb;
  --shadow: 0 1px 2px rgba(31, 35, 40, .04);
  --shadow-lg: 0 16px 48px rgba(31, 35, 40, .18);
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171819; --side: #1d1f20; --canvas: #222426; --subtle: #292b2d; --hover: #303336;
    --line: #34373a; --line-2: #4b4f53;
    --ink: #f2f3f4; --ink-2: #b9bdc1; --ink-3: #858b91; --ink-4: #5c6166;
    --brand: #4d8dff; --brand-2: #6ba0ff; --brand-soft: #172a4a; --brand-line: #2e4b7a;
    --ok: #3da46e; --ok-soft: rgba(61, 164, 110, .16); --warn: #d6a33a; --warn-soft: rgba(214, 163, 58, .16);
    --bad: #f26b62; --bad-soft: rgba(242, 107, 98, .16);
    --c1: #4d8dff; --c2: #35b0c2; --c3: #a78bfa; --c4: #f08a4b; --c5: #3da46e; --c6: #e06db2; --c7: #d6a33a; --c0: #4b4f53;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    --shadow-lg: 0 16px 48px rgba(0, 0, 0, .5);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased;
  font: 14px/1.6 -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
}
a { color: var(--brand); text-decoration: none; }
a:hover { text-decoration: underline; }
button, select { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
.noscript { padding: 24px 16px; }
.tnum { font-variant-numeric: tabular-nums; }

/* ───────── 外框：左侧导航 + 顶栏 + 内容 ───────── */
.app { display: flex; min-height: 100vh; }
.side { position: sticky; top: 0; z-index: 20; display: flex; flex: none; flex-direction: column; width: 232px; height: 100vh; padding: 16px 12px 12px; overflow-y: auto; border-right: 1px solid var(--line); background: var(--side); }
.side-brand { display: flex; align-items: center; padding: 0 6px 12px; }
.mascot { flex: none; width: 36px; height: 36px; margin-right: 10px; border-radius: 10px; background: var(--canvas); box-shadow: 0 0 0 1px var(--line); }
.side-brand .t1 { font-size: 12px; line-height: 1.3; color: var(--ink-3); }
.side-brand .t2 { max-width: 150px; overflow: hidden; font-size: 15px; font-weight: 700; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }
.side-state { display: block; margin: 0 6px 6px; }
.side-state .pill { width: 100%; justify-content: center; line-height: 26px; }
.side-state:hover { text-decoration: none; opacity: .85; }
.nav-label { padding: 14px 10px 6px; font-size: 12px; letter-spacing: .04em; color: var(--ink-3); }
.sec-label { margin-top: 20px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.note-gap { margin-top: 12px; }
/* 体检报告：每期一份独立的文件。单独打开时自带标题；嵌在工作台里时（地址带 #embed）不带标题，靠左对齐，和工作台的其他页面一致 */
.app.report { display: block; }
.rpt { max-width: 1080px; margin: 0 auto; }
.app.report.embedded .rpt { max-width: none; margin: 0; }
.rpt-head { display: flex; align-items: center; padding: 20px 28px 12px; }
.rpt-head .mascot { width: 40px; height: 40px; margin-right: 12px; }
.rpt-title { min-width: 0; }
.rpt-title .t1 { font-size: 19px; font-weight: 700; line-height: 1.4; }
.rpt-title .t2 { font-size: 13px; color: var(--ink-3); }
.rpt-head .sp { flex: 1; min-width: 12px; }
.rpt-head .btn { flex: none; margin: 0; }
.rpt-toc { position: sticky; top: 0; z-index: 8; display: flex; overflow-x: auto; padding: 8px 22px; border-bottom: 1px solid var(--line); background: var(--bg); white-space: nowrap; }
.rpt-toc a { margin-right: 4px; border-radius: 999px; padding: 4px 12px; color: var(--ink-2); font-size: 13px; }
.rpt-toc a:hover { background: var(--hover); color: var(--ink); text-decoration: none; }
.stack > .rpt-h2 { margin: 32px 0 0; font-size: 18px; font-weight: 700; scroll-margin-top: 52px; }
.stack > .rpt-h2:first-child, .stack > .demo-strip + .rpt-h2 { margin-top: 4px; }
.rpt-h2 small { margin-left: 10px; font-size: 13px; font-weight: 400; color: var(--ink-3); }
.stack > .rpt-h2 + * { margin-top: 12px; }
.rpt-foot { padding: 8px 0 0; font-size: 12px; color: var(--ink-3); text-align: center; }
@media (max-width: 900px) {
  .rpt-head { padding: 16px 16px 10px; }
  .rpt-title .t1 { font-size: 17px; }
  .rpt-toc { padding: 8px 10px; }
  .rpt-h2 small { display: block; margin: 2px 0 0; }
}
.demo-strip { border: 1px dashed var(--warn); border-radius: 10px; padding: 8px 14px; background: var(--warn-soft); color: var(--warn); font-size: 13px; font-weight: 600; }
.finding { padding: 14px 0; border-top: 1px solid var(--line); }
.finding:first-of-type { border-top: 0; padding-top: 4px; }
.finding-t { font-weight: 700; line-height: 1.5; }
.finding-t .tag { margin-right: 8px; }
.finding-d { max-width: 68em; margin-top: 6px; color: var(--ink-2); line-height: 1.7; }
.finding-a { margin-top: 6px; line-height: 1.7; }
.finding-a .k { margin-right: 8px; color: var(--ink-3); font-size: 12px; }
.finding-q { display: block; width: 100%; margin-top: 8px; padding: 8px 12px; border: 0; border-left: 3px solid var(--line); border-radius: 0 8px 8px 0; background: var(--hover); color: var(--ink-2); font: inherit; font-size: 13px; line-height: 1.6; text-align: left; cursor: pointer; }
.finding-q:hover { border-left-color: var(--brand); }
.finding-q .who { display: block; font-size: 12px; color: var(--ink-3); }
.edge-list { margin: 4px 0 0; padding-left: 20px; }
.edge-list li { margin: 6px 0; line-height: 1.6; }
.edge-list .tag { margin-left: 8px; }
.nav a { display: flex; align-items: center; height: 36px; margin-bottom: 2px; padding: 0 10px; border-radius: 8px; color: var(--ink-2); font-size: 14px; }
.nav a:hover { background: var(--hover); text-decoration: none; }
.nav a.on { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.nav a:focus-visible { outline-offset: -2px; }
.nav a svg { flex: none; margin-right: 10px; }
.nav .cnt { min-width: 20px; margin-left: auto; border-radius: 10px; padding: 0 6px; background: var(--hover); color: var(--ink-2); font-size: 12px; font-weight: 600; line-height: 20px; text-align: center; }
.nav .cnt.bad { background: var(--bad-soft); color: var(--bad); }
.nav .rpt-link { height: 34px; font-size: 13px; }
.nav .rpt-link .cnt { background: var(--brand-soft); color: var(--brand); }
.main { flex: 1; min-width: 0; }
.topbar { position: sticky; top: 0; z-index: 8; display: flex; align-items: center; min-height: 60px; padding: 10px 28px; border-bottom: 1px solid var(--line); background: var(--bg); }
.topbar h1 { margin: 0; font-size: 18px; font-weight: 700; white-space: nowrap; }
.card-h h3, .banner .verdict, .stack > .rpt-h2, .paper-title, .finding-t, .sheet-head h3 { text-wrap: balance; }
.topbar .sub { margin-left: 12px; overflow: hidden; font-size: 13px; color: var(--ink-3); text-overflow: ellipsis; white-space: nowrap; }
.topbar .upd { margin-left: 8px; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.topbar .sp { flex: 1; min-width: 8px; }
.topbar .pill { margin-left: 8px; }
.topbar .act { margin-left: 14px; font-size: 13px; white-space: nowrap; }
/* 在工作台里看报告：顶栏和侧栏不动，内容区整个交给报告（一个内嵌的页面），只有它自己滚动 */
.main.host { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
.content.host { display: flex; flex: 1; flex-direction: column; min-height: 0; max-width: none; padding: 0; }
.rpt-frame { display: block; flex: 1; width: 100%; min-height: 0; border: 0; background: var(--bg); }
.frame-hint { padding: 8px 28px; border-bottom: 1px solid var(--line); background: var(--subtle); font-size: 13px; color: var(--ink-2); }
.psel { height: 34px; max-width: 190px; margin-left: 8px; border: 1px solid var(--line-2); border-radius: 8px; padding: 0 8px; background: var(--canvas); font-size: 13px; }
.menu-btn { display: none; align-items: center; justify-content: center; width: 36px; height: 36px; margin: 0 8px 0 -6px; border: 0; border-radius: 8px; background: none; cursor: pointer; }
.menu-btn:hover { background: var(--hover); }
.scrim { display: none; }
.content { max-width: 1200px; padding: 20px 28px 56px; }
@media (max-width: 900px) {
  .side { position: fixed; left: 0; top: 0; transform: translateX(-102%); transition: transform .22s ease; box-shadow: var(--shadow-lg); }
  .side.open { transform: none; }
  .scrim.open { display: block; position: fixed; left: 0; right: 0; top: 0; bottom: 0; z-index: 19; background: rgba(15, 18, 21, .45); }
  .menu-btn { display: inline-flex; }
  .topbar { padding: 8px 16px; }
  .topbar .sub, .topbar .upd, .topbar .pill { display: none; }
  .frame-hint { padding: 8px 16px; }
  .psel { max-width: 172px; }
  .content { padding: 16px 16px 48px; }
}
@media (prefers-reduced-motion: reduce) { .side { transition: none; } }

/* ───────── 通用组件 ───────── */
.row { display: grid; gap: 16px; }
.stack > * + * { margin-top: 16px; }
.row.c4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 901px) {
  .row.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
  .row.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .row.c4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
.card { min-width: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--canvas); padding: 16px; }
@media (min-width: 901px) { .card { padding: 18px 20px; } }
.card-h { display: flex; align-items: center; margin-bottom: 12px; }
.card-h h3 { margin: 0; font-size: 15px; font-weight: 700; }
.card-h .count { margin-left: 8px; font-size: 12px; color: var(--ink-3); }
.card-h .more { margin-left: auto; padding-left: 12px; font-size: 13px; white-space: nowrap; }
.card.flush { padding: 0; overflow: hidden; }
.card.flush .card-h { margin: 0; padding: 16px 20px 12px; }
.card.flush .pad { padding: 0 20px 16px; }
.lead { max-width: 68em; margin: 0 0 14px; font-size: 13px; color: var(--ink-2); }
.pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 0 9px; font-size: 12px; font-weight: 600; line-height: 22px; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.brand { background: var(--brand-soft); color: var(--brand); }
.pill.plain { background: var(--hover); color: var(--ink-2); }
.tag { display: inline-block; margin-right: 6px; border-radius: 6px; padding: 0 6px; background: var(--hover); color: var(--ink-2); font-size: 12px; font-weight: 400; line-height: 20px; white-space: nowrap; vertical-align: 1px; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.empty { padding: 6px 0; font-size: 13px; color: var(--ink-3); }
.btn { display: inline-flex; align-items: center; margin: 0 8px 0 0; border: 1px solid var(--line-2); border-radius: 8px; padding: 6px 14px; background: var(--canvas); color: var(--ink); font-size: 13px; font-weight: 600; cursor: pointer; }
.btn:hover { border-color: var(--brand-line); text-decoration: none; }
.btn.primary { border-color: var(--brand); background: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-2); }
.btn svg { margin-left: 6px; }
.textbtn { border: 0; padding: 0; background: none; color: var(--brand); font-size: 13px; cursor: pointer; }
.textbtn.more { margin-left: auto; padding-left: 12px; white-space: nowrap; }
.seg { display: inline-flex; max-width: 100%; overflow-x: auto; border-radius: 8px; padding: 3px; background: var(--hover); }
.seg button { border: 0; border-radius: 6px; padding: 4px 12px; background: none; font-size: 13px; color: var(--ink-2); white-space: nowrap; cursor: pointer; }
.seg button.on { background: var(--canvas); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(31, 35, 40, .14); }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th { padding: 9px 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--subtle); font-size: 12px; font-weight: 600; color: var(--ink-3); text-align: left; white-space: nowrap; }
.tbl td { padding: 12px; border-bottom: 1px solid var(--line); font-size: 14px; vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl th:first-child, .tbl td:first-child { padding-left: 20px; }
.tbl th:last-child, .tbl td:last-child { padding-right: 20px; }
.tbl .r { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .c { text-align: center; }
.tbl .nw { white-space: nowrap; }
.tbl tr.click { cursor: pointer; }
.tbl tr.click:hover td { background: var(--subtle); }
.tbl b { font-weight: 700; font-variant-numeric: tabular-nums; }
.pbar { display: block; height: 6px; min-width: 72px; border-radius: 3px; background: var(--hover); overflow: hidden; }
.pbar i { display: block; height: 100%; min-width: 2px; border-radius: 3px; background: var(--brand); }
.pbar.gray i { background: var(--ink-4); }
.kv { display: grid; grid-template-columns: 76px 1fr; gap: 8px 12px; margin: 0; font-size: 14px; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; word-break: break-word; }
.d { display: inline-block; width: 12px; height: 12px; margin: 0 2.5px; border-radius: 50%; background: var(--line-2); opacity: .7; vertical-align: middle; }
.d.h { background: var(--brand); opacity: 1; }
.d.x { height: 2px; border-radius: 1px; }
.legend { display: flex; flex-wrap: wrap; margin-top: 12px; font-size: 12px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; margin: 0 14px 4px 0; }
.legend .d { width: 9px; height: 9px; margin: 0 6px 0 0; }
.say { border: 1px dashed var(--line-2); border-radius: var(--r); padding: 14px 16px; }
.say .tt { display: flex; align-items: center; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.say .tt svg { flex: none; margin-right: 6px; }
.say button { margin: 8px 8px 0 0; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; background: var(--canvas); font-size: 13px; cursor: pointer; }
.say button:hover { border-color: var(--brand-line); color: var(--brand); }
.say .hint { margin-top: 8px; font-size: 12px; color: var(--ink-3); }

/* ───────── 工作台首页 ───────── */
.banner { display: flex; align-items: flex-start; border: 1px solid var(--brand-line); border-radius: var(--r); padding: 16px 18px; background: linear-gradient(135deg, var(--brand-soft) 0%, var(--canvas) 55%); }
.banner .mascot { width: 40px; height: 40px; margin-right: 14px; }
.banner .body { flex: 1; min-width: 0; }
.banner .tt { font-size: 12px; font-weight: 700; color: var(--brand); }
.banner .verdict { margin: 2px 0 0; font-size: 19px; font-weight: 700; line-height: 1.45; letter-spacing: -.01em; }
.banner .verdict b { color: var(--brand); }
.banner .brief { max-width: 68em; margin-top: 6px; font-size: 14px; color: var(--ink-2); }
.banner .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.banner .acts .btn { margin: 0; }
.banner.plain { border-color: var(--line); background: var(--canvas); }
.steps { margin: 0; padding: 0; list-style: none; }
.steps li { position: relative; display: flex; align-items: center; min-height: 40px; padding: 6px 0 6px 34px; font-size: 14px; }
.steps li::before { content: ''; position: absolute; left: 10px; top: 30px; bottom: -10px; width: 1px; background: var(--line); }
.steps li:last-child::before { display: none; }
.steps .mk { position: absolute; left: 0; top: 9px; display: flex; align-items: center; justify-content: center; width: 21px; height: 21px; border-radius: 50%; border: 1.5px solid var(--line-2); background: var(--canvas); color: #fff; }
.steps li.done .mk { border-color: var(--ok); background: var(--ok); }
.steps li.doing .mk { border-color: var(--brand); box-shadow: inset 0 0 0 4px var(--canvas); background: var(--brand); }
.steps .nm { flex: 1; min-width: 0; }
.steps li.todo .nm { color: var(--ink-3); }
.steps li.doing .nm { font-weight: 700; }
.steps .st { margin-left: 12px; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.steps li.doing .st { color: var(--brand); font-weight: 600; }
.kpi { position: relative; display: block; color: var(--ink); cursor: pointer; transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease; }
.kpi:hover { border-color: var(--brand-line); box-shadow: var(--shadow); transform: translateY(-1px); text-decoration: none; }
.kpi.static { cursor: default; }
.kpi.static:hover { border-color: var(--line); box-shadow: none; transform: none; }
@media (prefers-reduced-motion: reduce) { .kpi { transition: none; } .kpi:hover { transform: none; } }
.kpi-top { display: flex; align-items: center; font-size: 13px; color: var(--ink-2); }
.kpi-ico { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 26px; height: 26px; margin-right: 8px; border-radius: 8px; background: var(--brand-soft); color: var(--brand); }
.kpi-ico.bad { background: var(--bad-soft); color: var(--bad); }
.kpi-ico.ok { background: var(--ok-soft); color: var(--ok); }
.kpi-ico.plain { background: var(--hover); color: var(--ink-2); }
.kpi-num { display: block; margin-top: 8px; font-size: 30px; font-weight: 700; line-height: 1.2; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.kpi-num.text { padding: 6px 0 5px; overflow: hidden; font-size: 18px; line-height: 1.4; text-overflow: ellipsis; white-space: nowrap; }
.kpi-num small { font-size: 13px; font-weight: 400; color: var(--ink-3); letter-spacing: 0; }
.kpi-hint { display: block; margin-top: 4px; font-size: 12px; line-height: 1.5; color: var(--ink-3); }
.kpi .spark { position: absolute; right: 16px; top: 16px; width: 64px; height: 26px; }
@media (max-width: 640px) { .kpi .spark { position: static; display: block; margin-top: 8px; } }  /* 窄屏卡片放不下，走势图挪到最下面，不压住标题 */
.todos { margin: 0; padding: 0; list-style: none; counter-reset: todo; }
.todos li { position: relative; padding: 11px 0 11px 36px; border-top: 1px solid var(--line); }
.todos li:first-child { border-top: 0; padding-top: 2px; }
.todos li:last-child { padding-bottom: 2px; }
.todos li::before { counter-increment: todo; content: counter(todo); position: absolute; left: 0; top: 12px; width: 22px; height: 22px; border-radius: 50%; background: var(--brand); color: #fff; font-size: 12px; font-weight: 700; line-height: 22px; text-align: center; }
.todos li:first-child::before { top: 3px; }
.todos .t { font-weight: 600; }
.todos .w { margin-top: 1px; font-size: 13px; color: var(--ink-2); }
.mini-issue { display: flex; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
.mini-issue:first-of-type { border-top: 0; padding-top: 2px; }
.mini-issue .tag { flex: none; margin-top: 1px; }
.mini-issue .tx { flex: 1; min-width: 0; }
.mini-issue .tx div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chart { display: block; width: 100%; height: 64px; margin-top: 8px; }
.t-axis { display: flex; justify-content: space-between; margin-top: 2px; font-size: 11px; color: var(--ink-3); }

/* ───────── 提及分析 ───────── */
.plat b { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.plat .pbar { margin-top: 8px; }

:"nn"},"q05":{"deepseek":"nn","doubao":"mn","hunyuan":"nn"},"q06":{"deepseek":"nn","doubao":"nn","hunyuan":"nn"},"q07":{"deepseek":"nn","doubao":"nn","hunyuan":"nn"},"q08":{"deepseek":"nn","doubao":"nn","hunyuan":"nn"},"q09":{"deepseek":"nn","doubao":"nn","hunyuan":"nn"},"q10":{"deepseek":"nn","doubao":"nm","hunyuan":"nn"},"q11":{"deepseek":"nn","doubao":"hn","hunyuan":"nn"},"q12":{"deepseek":"nn","doubao":"nm","hunyuan":"nn"}},"answers":{"b01_deepseek":[{"text":"：杭州的“麦的日尝”是一家口碑不错的社区面包店，主打健康低卡路线，**值得一去**，尤其适合喜欢恰巴塔、贝贝南瓜面包和拉丝麻薯的食客。\n\n### 🏠 基本信息\n*   **定位与地址**：它是一家开在社区楼下的**社区面包店**，面积不大但有座位，氛围比较休闲。地址位于**上城区清波街109号**（五洋假日酒店大堂）。\n*   **人均消费**：约 **36元**。\n*   **营业时间**：**9:00 – 21:30**。\n\n### 👍 值得推荐的亮点\n*   **招牌必试**：\n    *   **贝贝南瓜面包**：被食客称为“招牌”，面包体松软湿润，南瓜泥绵密细腻，自带天然甜味，**必买**。\n    *   **恰巴塔**：口味独特且用料扎实。**羽衣甘蓝牛肉**和**班尼迪克蛋**口味很受欢迎，塞料满满，一个就能当一顿午饭。\n    *   **拉丝麻薯系列**：麻薯拉丝效果很好，**红豆麻薯盐面包**的黄油味浓郁，底壳微酥。\n    *   **抹茶冻鲜芒菠萝包**：颜值高，抹茶奶冻入口丝滑，搭配芒果酸甜清爽，适合夏天。\n*   **健康概念**：店铺主打**健康低卡低GI**，店里有很多全麦产品以及不加糖的带馅面包，对减脂或注重健康的人比较友好。\n\n如果你对具体的某款面包想了解更多，可以告诉我。","mentioned":true,"memory":false,"refs":[{"t":"40多元在面包店买了点面包,都巨小,还没逛完商场就吃完了,现在是连面包都吃不起了吗? - 知乎","s":"知乎","u":"https://www.zhihu.com/question/1950346225187553301/answer/1959626091850368760?utm_medium=openapi_platform\u0026utm_source=e10c3ad29e50","k":"知乎","r":""},{"t":"麦的日尝","s":"Apple Maps: Directio","u":"https://maps.apple.com/place?auid=1118496272187665\u0026lsp=57879","k":"地图","r":"store"},{"t":"爱吃欧包的大橙子","s":"Weibo","u":"https://m.weibo.cn/status/5071189890302301","k":"微博","r":""},{"t":"杭州市西湖区麦的日尝烘培店（个体工商户）2025年报 - 企业年报公示查询 - 天眼查","s":"www.tianyancha.com","u":"https://www.tianyancha.com/annualReport/6980858527/2025","k":"其他网站","r":"about"},{"t":"杭州市西湖区麦的日尝烘培店（个体工商户） - 企业工商信息 - 天眼查","s":"天眼查","u":"https://www.tianyancha.com/company/6980858527","k":"其他网站","r":"about"}]},{"text":"“麦的日尝”是一家主打**健康低卡**的社区面包店，如果你偏爱用料扎实、口味有创意的面包，**很值得专程去一趟**。\n\n### 🥖 有什么特色值得吃？\n\n这家店擅长把**传统面包做出新意**，尤其是咸口和带馅的款式，被评价为“更像在吃一道简餐，不像在吃面包”。\n\n*   **必试招牌**：**贝贝南瓜包**是销量第一的招牌，面包体松软，南瓜泥绵密且甜度自然，被评价为“不愧是招牌，必买”。\n*   **咸口惊喜**：**恰巴塔**值得一试，特别是**羽衣甘蓝牛肉**和**班尼迪克蛋**口味。料塞得很足，番茄多汁，牛肉扎实，一个就能当午饭。班尼迪克蛋款中间真的有一整颗流心蛋，口感层次丰富。\n*   **其他推荐**：**拉丝麻薯**是经典款，**红豆麻薯盐面包**的麻薯量很足；**种子循环能量圈圈**虽然名字听着健康，但吃起来有梅干菜麦饼的神奇香味。\n\n### 🪑 环境和性价比如何？\n\n*   **环境氛围**：店面不大但通透明亮，是一家开在社区楼下的温馨小店，很适合秋天坐在店里喝咖啡吃面包。有食客提到店里的桌子摆着用翻糖做的多肉，细节很可爱。\n*   **人均消费**：根据地图信息，人均大约在 **¥26 - ¥36** 之间。\n*   **口味定位**：整体追求**健康低卡低GI**，有很多全麦产品和带馅的面包，不少款式不加糖，适合注重饮食健康的人。\n\n如果你去的话，建议优先试试那些带馅的咸口恰巴塔和招牌贝贝南瓜包。","mentioned":true,"memory":false,"refs":[{"t":"40多元在面包店买了点面包,都巨小,还没逛完商场就吃完了,现在是连面包都吃不起了吗? - 知乎","s":"知乎","u":"https://www.zhihu.com/question/1950346225187553301/answer/1959626091850368760?utm_medium=openapi_platform\u0026utm_source=e10c3ad29e50","k":"知乎","r":""},{"t":"忍不住都想抱回家 店内的环境也很棒，通透明亮","s":"大众点评","u":"https://www.dianping.com/discovery/827113520","k":"大众点评和美团","r":""},{"t":"麦的日尝","s":"Apple Maps: Directio","u":"https://maps.apple.com/place?auid=1118496272187665\u0026lsp=57879","k":"地图","r":"store"},{"t":"【Wheat daily麦的日尝(江城店)】电话_地址_价格_营业时间_南山路/柳浪闻莺/美术学院面包蛋糕团购","s":"大众点评网","u":"http://m.dianping.com/shop/1639039556?msource=applemaps","k":"大众点评和美团","r":"store"},{"t":"杭州市西湖区麦的日尝烘培店（个体工商户） - 企业工商信息 - 天眼查","s":"天眼查","u":"https://www.tianyancha.com/company/6980858527","k":"其他网站","r":"about"},{"t":"麦禾日尝鲜活面包(中吴雅苑店)","s":"Apple Maps: Directio","u":"https://maps.apple.com/place?auid=1118684310064366\u0026lsp=57879","k":"地图","r":""}]}],"b01_doubao":[{"text":"先给结论：麦的日尝是口碑不错的社区手作面包店，适合喜欢抹茶、米面包、低甜扎实面包的人；但它不是湖滨商圈，如果你就在西湖边逛街，专门跑过去成本偏高。\n \n✨店铺整体怎么样\n \n✅优点\n \n口味偏健康低甜：面包不会齁甜，很多全麦、米面包、杂粮类，用料扎实，面包体有嚼劲，抹茶系列是招牌，五十铃抹茶吐司、抹茶麻薯流心评价很高，抹茶香气足带微苦，不腻口。\n\n有特色款：紫苏腐乳包（咸口很特别）、艾草红豆米堡、黄米包、恰巴塔，选择比较丰富，咸甜都能挑到喜欢的[7]。\n\n性价比尚可，人均25‑26元，社区店风格，不是网红大店，更偏向吃面包本身，不是主打打卡拍照。\n \n⚠️缺点\n \n离西湖湖滨比较远：江城店距离湖滨约2.8公里；西溪店离西湖更远，靠近天目里、西溪，不适合逛西湖顺路随便拐过去，要专门绕路跑。\n\n冰面包不是它家强项，更推荐买吐司、米面包、麻薯流心、咸口面包；想吃冰面包，湖滨优先选Cycle\u0026Cycle。\n\n门店偏小，堂食座位有限，主要以外卖/打包带走为主。\n \n📍两家门店怎么选\n \nWheat daily麦的日尝（江城店）\n📍上城区江城路410号‑5室，近5号线候潮门站；靠近胡雪岩故居，离湖滨有距离，适合你在城南、望江、候潮门一带活动再去。\n \n\n \n麦的日尝·daily（西溪店）\n📍西湖区西溪路596号701室‑2，靠近天目里、古墩路地铁站；适合逛西溪、天目里的时候顺路打卡，不适合西湖湖滨逛街跑过来。\n \n\n \n简单帮你判断值不值得跑\n \n👉值得去：你爱吃抹茶面包、米面包、低甜手作面包，刚好人在候潮门/天目里附近，愿意专门跑一趟。\n👉不建议专门跑：你现在就在西湖湖滨逛街，只想随手买个面包/冰面包，优先选Cycle\u0026Cycle，距离更近更省事。\n \n你现在大概在西湖哪个位置？我帮你对比，看是就近买还是值得专门跑麦的日尝。","mentioned":true,"memory":false,"refs":[{"t":"有了这些面包再说杭州美食荒漠我不同意 #吃货日常 #面包 #试吃","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7419251164987903284","k":"抖音","r":""},{"t":"杭州好吃面包太多，推荐这几家最重要的原因是方便，大热天的不用找外卖都能到，仅代表自己口味哈#杭州吃喝玩乐 #面包脑袋","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7539894672970714368","k":"抖音","r":""},{"t":"文案：测评祐禾多款新品‼️真的好吃到夯‼️#祐禾十周年 #祐禾面包 #十年烘焙老店#祐禾冰室开张 #祐禾夏季新品上新","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7657966132117047488","k":"抖音","r":""},{"t":"祐禾夏季新品上新大测评！ 每款颜值口感都很在线，刷到抓紧囤！#祐禾面包 #十年烘焙老店#祐禾冰室开张 #祐禾夏季新品上新","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7658937071294395718","k":"抖音","r":""},{"t":"新打卡 杭州又没有 ～感觉风格跟鲍总 詹总 有点像 #吃货日常面包 #甜品治愈一切 #面包控 #测评美食 #甜品烘焙","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7645692417338145253","k":"抖音","r":""},{"t":"【麦的日尝】杭州严重被低估的社区面包店！怎么能把基础款做的如此好吃…！来杭州一定要吃它好吗 怒拿一桌15款测评 无广吃包员 #美食 #面包 ","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7554337662598909219","k":"抖音","r":"about"},{"t":"携程笔记-杭城藏在社区里的宝藏面包店，面包脑袋们的","s":"m.ctrip.com","u":"https://m.ctrip.com/webapp/you/community/detail?articleId=53915821\u0026hidePublishButton=true\u0026hideTitle=true\u0026allianceid=7144873\u0026sid=263483165","k":"携程","r":""},{"t":"携程笔记-杭州面包店已经到了下一个level了…","s":"m.ctrip.com","u":"https://m.ctrip.com/webapp/you/community/detail?articleId=53024707\u0026hidePublishButton=true\u0026hideTitle=true\u0026allianceid=7144873\u0026sid=263483165","k":"携程","r":""},{"t":"携程笔记-城西面包爱好者的福音，我要来进货了！！","s":"m.ctrip.com","u":"https://m.ctrip.com/webapp/you/community/detail?articleId=54183081\u0026hidePublishButton=true\u0026hideTitle=true\u0026allianceid=7144873\u0026sid=263483165","k":"携程","r":""},{"t":"in77边上有这么一家开在借鉴者边上的泰料？！ 味道确实还是可以的，打抛饭和牛骨汤算得上好吃，但这么拥挤的就餐空间真不应该，本身菜也不是很便","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7657111379253398819","k":"抖音","r":""},{"t":"啊啊啊啊啊！麦记的甜品也太好吃啦！#麦记糖水 #麦记杭州 #甜品 #糖水#麦记新店开业","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7538696132072344891","k":"抖音","r":""}]},{"text":"我帮你客观梳理下这家店，适合什么样的人，还有短板，你可以对照自己的情况判断值不值得专程跑一趟。\n \nWheat daily麦的日尝（江城店，现在正常营业）\n📍上城区江城路410号‑5室；靠近候潮门地铁站，离西湖湖滨有一小段距离，不是就在南山路边上。\n \n\n \n✅优点：\n \n主打低糖、低GI，健康向社区面包店，很多面包少糖，甜味多用果干、红枣桂圆本身，很适合减脂、控糖人群当早餐。\n\n抹茶系列口碑很强：五十铃抹茶吐司、抹茶麻薯流心，抹茶清苦不齁甜，是店里的王牌。\n\n恰巴塔三明治料很足，还有很有特色的紫苏腐乳包、黄米包这类创意款，口味有记忆点[3]。\n\n用料扎实，性价比尚可；店面不大，偏社区小店氛围，适合买面包带走，座位不多，不是主打长时间下午茶。\n \n⚠️缺点（要提前知道）：\n \n位置不在西湖/南山路步行圈，如果你正在南山路逛街，专门绕过来要花不少时间，顺路才合适，不建议专程打卡。\n\n新品、部分限定不是天天都有，去晚热门款容易卖完；部分馅料款调味比较特别（腐乳包），口味比较挑人，不一定所有人都喜欢。\n\n堂食座位很少，主要是外带，不适合过来坐着歇脚吃下午茶。\n \n👉总结建议：\n \n✅值得去：如果你喜欢低糖健康面包、爱吃抹茶，刚好在候潮门/江城路附近，想买早餐、外带面包，非常值得一试。\n\n❌不建议：如果你就在南山路逛，只想就近找一家坐下来吃甜品，就没必要特意绕路过来。\n \n如果你是在南山路一带逛，我可以再给你筛附近更顺路的备选。","mentioned":true,"memory":false,"refs":[{"t":"【麦的日尝】杭州严重被低估的社区面包店！怎么能把基础款做的如此好吃…！来杭州一定要吃它好吗 怒拿一桌15款测评 无广吃包员 #美食 #面包 ","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7554337662598909219","k":"抖音","r":"about"},{"t":"为什么杭州的蛋糕烘焙店有卷有好处？ 为什么杭州的蛋糕烘焙店有卷有好处？#蛋糕烘焙 #会员管理 #有赞 #社交营销 #顾客关系 #杭州好店 #","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7533565070169607474","k":"抖音","r":""},{"t":"携程笔记-城西面包爱好者的福音，我要来进货了！！","s":"m.ctrip.com","u":"https://m.ctrip.com/webapp/you/community/detail?articleId=54183081\u0026hidePublishButton=true\u0026hideTitle=true\u0026allianceid=7144873\u0026sid=263483165","k":"携程","r":""},{"t":"#烘焙脑袋热议中#","s":"weitoutiao.zjurl.cn","u":"https://weitoutiao.zjurl.cn/rogue/topic_share/?concern_id=1802109338482731\u0026prevent_activate=1","k":"其他网站","r":""},{"t":"大概也就是一周吃了六个腐乳恰巴塔吧～ #香迷糊了 #面包脑袋 #杭州美食 #甜品烘焙 #麦的日尝","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7548094709894630682","k":"抖音","r":"about"},{"t":"麦的日尝主理人yoyo亲测数据: 餐前血tang:5.1 餐后2小时:5.8 为什么选低GI面包? GI (升tang指数)越低，消化越慢，","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7535095829317733673","k":"抖音","r":"own"}]}],"b01_hunyuan":[{"text":"麦的日尝（Wheat Daily）是杭州**社区日式烘焙小店**，不是硬核欧包/碱水路线，走“软面包+麻薯流心+抹茶/冰面包+小蛋糕”的治愈系路线。\n\n**值不值得去：**\n- 你在**吴山广场/南山路/铁冶路/城西**一带逛 → 值得顺路买，不用专门跑。\n- 你是**碱水/恰巴塔/天然酵母硬核党** → 别去，它面包体偏软、甜口和麻薯流心更多。\n- 你想带**杭州旅游伴手礼** → 不如知味观/南宋胡记有“杭州符号”；麦的日尝更适合“当场吃或当天吃”。\n\n**招牌可以买：**\n- 抹茶麻薯流心面包（抹茶正、不苦、麻薯拉丝）\n- 法芙娜巧克力麻薯流心（冷吃像生巧）\n- 冰面包（抹茶/荔枝/提拉米苏，夏天友好）\n- 蛋黄芋泥大鼓、日式香肠包\n- 端午有粽子面包/端午礼盒，戚风和小蛋糕也稳 [1][3][12]\n\n**门店与时机：**\n- 铁冶路7-2号（近吴山广场/清波门）是老被提到的一家；另有江城店、城西棠子桥店等。\n- 上午到中午款式最全，**麻薯流心、冰面包、芋泥类中午就容易空**。\n- 面包偏软，不适合放太久；冰面包别久放，当天吃最好。\n\n一句话：**麦的日尝 = 杭州逛街途中“买个软甜面包当下午茶”的好店，不是碱水党圣地，也不是传统杭式伴手礼店。**\n\n要不要我帮你把“麦的日尝 + Cycle \u0026 Cycle + 知味观”排成一条西湖边能吃完/能带走的动线？","mentioned":true,"memory":false,"refs":[{"t":"#美食[超话]##杭州美食##吃吃吃# Wheat Da... 来自朗月流霜 - 微博","s":"微博","u":"https://www.weibo.com/1630831571/OuQpPnGKI?from=page_1005051630831571_profile\u0026wvr=6\u0026mod=weibotime","k":"微博","r":""},{"t":"吴山广场的这家社区面包店,真想天天来｡","s":"携程旅行","u":"https://m.ctrip.com/webapp/you/community/detail?articleId=21420778\u0026isHideNavBar=YES\u0026seo=0","k":"携程","r":""},{"t":"杭州梧桐树下的面包店探秘","s":"百度一下","u":"https://mbd.baidu.com/newspage/data/dtlandingsuper?nid=dt_4539808740959850956","k":"百度系","r":""},{"t":"Wheat daily麦的日尝(江城店)","s":"大众点评","u":"https://m.dianping.com/shop/1639039556","k":"大众点评和美团","r":"store"},{"t":"杭州发酵面包节:4家必尝面包店推荐","s":"百度一下","u":"https://mbd.baidu.com/newspage/data/dtlandingsuper?nid=dt_4564388495230036940","k":"百度系","r":""},{"t":"杭州市西湖区麦的日尝烘培店(个体工商户)","s":"新工商名录集","u":"https://gongshang.mingluji.com/zhejiang/name/%E6%9D%AD%E5%B7%9E%E5%B8%82%E8%A5%BF%E6%B9%96%E5%8C%BA%E9%BA%A6%E7%9A%84%E6%97%A5%E5%B0%9D%E7%83%98%E5%9F%B9%E5%BA%97%EF%BC%88%E4%B8%AA%E4%BD%93%E5%B7%A5%E5%95%86%E6%88%B7%EF%BC%89","k":"其他网站","r":"about"},{"t":"杭城藏在社区里的宝藏面包店,面包脑袋们的","s":"携程旅行","u":"https://m.ctrip.com/webapp/you/community/detail?articleId=53915821\u0026isHideNavBar=YES\u0026seo=0\u0026sid=29927766","k":"携程","r":""},{"t":"拾间系新作杭州日杂风烘焙店-麦的日尝","s":"拾间系","u":"http://mp.weixin.qq.com/s?__biz=Mzg5NDc0MjMyNQ==\u0026mid=2247506133\u0026idx=1\u0026sn=5deeab1bf921f5f8693be29d35d78294\u0026chksm=c189e5dc8f886193f688152701433888e7cf7123b7e53d3b9dbad7b648c282019be24456e712#rd","k":"微信公众号","r":"about"},{"t":"【携程攻略】携程旅游攻略,自助游,自驾游,出游,自由行攻略指南","s":"携程旅行","u":"https://m.ctrip.com/webapp/you/community/detail?articleId=21350689\u0026isHideNavBar=YES\u0026seo=0","k":"携程","r":""},{"t":"杭州市西湖区麦的日尝烘培店(个体工商户)","s":"爱企查","u":"https://www.aiqicha.com/company_detail_53320137268022","k":"其他网站","r":"about"},{"t":"这家日式面包也太好吃了叭!","s":"大众点评","u":"https://m.dianping.com/ugcdetail/192203964?bizType=29\u0026sceneType=0","k":"大众点评和美团","r":""}]},{"text":"麦的日尝（Wheat daily）是杭州本地**日系社区烘焙**里口碑比较稳的一家，值得去，但别当“硬核欧包/天然酵母党”的朝圣地——它是**日式软面包 + 抹茶甜点 + 小蛋糕**路线。\n\n### 一、它强在哪\n- **抹茶系出彩**：抹茶麻薯流心、抹茶柚子切块、抹茶红豆冰面包、五十铃抹茶吐司，抹茶味正、不苦不齁，抹茶脑袋会喜欢 [1][9]\n- **日式软包好吃**：面包体松软有嚼劲，乌米桂花包、斑斓芋泥、牛乳卷、戚风切块都属于“闭眼买不翻车”\n- **咸口也有记忆点**：菌菇萨拉米火腿恰巴塔、紫苏腐乳包、咸蛋黄芋泥大鼓，不是纯甜面包店\n- **社区店氛围好**：铁冶路老店离吴山广场近，西溪/江城店也能逛吃，有堂食位，适合下午茶 [2][4]\n\n### 二、短板\n- 面包体偏软，**不是法式/酸种/低糖油路线**；喜欢硬壳恰巴塔、乡村面包的会嫌“太日系太软”\n- 冰面包/麻薯流心**冷藏好吃，夏天外卖久放会塌、麻薯变死**\n- 热门款（抹茶麻薯、乌米包）晚点去容易售罄；景区边老店游客多，工作日上午去最稳\n- 单价不便宜，人均 25–30 元，当零食买可以，当早餐囤货偏贵\n\n### 三、值不值得专程去\n- 在**吴山/河坊街/西湖东线**逛 → 顺路去铁冶路店，买抹茶麻薯+牛乳卷，值\n- 住**城西/西溪** → 去西溪路店，比网红排队店舒服\n- 你是**抹茶控 / 软面包控 / 带长辈小孩下午茶** → 值得\n- 你是**欧包狂热 / 低糖油天然酵母党 / 只想买可颂** → 不如去 nekopan、面包与空气、B.U 这类\n\n### 四、闭眼买清单\n抹茶麻薯流心、乌米桂花包、牛乳卷、抹茶柚子切块、菌菇萨拉米恰巴塔、咸蛋黄芋泥大鼓。\n\n要不要我帮你把“杭州本地面包店”按**抹茶控 / 欧包党 / 咸口控 / 带娃下午茶**分一版必去清单？","mentioned":true,"memory":false,"refs":[{"t":"#美食[超话]##杭州美食##吃吃吃# Wheat Da... 来自朗月流霜 - 微博","s":"微博","u":"https://www.weibo.com/1630831571/OuQpPnGKI?from=page_1005051630831571_profile\u0026wvr=6\u0026mod=weibotime","k":"微博","r":""},{"t":"杭城藏在社区里的宝藏面包店,面包脑袋们的","s":"携程旅行","u":"https://m.ctrip.com/webapp/you/community/detail?articleId=53915821\u0026isHideNavBar=YES\u0026seo=0","k":"携程","r":""},{"t": 薯流心\n面包松软，抹茶流心+可以拉丝的麻薯，微甜不腻，抹茶味突出，是很多人的必点款。\n\n紫苏腐乳包（咸口特色）\n很有辨识度的咸面包，紫苏搭配腐乳风味，咸香开胃，喜欢咸口面包一定要试。\n\n艾草红豆米堡\n米面包体QQ有嚼劲，带艾草香气，里面有年糕+绵密红豆，糯叽叽，口感层次很好。\n\n桂圆红枣包\n低糖健康路线，面包体有嚼劲，甜味来自桂圆红枣本身，适合减脂人群。\n \n小提示：门店产品会随季节上新，到店可以看当日柜台；不主打冰面包，想吃冰面包优先选湖滨的Cycle\u0026Cycle。\n \n📍两家门店信息\n \n① Wheat daily麦的日尝(江城店)\n \n📍地址：上城区江城路410号‑5室，近5号线候潮门站，离胡雪岩故居约600米；距离湖滨约2.8公里。\n⏰营业时间：09:00‑21:00。\n \n\n \n② 麦的日尝·daily(西溪店)\n \n📍地址：西湖区西溪路596号701室‑2，近3号线古墩路站，离天目里约570米，适合逛西溪/天目里过来。\n⏰营业时间：09:30‑20:30。\n \n\n \n✅怎么选\n \n在城南、候潮门、鼓楼附近 → 选江城店。\n\n在天目里、西溪、古墩路附近 → 选西溪店。\n\n人在西湖湖滨逛街，不建议专门跑过来，距离较远。\n \n你现在大概在杭州哪个位置？我帮你看哪家更顺路。","mentioned":true,"memory":false,"refs":[{"t":"了解当家产品 | 麦当劳官网","s":"www.mcdonalds.com.cn","u":"https://www.mcdonalds.com.cn/know_your_icon/","k":"其他网站","r":""},{"t":"麦记牛奶夏日限定酒酿系列上新！大满贯太太太好吃啦！！！ #麦记牛奶 #麦记牛奶新品 #这碗酒酿上头了 #把夏天酿成一碗甜 #麦记酒酿小丸子","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7667466775026557577","k":"抖音","r":""},{"t":"麦记的新品也太惊艳了！！好好喝#麦记牛奶 #麦记牛奶新品 #这碗酒酿上头了 #夏日限定饮品 #杨枝甘露冰酒酿","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7667785122180155749","k":"抖音","r":""},{"t":"好吃，喜欢吃 #麦记牛奶 #麦记北京 #麦记糖水 #麦记新店开业 #麦记甜品","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7670399135959129316","k":"抖音","r":""},{"t":"麦当劳携手G-DRAGON开启亚洲多市场联动，于中国内地带来全新鸡肉美味和独家潮流体验_长沙晚报掌上长沙","s":"m.toutiao.com","u":"http://m.toutiao.com/group/7694280230555124258/","k":"今日头条","r":""},{"t":"chiikawa小卡免费领!蘸酱炸鸡￥11.9! | 热点更新 | 麦当劳官网","s":"www.mcdonalds.com.cn","u":"https://www.mcdonalds.com.cn/news/20260817-/","k":"其他网站","r":""},{"t":"Store Locations-1点点","s":"www.alittle-tea.com","u":"https://www.alittle-tea.com/en/storelocations/1/30/321/?page=25","k":"其他网站","r":""},{"t":"门店据点-1点点","s":"www.alittle-tea.com","u":"https://www.alittle-tea.com/storelocations/1/12/88/?page=2\u0026index_m3_blink=88","k":"其他网站","r":""},{"t":"Store Locations-1点点","s":"www.alittle-tea.com","u":"https://www.alittle-tea.com/en/storelocations/1/34/349/3082/?page=23","k":"其他网站","r":""}]},{"text":"先给门店，再讲招牌，同时标注哪些是常驻、哪些是限定。\n \n两家正常营业门店✅\n \nWheat daily麦的日尝(江城店)\n📍上城区江城路410号‑5室；⏰09:00‑21:00；靠近5号线候潮门站，逛胡雪岩故居顺路可以来。\n \n\n \n麦的日尝·daily(西溪店)\n📍西湖区西溪路596号；⏰09:30‑20:30；西溪、天目里游玩顺路。\n \n\n \n提示：早年城西棠子桥店不确定营业，不要盲跑；两家店每日烤制清单不完全一样，热门款傍晚容易卖完。\n \n招牌产品（常驻必点）\n \n三重芝士腐乳恰巴塔｜头号招牌\n咸口创意款，一定要加热吃，冷吃风味大打折扣；可以真空打包，适合当伴手礼。\n\n开心果海盐卷\n黄油可颂基底，开心果奶酥内馅，坚果香气足，吃多会略腻。\n\n五十铃抹茶流心麻薯/抹茶吐司\n抹茶清苦不齁甜，麻薯可以拉丝，复热口感更佳。\n\n乌米面包、苹果黄米面包\n谷物口粮面包，甜度低，更适合携带。\n \n⚠️不确定（季节限定）：艾草、龙井、杨梅类面包，只对应季节上新，到店不一定有，不要专门为限定跑一趟。\n \n购买小提示\n \n线下：到店可要求真空打包，方便带回；\n\n线上：微信小程序「麦的日尝WheatDaily」，支持同城自提、配送，部分时段开放全国冷链邮寄。\n \n需要我帮你挑适合旅游带走的3款精简清单吗？","mentioned":true,"memory":false,"refs":[]}],"b02_hunyuan":[{"text":"**麦的日尝（Wheat daily）**是杭州一家日杂风/社区烘焙店，主打松软日式面包、小蛋糕、冰面包和季节限定面包，走“每日一尝、妈妈手作感”的路线。[6][9]\n\n### 一、招牌产品\n- **冰面包**：馅料足、外皮松软、不甜腻，是最常被种草的款\n- **戚风/草莓戚风小蛋糕**：口感绵软，裱花精致，适合下午茶\n- **五十铃抹茶麻薯**：抹茶味浓、麻薯拉丝\n- **蛋黄芋泥大鼓**：咸甜口，午后就容易售罄\n- **日式香肠包 / 日式盐卷**：软面包路线，咸口耐吃\n- **紫苏腐乳包**：杭州独一味，咸香带紫苏\n- **粽子面包 / 端午龙舟包 / 节日限定**：造型可爱，有咸蛋黄芋泥、乌米豆沙等\n- **生日蛋糕 \u0026 切块蛋糕**：颜值高，很多本地人用来订生日蛋糕\n\n### 二、杭州门店（常见 3 家）\n1. **吴山/清波店**：上城区铁冶路 7-2 号（近吴山广场站）\n2. **江城店**：上城区江城路 410 号-5 室（Wheat daily 麦的日尝·江城店）\n3. **西溪/城西店**：西湖区西溪路 596 号 701 室-2；另有城西棠子桥 32 号被探店文章提到，去前建议地图/电话确认是否仍在营 [3][5]\n\n\u003e 注：哈尔滨有“面包的日尝”，名字很像但不是同一家；你问“麦的日尝”通常是杭州这家。\n\n要不要我帮你把这几家门店的**营业时间、电话、哪家出新品最快**整理成一张速查表？","mentioned":true,"memory":false,"refs":[{"t":"麦的日尝·daily(西溪店)","s":"大众点评","u":"https://m.dianping.com/shop/1393019671?msource=applemaps","k":"大众点评和美团","r":"store"},{"t":"面包的日尝","s":"百度百科","u":"https://baike.baidu.com/item/面包的日尝/65891923","k":"百度系","r":""},{"t":"杭州市西湖区麦的日尝烘培店(个体工商户)","s":"新工商名录集","u":"https://gongshang.mingluji.com/zhejiang/name/%E6%9D%AD%E5%B7%9E%E5%B8%82%E8%A5%BF%E6%B9%96%E5%8C%BA%E9%BA%A6%E7%9A%84%E6%97%A5%E5%B0%9D%E7%83%98%E5%9F%B9%E5%BA%97%EF%BC%88%E4%B8%AA%E4%BD%93%E5%B7%A5%E5%95%86%E6%88%B7%EF%BC%89","k":"其他网站","r":"about"},{"t":"杭城藏在社区里的宝藏面包店,面包脑袋们的","s":"携程旅行","u":"https://m.ctrip.com/webapp/you/community/detail?articleId=53915821\u0026isHideNavBar=YES\u0026seo=0", 99%BD%E9%A2%86","k":"地图","r":""},{"t":"桐庐最近新开了一家非常值得去的店——Bread Boom 面包热潮，就在未来湖水街。","s":"知乎专栏","u":"https://zhuanlan.zhihu.com/p/2053776046533636343?utm_medium=openapi_platform\u0026utm_source=e10c3ad29e50","k":"知乎","r":""},{"t":"不夸张，我买到了全网最好吃的吐司。","s":"zhihu","u":"https://zhuanlan.zhihu.com/p/617844255#0","k":"知乎","r":""},{"t":"闪现杭州！博主推荐12公里跑步路线串联的3家顶流面包店","s":"微博","u":"https://www.weibo.com/2/detail/5351738975980336","k":"微博","r":""},{"t":"杭州人氣烘焙店 - 第5頁 | Trip.com - 住宿","s":"Trip.com","u":"https://hk.trip.com/restaurant/hangzhou-14/bakeries-e1/5/#1","k":"其他网站","r":""},{"t":"","s":"知乎","u":"https://www.zhihu.com/people/zingfood/pins","k":"知乎","r":""},{"t":"藏在千亩稻田里的窑烤面包，有人开车2小时去吃，凭啥这么火？ - 今日头条","s":"今日头条","u":"https://www.toutiao.com/article/7693772928655065628/?wid=1791353668361","k":"今日头条","r":""},{"t":"杭州面包糕点逛吃地图🗺攻略含测评‼️","s":"澳洲省钱快报","u":"https://www.dealmoon.com.au/post/3226826","k":"其他网站","r":""},{"t":"杭州哪里可以买到最好吃的面包？","s":"zhihu","u":"https://www.zhihu.com/question/67009118#1","k":"知乎","r":""},{"t":"周末能卖1000个！萧山90后夫妻的乡村窑烤店火了，再投百万开新店！第一波打卡的人说……","s":"网易","u":"https://www.163.com/dy/article/L8L4AQ3605149IKJ.html","k":"网易","r":""},{"t":"杭州人氣烘焙店 - 第19頁 | Trip.com","s":"Trip.com","u":"https://hk.trip.com/restaurant/hangzhou-14/bakeries-e1/19/","k":"其他网站","r":""},{"t":"在这里，面包与生活正发生，坚持自己的面包理念！","s":"zhihu","u":"https://zhuanlan.zhihu.com/p/644789607#0","k":"知乎","r":""},{"t":"杭州有什么好吃的面包店吗?","s":"zhihu","u":"https://www.zhihu.com/question/31839418#1","k":"知乎","r":""}]},{"text":"的面包店选择挺多样的，从网红爆款到社区宝藏都有。这里整理了几家特点比较鲜明的，你可以根据口味和想去的区域来选。\n\n### 🥐 杭州面包店推荐清单\n\n**Happy面包店**\n位于钱塘区义蓬街道，主打“料理吐司”，把和牛、泡菜五花肉、甚至猪脑花堆在厚切吐司上，创意十足。招牌“鲜花吐司”口感柔软，很受周边街坊欢迎，每天面包几乎午间就售罄。\n\n**BUTTERFUL\u0026CREAMOROUS (黄油与面包)**\n杭州的网红店，在嘉里中心和湖滨银泰IN77都有店。招牌是可颂，以高品质黄油和酥脆口感著称。店面装修有“巴黎面包博物馆”的风格，很适合拍照打卡，但排队的人通常比较多。\n\n**炙屿SPACE窑烤面包空间**\n萧山区南阳街道的一家窑烤面包店，用大窑炉恒温烘烤。主打脆肠碱水面包、爆浆榴莲等，带有独特的果木炭烤风味。店铺带院子，有田园风光，适合周末去放松一下。\n\n**布咕面包**\n上城区顺福路的一家社区面包店，评分很高（4.7）。推荐菜包括**贡菜腊肠恰巴塔**、**红豆黄油碱水**和**招牌盐面包**，价格比较亲民，人均约28元。\n\n**37Domain\u0026Bakery / 猫咪面团nekopan / bake post邮炉**\n如果喜欢探索，可以留意这组被博主串联起来的“顶流面包店”。它们各有特色，比如37Domain的黑松露生吐司、猫咪面团的斑斓神户吐司，以及bake post的藜麦吐司，适合面包脑袋专门去打卡。\n\n**其他口碑连锁与特色店**\n如果想找离家近或者更日常的选择，这些也可以参考：\n*   **可莎蜜儿**：杭州本地常见的连锁品牌，亲亲家园店评分4.4，人均约28元，日常买早餐或下午茶很方便。\n*   **甜之盐法式西点**：在杭州有20多家门店，主打软欧包和法式甜点，脏脏包、奶酪包是特色。\n*   **BakingPower**：位于湖滨银泰B1层，以现烤菠萝包和重芝士蛋糕闻名，菠萝包搭配冰牛油口感独特。\n\n这里面有你想去的商圈或者想尝试的口味吗？告诉我你的偏好，我再帮你推荐更合适的～","mentioned":false,"memory":false,"refs":[{"t":"一家社区面包店，靠什么一“包”难求？","s":"杭州市人民政府","u":"https://www.hangzhou.gov.cn/col/col812262/art/2026/art_795b037af555440da24edff63bb3f7e2.html","k":"其他网站","r":""},{"t":"2026 BUTTERFUL\u0026CREAMOROUS | 항저우 음식점: 코스 및 여행자 사진 | 트립 모먼트 - 2026 BUTTE","s":"Trip.com","u":"https://kr.trip.com/moments/poi-butterfulandcreamorous-134302903/#1","k":"其他网站","r":""},{"t":"可莎蜜儿（亲亲家园店）","s":"百度百科","u":"https://baike.baidu.com/item/%E5%8F%AF%E8%8E%8E%E8%9C%9C%E5%84%BF%EF%BC%88%E4%BA%B2%E4%BA%B2%E5%AE%B6%E5%9B%AD%E5%BA%97%EF%BC%89/14259225?bst=1790304138.b2098e6d737b1ecd","k":"百度系","r":""},{"t":"甜之盐法式西点","s":"百度百科","u":"https://baike.baidu.com/item/%E7%94%9C%E4%B9%8B%E7%9B%90%E6%B3%95%E5%BC%8F%E8%A5%BF%E7%82%B9?bst=1790681160.5abd590b3e5dfb94","k":"百度系","r":""},{"t":"#2026 BUTTERFUL\u0026CREAMOROUS | 杭州レストランの観光ガイドと旅行体験 | Trip Moments - 2026 ","s":"Trip.com","u":"https://jp.trip.com/moments/poi-butterfulandcreamorous-134302903/#1","k":"其他网站","r":""},{"t":"BakingPower","s":"百度百科","u":"https://baike.baidu.com/item/BakingPower","k":"百度系","r":""},{"t":"2026 BUTTERFUL\u0026CREAMOROUS Ресторан: идеи и рекомендации | Trip Moments","s":"Trip.com","u":"https://ru.trip.com/moments/theme/poi-butterfulandcreamorous-134302903-restaurant-993134/#1","k":"其他网站","r":""},{"t":"粉红派脏脏包这个名字就已经赢了","s":"Weibo","u":"https://m.weibo.cn/status/5282664354684520","k":"微博","r":""},{"t":"地铁直达！萧山这里又开出一家“宝藏小店”！是城里没有的味道~","s":"澎湃新闻","u":"https://m.thepaper.cn/newsDetail_forward_33190956","k":"其他网站","r":""},{"t":"布咕面包, 中国浙江省杭州市","s":"Apple Maps: Directio","u":"https://maps.apple.com/place?place-id=H2710I3F9A16E47F545\u0026_provider=57879","k":"地图","r":""},{"t":"📍杭州で話題！まるで美術館のようなベーカリー🥐✨ | Trip.com 杭州","s":"Trip.com","u":"https://jp.trip.com/moments/detail/hangzhou-14-149236978/","k":"其他网站","r":""},{"t":"闪现杭州！博主推荐12公里跑步路线串联的3家顶流面包店","s":"微博","u":"https://www.weibo.com/2/detail/5351738975980336","k":"微博","r":""},{"t":"面包新语（华商店）","s":"百度百科","u":"https://baike.baidu.com/item/%E9%9D%A2%E5%8C%85%E6%96%B0%E8%AF%AD%EF%BC%88%E5%8D%8E%E5%95%86%E5%BA%97%EF%BC%89/14262749?bst=1789897581.0535f7bd78e3719a","k":"百度系","r":""},{"t":"林先生的面包店LamsBakery(庆春店)","s":"Apple Maps: Directio","u":"https://maps.apple.com/place?auid=1118492926518577\u0026lsp=57879","k":"地图","r":""},{"t":"面包脑袋夏日料多多手作三明治｜圆脸雯子","s":"xwjapp.com","u":"http://mapi.xwjapp.com/article/show-1145830006.html","k":"其他网站","r":""},{"t":"GURU Ye's咕噜爷·薪木焼","s":"Apple Maps: Directio","u":"https://maps.apple.com/place?place-id=H2710I3F96ABD2C086B\u0026_provider=57879","k":"地图","r":""}]}],"q01_doubao":[{"text":"我给你挑3家风格完全不一样，口碑稳定的面包店，覆盖商场选购、咸口吐司、社区安静小店：\n \n红跑车(来福士店)\n✅特色：商场优选，可以试吃；软欧、谷物欧包、乳酪包很出彩，桑葚乳酪是招牌，甜度克制，适合逛街随手买，家庭老少都适配。\n \n\n \n富贵里面包公司(河坊街店)\n✅特色：咸口爱好者首选；招牌猪肉脯吐司、猪肉脯可颂咸香入味，米面包、吐司选择多，河坊街逛街顺路买很合适。\n \n\n \nSOIM椿缓\n✅特色：居民区宝藏小店，氛围安静，面包+巴斯克甜品双在线；抹茶奶酥麻薯吐司、薄荷巴斯克口碑很高，不齁甜，适合下午茶小坐。\n \n\n \n快速选择\n \n逛商场、想试吃买欧包 → 红跑车\n\n偏爱咸口吐司、河坊街附近 → 富贵里\n\n想要安静小店、兼顾面包+甜品 → SOIM椿缓\n \n你告诉我所在区域、偏好甜/咸，我可以再精简最合适的一家。","mentioned":false,"memory":false,"refs":[]},{"text":"我挑了两家风格完全不一样的，一家是咸口馅料爱好者必冲，一家主打法式酥脆可颂，方便你按口味选：\n \n1、富贵里面包公司（河坊街店）｜咸口馅料天花板，游客友好\n \n✅适合：爱吃咸口吐司、料足面包，逛河坊街/江城路顺路买，做早餐很合适\n🔥必点：猪肉脯吐司、猪肉脯可颂，肉脯咸香，吐司松软，很多人专门来买这两款。还有斑斓米面包、金沙芋泥吐司，甜口也在线。\n📍上城区河坊街11号，江城路地铁口很近，逛老城顺路就能买。\n \n\n \n2、P.L.SÉRÉNADE By Gontran Cherrier（钱江新城店）｜法式可颂专门店\n \n✅适合：追求黄油香气、酥脆可颂，想吃正统法式面包，店内可以坐下来吃下午茶\n🔥必点：原味可颂、咖啡奶油可颂，层次酥脆，黄油风味很足；米面包、贝果也不错，早餐搭配咖啡很舒服。\n📍上城区新业路30号，靠近新业路地铁站，来福士附近，环境好看适合歇脚。\n \n\n \n快速帮你选\n \n偏爱咸香馅料、吐司、米面包，逛老城、河坊街附近 → 选富贵里\n\n想吃酥脆可颂、法式面包，顺便坐下来喝东西，在钱江新城/来福士一带 → 选GC这家\n \n你在杭州哪个片区？更喜欢咸口还是甜口，我可以再帮你筛更近的店。","mentioned":false,"memory":false,"refs":[]}],"q01_hunyuan":[{"text":"杭州好吃的面包店不少，想尝鲜可以按口味选：**法式可颂**去瑟兰邸，**创意软包**去 Hi π·红跑车，**糕点小贝**选鲍师傅，**老牌实惠**选九月生活。\n\n### 一、法式与精品面包\n\n#### 瑟兰邸P.L.SÉRÉNADE（钱江新城店）\n\n可颂曾获得法国面包节奖项，特点是层次分明、酥香明显，适合喜欢经典法式面包的人；店内环境安静，也可顺便喝咖啡。\n\n\n\n\n\n\n### 二、创意口味与日常甜点\n\n#### 1. Hi π·红跑车BAKERY（来福士店）｜水果乳酪风味突出\n\n青提物语、桑葚乳酪是招牌，兼顾颜值和口味，适合想一次尝试几款、又不想只买传统甜面包的人。\n\n\n\n\n\n\n#### 2. 鲍师傅糕点（501城市广场店）｜海苔酥松小贝\n\n招牌小贝外层酥松、内馅绵密，更适合买来当零食或下午茶；它是糕点店，并非主打欧包和吐司。\n\n\n\n\n\n\n### 三、实惠老牌选择\n\n#### 九月生活（市民中心店）\n\n人均更亲民，鲜肉榨菜月饼口碑较好，适合顺路购买，不需要专门安排一趟探店。\n\n\n\n\n\n\n### 怎么选\n\n- 专程吃法式可颂：选**瑟兰邸**\n- 喜欢水果乳酪创意包：选 **Hi π·红跑车**\n- 想吃酥松小贝：选**鲍师傅**\n- 顺路买实惠点心：选**九月生活**\n\n你在杭州哪个区？我可以按离你最近的门店帮你筛。","mentioned":false,"memory":false,"refs":[{"t":"面包脑袋私藏的杭州9 家面包店!","s":"寻味慢旅","u":"http://mp.weixin.qq.com/s?src=11\u0026timestamp=1791466692\u0026ver=7014\u0026signature=vODcMLIoOMwfrQj5uZqa*nEUwiEM-bsSk3j*k9E2FTuXlGe4CvmI-yd07vXSnRNJpImvElltQb8tctFzEFWLB9MJBt3vAaL4M2uLgtomOrhTADlsJlskeeyLaSGEW7QF\u0026new=1","k":"微信公众号","r":""},{"t":"杭州市 面包店","s":"amap","u":"https://ranks.amap.com/ranking/%E9%9D%A2%E5%8C%85%E5%BA%97/%E6%9D%AD%E5%B7%9E%E5%B8%82/%E7%99%BD%E9%A2%86","k":"地图","r":""},{"t":"杭州面包专辑(1)如我一般以面包为主食的人请看这里","s":"无牙耳","u":"http://mp.weixin.qq.com/s?__biz=MzI2MTY1Mzg1Nw==\u0026mid=2247488664\u0026idx=1\u0026sn=0a3fecb1819953ba4519832f30de7b02\u0026chksm=ebdbef9cca218bf944c98af87b12ac0e78855b1cf6f2820432898fc10455be022a15c4db8569#rd","k":"微信公众号","r":""},{"t":"赴旧港:刷到好多人推荐杭州这几家面包店,周末挑了几家去试｡Cycle\u0026Cycle在杭州有多家分店,龙井豆乳冰面包确实清爽,冰着吃很舒服｡上城","s":"今日头条","u":"https://www.toutiao.com/a1865751171603593","k":"今日头条","r":""},{"t":"杭州的面包店是真卷啊!这里的小店,面包脑袋逛吃一整天不重样","s":"途野小记","u":"http://mp.weixin.qq.com/s?src=11\u0026timestamp=1791466692\u0026ver=7014\u0026signature=rSC92gfiRsTLO2cK*xkIQmLBjbi0BwP4bxEAMyIbxsdaLwdJ3wDpoXXI5E3hQSEieVXVky0*O-uC3WzP9w31UXbAEQuFc3Sfy-XEsjyDCkq5MRiBsbY802M7JqEw6-h6\u0026new=1","k":"微信公众号","r":""},{"t":"杭州好吃的面包甜品店推荐!","s":"杭州本地宝","u":"http://mp.weixin.qq.com/s?__biz=MzAwOTY1NTI5Ng==\u0026mid=2652662789\u0026idx=1\u0026sn=02fd559fbeb23caab34cfb2abfca44d7\u0026chksm=81e708c143c23387f6e41e01bd538c964a80676d44bb38680f67812933ec359c36835af896d2#rd","k":"微信公众号","r":""},{"t":"那些松软美味的面包,杭州好吃的3家面包店攻略","s":"xinchufang","u":"https://www.xinchufang.com/shipu/129883932551201/","k":"其他网站","r":""}]},{"text":"杭州面包店很“卷”，按口味分档给你排：\n\n### 🥇 杭州本地招牌 / 必打卡\n- **富贵面包公司**（湖墅北路运河店、奥体中心店、奥体印象城店）：猪肉脯吐司、猪肉脯可颂、南瓜吐司、斑斓米面包，用料舍得下本，咸甜口很杭州。[5][7]\n- **猫咪面团 NEKOPAN**（滨江春晓路、河坊街、小河直街）：日系软包天花板，斑斓神户吐司、抹茶麻薯米面包、咸蛋黄年糕米面包，糯叽叽党狂喜。[3]\n- **Cycle \u0026 Cycle**（多店）：冰面包、海盐卷、红酒坚果面包、芝士碱水球，日式低糖低油，越嚼越香。[1][5]\n\n### 🥈 社区神店 / 面包脑袋私藏\n- **慢熟面包店**（孩儿巷70号）：盐面包、南瓜包、慢熟吐司，社区小店不网红但稳。\n- **37 Domain \u0026 Bakery**（金茂悦店）：藤椒腊肠恰巴塔、蓝纹核桃恰巴塔，咸口欧包党爱。\n- **micro boulangerie**（华星路）：花椒腰果恰巴塔、黑松露罗勒芝士恰巴塔，高水量欧包/恰巴塔派。\n- **Colorful Bakery**（塘萍路）：浙大系平价店，6 块贝果、9 块法棍，南瓜芋泥是回购王。\n- **1997 baker**（冬泽巷）：芋泥猪肉脯、酸黄瓜法棍，日式馅料派。\n- **Franquette**（通普路）：法式欧包、国王饼、红茶安曼卷，硬欧党去。\n- **HORSE VICTORY**（朝晖路）：苹果酥、凤梨酥、国王饼，开酥类很能打。\n\n### 🥉 日常通勤 / 性价比\n- **可莎蜜儿**：杭州街边密度高，全麦吐司、蛋黄酥、鲜奶蛋糕、绿豆糕，早餐和送礼都行。\n- **九月生活**：全麦吐司片做三明治很实在，会员日/半价日买不心疼。\n- **佑禾 / UH**：商场店，肉松红豆吐司、脏脏包、乳酪包，适合逛街顺手买。\n- **85℃ / 熊治 / 莱噢**：平价现烤，当早餐消耗可以，别期待“神店级”。\n\n### 按需求速选\n- 送人/游客打卡：**富贵面包 + 猫咪面团**\n- 早餐囤货：**可莎蜜儿全麦吐司、九月生活全麦片、Colorful 贝果**\n- 咸口/欧包/恰巴塔：**37 Domain、micro、Franquette、Sourdough No.521**\n- 甜面包/米面包/软包：**猫咪面团、Cycle \u0026 Cycle、marufuwa**\n- 法甜/蛋糕顺带吃：**海绵客厅、Foamy Foamy、茉芙、N2 平方、皮师傅马卡龙**\n\n\u003e 小提醒：杭州神店**上午去最全**，斑斓/猪肉脯/可颂/碱水球傍晚常售罄；买多就冷冻，吃前烤箱 180℃ 喷点水烤 3 分钟，比放常温好太多。\n\n要不要我按你“在杭州哪区、想买早餐 / 送人 / 探店拍照”再缩到 3 家就近路线？","mentioned":false,"memory":false,"refs":[{"t":"面包脑袋私藏的杭州9 家面包店!","s":"寻味慢旅","u":"http://mp.weixin.qq.com/s?__biz=MzY5MzE4Mjc1Nw==\u0026mid=2247484835\u0026idx=1\u0026sn=099265684c99e476ab44fc60bedf87a2\u0026chksm=f5098c84adb7a46808c463fc6619c645720b08062c4c09c5c4c930a74ae91896ec4cddb9347b#rd","k":"微信公众号","r":""},{"t":"无限回购的9家杭州面包店面包脑袋看过来!","s":"甜味星球","u":"http://mp.weixin.qq.com/s?__biz=Mzk1NzE5NjI4OA==\u0026mid=2247483686\u0026idx=1\u0026sn=d0129f0f2ccaecb00065e1b1c84f0e93\u0026chksm=c2f91e7fb3061aeb55a91996bd44678
