/a1865751171603593","k":"今日头条","r":""},{"t":"九月生活","s":"trip","u":"https://tw.trip.com/restaurant/china/hangzhou/detail/restaurant-42039706/","k":"其他网站","r":""}]}],"q02_deepseek":[{"text":"路沿线及附近的甜品店选择不算特别密集，但有几家老店和特色店可以留意。离南山路稍远一点的湖滨银泰 in77 商场里，面包甜品店会更集中一些。\n\n### 🍰 南山路直接沿线的选择\n\n*   **安之秀菓（南山路店）**：位于南山路260号（大华饭店对面）。这是一家开了多年的日式西点店，以半熟芝士出名。环境比较安静，适合坐在窗边慢慢吃。\n*   **小黄楼英式下午茶（南山路旗舰店）**：在南山路广福里2号，是一栋黄色小洋楼风格的店。主打英式下午茶，环境复古，适合专门去坐一下午，不过有人觉得甜品味道偏甜腻，价格也偏高。\n*   **FLUFFY.LFB**：在南山路35号的郭宅里。这是一家日式软冰淇淋专门店，杭州门店有**龙井茶口味**的限定款，顺路可以去打个卡。\n*   **哈根达斯（西湖天地店）**：在南山路147号西湖天地。属于比较常规的连锁冰淇淋店，如果正好逛到那边想吃点冰的可以考虑。\n\n### 🥐 稍远但选择更集中的地方\n\n如果你愿意多走几步，南山路附近的 **湖滨银泰 in77** 商场里面包甜品店非常多，选择面会宽很多。\n*   **裕莲茶楼**、**Gram舒芙蕾**、**B\u0026C黄油与面包**、**Foamyfoamy** 等店都在那一带。其中 **Foamyfoamy** 的招牌**荔浦芋头蛋糕**比较受欢迎。\n\n你是更倾向于坐在南山路沿线的店里慢慢吃，还是想去湖滨银泰 in77 顺便逛逛？告诉我你的偏好，我再给你些具体建议。","mentioned":false,"memory":false,"refs":[{"t":"【安之秀菓(南山路店)】安之秀菓(南山路店)电话，安之秀菓(南山路店)地址_360地图","s":"360地图","u":"https://map.360.cn/?pid=92ba3e693d3e7397\u0026src=pc_shenbian","k":"地图","r":""},{"t":"普利欧","s":"百度百科","u":"https://baike.baidu.com/item/%E6%99%AE%E5%88%A9%E6%AC%A7","k":"百度系","r":""},{"t":"来杭州旅游西湖是必打... - 狗蛋来咯的「此刻」","s":"十六番","u":"http://live.16fan.com/info/624322.html","k":"其他网站","r":""},{"t":"西湖边百年历史建筑散发新文化品位","s":"杭州市人民政府","u":"https://www.hangzhou.gov.cn/art/2025/2/13/art_812270_59109529.html","k":"其他网站","r":""},{"t":"BakingPower","s":"百度百科","u":"https://baike.baidu.com/item/BakingPower","k":"百度系","r":""},{"t":"哈根达斯(西湖天地店)","s":"搜了网","u":"https://www.51sole.com/company/detail_6357365.html","k":"其他网站","r":""},{"t":"【渊美术馆·下午茶】渊美术馆·下午茶电话，渊美术馆·下午茶地址_360地图","s":"360地图","u":"https://map.360.cn/?pid=df39a52e5d3982fb\u0026src=onebox","k":"地图","r":""},{"t":"浮力森林（平海店） - 杭州市上城区的蛋糕西点店","s":"百度百科","u":"https://baike.baidu.com/item/%E6%B5%AE%E5%8A%9B%E6%A3%AE%E6%9E%97%EF%BC%88%E5%B9%B3%E6%B5%B7%E5%BA%97%EF%BC%89#1","k":"百度系","r":""},{"t":"西湖春天(南山店) - 电话邦","s":"Dianhua","u":"https://www.dianhua.cn/dt/852327c908684d6c8fc7d00d99e8b5e7/277e2729099d33ec16d1177517a2d6d1","k":"其他网站","r":""},{"t":"日本人パティシエがいるケーキ屋さん＠杭州「安の秀菓」 - グッチのブログ","s":"cocolog-nifty.com","u":"http://gucciman-ikkob.cocolog-nifty.com/blog/2010/11/post-b9a8.html","k":"其他网站","r":""},{"t":"","s":"抖音","u":"https://www.douyin.com/note/7397607947657874700","k":"抖音","r":""},{"t":"【小黄楼英式下午茶(南山路旗舰店)】小黄楼英式下午茶(南山路旗舰店)电话，小黄楼英式下午茶(南山路旗舰店)地址_360地图","s":"360地图","u":"https://map.360.cn/?pid=f2853c23df95c27e\u0026src=seo","k":"地图","r":""},{"t":"海丰西餐社 - 电话邦","s":"Dianhua","u":"https://www.dianhua.cn/dt/3411d3fa9bd142dfac5a0c6601d90246/a94fc641561654a5164c1770e0a2d6ab","k":"其他网站","r":""},{"t":"️杭州“小巴黎”「1730·巴黎面包博物馆」#小暑吃什么# #小暑# #一条微博记录小暑# ☕满满的复古宫廷风～装修加入了很多具有年代感的设","s":"手机新浪网","u":"https://www.sina.cn/news/detail/5185799987398013.html","k":"其他网站","r":""},{"t":"杭州旅游攻略，杭州网红店打卡/精致复古的英式 下午茶--穷游网","s":"穷游网","u":"https://biu.qyer.com/p/XmgVDzcaHgiWcxXfnADwtg.html","k":"其他网站","r":""},{"t":"面包新语湖滨银泰店","s":"百度百科","u":"https://baike.baidu.com/item/%e9%9d%a2%e5%8c%85%e6%96%b0%e8%af%ad%e6%b9%96%e6%bb%a8%e9%93%b6%e6%b3%b0%e5%ba%97/14326938","k":"百度系","r":""},{"t":"安之秀菓(南山路店)","s":"携程","u":"https://you.ctrip.com/food/hangzhou14/5142488.html","k":"携程","r":""},{"t":"Foamy Foamy湖滨D区店 - 电话邦","s":"Dianhua","u":"https://www.dianhua.cn/dt/b685889939ba4a61920b74297362fc25/58a0153879fdb0471dd0177ccaa2d639","k":"其他网站","r":""},{"t":"自然的心意 - 安之秀菓甜品店，杭州 / 万境设计_店铺","s":"Sohu","u":"https://m.sohu.com/a/329470378_163548/?pvid=000115_3w_a","k":"搜狐","r":""}]},{"text":"边南山路附近值得去的面包甜品店，首选这几家：\n\n### 🍰 安之秀菓（南山路店）\n南山路260号（大华饭店正对面），杭州老牌日式洋菓子店，也是最早把“半熟芝士”带入国内的门店之一。招牌**半熟芝士**上层软滑、下层松软，口感轻盈不腻；**半熟布丁**和**卡仕达泡芙**也值得一试。环境是白色与原木风，落地窗正对南山路梧桐，很适合坐下慢慢吃。\n\n### ☕ GAWT小黄楼\n南山路广福里2号，藏在西湖边老宅里的英式下午茶店，甜点由米其林三星背景的主厨操刀。推荐**经典下午茶套餐**、**金牌伯爵**和**拿破仑**，葡萄干司康配果酱或黄油霜也是不少人的心头好。\n\n### 🥐 湖滨银泰 in77（紧邻南山路）\n如果愿意多走几步到延安路，湖滨银泰 in77 里选择非常多，基本可以一站式吃遍：\n*   **B\u0026C黄油与面包**：法式风格，牛角包系列酥脆有嚼劲。\n*   **UH祐禾**：红豆肉松吐司是招牌，试吃大方，经常出新品。\n*   **Foamy Foamy**：网红甜品店，**荔浦芋头蛋糕**是招牌，奶油不腻。\n*   **裕莲茶楼**：焦糖可颂蛋挞是明星产品，奶油号角也值得一试。\n*   **知味观**：如果想买杭州特色的**龙井茶饼**当伴手礼，这里现烤的比包装款好吃很多。\n\n这几家风格差异比较大，看你是想坐在南山路边安静吃日式甜品，还是去商场里一次多买几种。","mentioned":false,"memory":false,"refs":[{"t":"安之秀菓（南山路店） (西湖湖濱商圈, 杭州) – 菜單、評論及資訊 | Trip.com","s":"Trip.com","u":"https://tw.trip.com/restaurant/china/hangzhou/detail/anzhixiuguo-11292041/","k":"其他网站","r":""},{"t":"沿着西湖选出这7家！告诉你南山路上究竟藏着多少下午茶好去处","s":"jiangxifood.net","u":"https://www.jiangxifood.net/lenglianwuliu/news/canyinmeishi/186785/","k":"其他网站","r":""},{"t":"安之秀菓甜品店，杭州|万境设计","s":"序赞","u":"https://www.vsszan.com/forum.php?mod=viewthread\u0026tid=529550","k":"其他网站","r":""},{"t":"BakingPower","s":"百度百科","u":"https://baike.baidu.com/item/BakingPower","k":"百度系","r":""},{"t":"杭州安之秀菓甜品店，营造更加自然舒适的环境","s":"goooods.net","u":"http://goooods.net/Gooood/gooooddetail/id/668.html","k":"其他网站","r":""},{"t":"面包新语湖滨银泰店","s":"百度百科","u":"https://baike.baidu.com/item/%e9%9d%a2%e5%8c%85%e6%96%b0%e8%af%ad%e6%b9%96%e6%bb%a8%e9%93%b6%e6%b3%b0%e5%ba%97/14326938","k":"百度系","r":""},{"t":"向阳坊(南山路)","s":"Apple Maps: Directio","u":"https://maps.apple.com/place?auid=1117327135776025\u0026lsp=57879","k":"地图","r":""},{"t":"来杭州旅游西湖是必打... - 狗蛋来咯的「此刻」","s":"十六番","u":"http://live.16fan.com/info/624322.html","k":"其他网站","r":""},{"t":"️杭州“小巴黎”「1730·巴黎面包博物馆」#小暑吃什么# #小暑# #一条微博记录小暑# ☕满满的复古宫廷风～装修加入了很多具有年代感的设","s":"手机新浪网","u":"https://www.sina.cn/news/detail/5185799987398013.html","k":"其他网站","r":""},{"t":"杭州面包糕点逛吃地图🗺攻略含测评‼️","s":"加拿大省钱快报","u":"https://m.dealmoon.ca/post/3226826","k":"其他网站","r":""},{"t":"海丰西餐社 - 电话邦","s":"Dianhua","u":"https://www.dianhua.cn/dt/3411d3fa9bd142dfac5a0c6601d90246/a94fc641561654a5164c1770e0a2d6ab","k":"其他网站","r":""},{"t":"浮力森林（平海店） - 杭州市上城区的蛋糕西点店","s":"百度百科","u":"https://baike.baidu.com/item/%E6%B5%AE%E5%8A%9B%E6%A3%AE%E6%9E%97%EF%BC%88%E5%B9%B3%E6%B5%B7%E5%BA%97%EF%BC%89#1","k":"百度系","r":""},{"t":"粉红派脏脏包这个名字就已经赢了","s":"Weibo","u":"https://m.weibo.cn/status/5282664354684520","k":"微博","r":""},{"t":"Foamy Foamy湖滨D区店 - 电话邦","s":"Dianhua","u":"https://www.dianhua.cn/dt/b685889939ba4a61920b74297362fc25/58a0153879fdb0471dd0177ccaa2d639","k":"其他网站","r":""}]}],"q02_doubao":[{"text":"给你挑了南山路沿线3家风格差异明显的店，分别适配江南传统糕点、精致芝士甜品、简约氛围感下午茶：\n \n知味观(南山路店)｜江南传统糕点，可当伴手礼\n \n📍上城区南山路174‑1‑2室\n✅亮点：老字号，龙井酥、龙井茶饼、条头糕很出圈，甜度克制不腻；可以堂食也能打包做伴手礼，逛西湖顺路买很合适。\n✅适合：想吃杭州本地风味糕点，兼顾随手吃+伴手礼。\n \n\n \n安之秀菓(南山路店)｜主打半熟芝士，精致小甜品\n \n📍上城区南山路260号（大华饭店对面）\n✅亮点：南山路人气甜品店，招牌半熟芝士、半熟布丁口感绵密柔和；店面安静，适合坐下来喝下午茶，拍照好看。\n✅适合：偏爱芝士类甜品，想要安静堂食歇脚。\n \n\n \nFLUFFY MOOD(杭州西湖店)｜简约氛围，清爽甜品冰淇淋\n \n📍西湖区南山路35号\n✅亮点：位置靠近长桥公园，环境简约清新；主打清爽甜品、冰淇淋，口味不厚重，逛完湖边过来吃很舒服。\n✅适合：湖边散步之后，想吃清爽不腻的甜品、冰淇淋。\n \n\n \n简单帮你快速选：\n \n要杭州本地糕点、还想买伴手礼 → 知味观\n\n想吃半熟芝士，安静坐下来下午茶 → 安之秀菓\n\n湖边散步，想吃清爽甜品冰淇淋 → FLUFFY MOOD\n \n如果你更偏向面包多一点，或者想吃抹茶类，我可以再帮你筛备选。","mentioned":false,"memory":false,"refs":[]},{"text":"我给你挑了南山路两家风格完全不一样的，一个中式老字号、一个精致西式甜品，方便你按喜好选：\n \n1. 知味观（南山路店）｜中式杭式糕点，逛街随手买\n \n📍上城区南山路174‑1‑2室（清波门附近）\n✅适合：想吃杭州本地点心、可以边走边吃，也能买伴手礼。\n招牌：龙井酥、柿柿如意糕、定胜糕、条头糕，甜度克制不齁甜。\n⚠️提醒：这家店同时做正餐，饭点人多嘈杂；糕点可以打包带走，更适合边走边逛吃。\n \n\n \n2. 安之秀菓（南山路店）｜西式精致甜品，适合坐下来歇脚\n \n📍上城区南山路260号（大华饭店对面）\n✅适合：逛累了想坐下来吃甜品，环境安静好拍照，主打半熟芝士、布丁这类西式小甜点。\n招牌：半熟布丁、半熟芝士，口味柔和，适合下午茶小坐。\n⚠️提醒：店面不大，座位有限，主打精致小份甜品，不是面包店。\n \n\n \n快速帮你二选一\n \n想吃杭州本土糕团、边走边吃、顺带伴手礼 → 选知味观南山路店\n\n想要安静坐下来、吃西式甜品歇脚拍照 → 选安之秀菓\n \n你更喜欢中式还是西式？我可以再帮你筛最合适的一家。","mentioned":false,"memory":false,"refs":[]}],"q02_hunyuan":[{"text":"南山路沿湖这一带甜品和面包店密度很高，按**湖景氛围**和**本地口碑**给你分两档：\n\n### 一、湖景咖啡+甜品（坐下来看湖）\n- **知味观·味庄（杨公堤/南山路口）**：老字号分号，定胜糕、龙井茶酥、荷花酥现做，游客向但味道稳，靠窗能看曲院风荷。\n- **湖畔居茶楼（湖滨路）**：不是纯甜品店，但龙井茶点+西湖藕粉+定胜糕配湖景，长辈接待首选。\n- **Bella Vita（南山路西段）**：意式 gelato+提拉米苏，露天座正对湖，年轻情侣向。\n\n### 二、本地人回购的面包/甜品\n- **吴山烤鸡旁边的“新丰小吃”别去**，但**“知味观总店（仁和路）”**步行10分钟，鲜肉小笼+甜口酥饼更值得。\n- **南山路“可莎蜜兒（Casa Miel）”**：西班牙风甜品，焦糖布丁和杏仁可颂口碑稳，本地小姐姐常买。\n- **“BAKER\u0026SPICE 杭州湖滨店”**：湖滨银泰边，酸面包、肉桂卷、咸派做得很正，适合带回去当早餐。\n- **“原麦山丘 杭州西湖文化广场店”**稍远一点，但软欧包是杭州 Top 级，南山路打车起步价。\n- **“Lady M 杭州湖滨银泰店”**：千层蛋糕招牌，甜度偏美式，适合送人或拍照。\n\n### 三、想买特产带走\n- **知味观 现烤酥饼（葱油/甜味）**：南山路多家分店，10元一盒，最稳的手信。\n- **“采芝林”旁的“胡庆余堂药膳糕点”**：不是纯甜品，但芝麻糕、山楂糕长辈喜欢。\n\n### 四、避坑\n- 南山路靠湖一排“网红打卡店”溢价高、味道一般，除非只为拍照。\n- “西湖龙井蛋糕”这类名字花哨的，多半是普通戚风+抹茶粉，别当特色。\n- 周末下午湖滨一带排队严重，建议上午10点前或晚上8点后去。\n\n要不要我按“带长辈 / 情侣约会 / 买手信”三种目的，帮你排一条南山路+湖滨的散步动线？","mentioned":false,"memory":false,"refs":[]},{"text":"南山路附近有不少值得打卡的面包甜品店。如果想就近解决，首推就在南山路上的**安之秀菓**，既能吃到口碑极佳的半熟芝士，部分座位还能直接欣赏西湖景致；如果愿意稍微走远一点，附近还有几家极具特色的宝藏小店。\n\n### 一、就近首选 · 边吃边赏西湖景\n\n#### 安之秀菓（南山路一店）\n- **基础信息**：南山路 260 号（大华饭店对面）｜人均约 25–59 元\n- **推荐理由**：南山路上的老牌人气日式西点店。招牌半熟芝士和半熟布丁口感绵密、入口即化，搭配年轮蛋糕一起品尝刚好；二楼设有堂食座位和景观餐位，能边吃甜品边看西湖，非常适合下午茶小憩。[3][5]\n\n### 二、周边宝藏 · 面包与甜品专营店\n\n#### 1. DOLCE E SALATO\n- **基础信息**：凤山新村 214 号 1 幢（万松岭路口凤凰山脚下）｜人均约 45 元\n- **推荐理由**：藏在万松岭一带的宝藏小店，虽然店面不起眼，但面包和甜点出品都很稳，适合专门去探店打卡。[1][2]\n\n#### 2. Little62 家庭甜品店\n- **基础信息**：下满觉陇 55-1｜人均约 48 元\n- **推荐理由**：主打温馨家庭风格的甜品店，甜点款式丰富，适合喜欢安静、偏私房甜品氛围的朋友。[1][2]\n\n### 三、特色糕点 · 中式与现烤风味\n\n#### 1. 杨先生糕点（湖滨学士路店）\n- **基础信息**：学士路 48 号一层｜人均约 31 元\n- **推荐理由**：如果除了西式甜品还想尝尝中式糕点，这家是不错的选择，营业时间较长，晚上逛完南山路顺路买些当伴手礼也很合适。[1][2]\n\n#### 2. 五谷七福·每日现烤（平海路店）\n- **基础信息**：平海路 30-2,30-3｜人均约 31 元\n- **推荐理由**：主打每日现烤的面包糕点，早上开门较早，如果是早晨沿湖散步，可以来这里买份新鲜出炉的面包当早餐。[1][2]\n\n### 怎么选\n- 想边吃边看湖景、体验老牌日式甜品，直接去 **安之秀菓**。\n- 追求宝藏小店氛围，往南走一点去 **DOLCE E SALATO** 或 **Little62**。\n- 想吃中式糕点伴手礼，选 **杨先生糕点**。\n\n这几家的位置跨度不小，你是打算饭后顺路买，还是准备专门留半天时间去探店呢？","mentioned":false,"memory":false,"refs":[{"t":"安之秀菓(南山路一店)","s":"百度百科","u":"https://baike.baidu.com/item/安之秀菓(南山路一店)/14261779","k":"百度系","r":""},{"t":"敲进江南:在西湖边把荷花吃成一道菜!","s":"李百蟹杭州西湖湖景店","u":"http://mp.weixin.qq.com/s?src=11\u0026timestamp=1791466613\u0026ver=7014\u0026signature=UaADsBAMcqh0RKxBjpRZU12C32ugAeSdum7WDfwJKPfj9c52CybNMdoK45uiHoknSNv4L2NLjpMyMCrOFrS*6BhPh3tVxB*ICOvDo9IZ4aWqVpZfvWxW3*2Xg1Cd1ajx\u0026new=1","k":"微信公众号","r":""},{"t":"沿着西湖逛了大半圈选出这7家!告诉你南山路上究竟藏着多少家下午茶好去处","s":"搜狐网","u":"https://www.sohu.com/a/241947309_100066614","k":"搜狐","r":""},{"t":"2026年省心的传统必吃特色小吃店挑选全攻略","s":"中科商务网","u":"http://m.zk71.com/nw50121647/product/227686473.html","k":"其他网站","r":""},{"t":"湖风渐凉,月华渐浓,西湖天地多家商户携中秋礼盒温情登场!从宋韵雅点到家常风味,每一份节礼都是对团圆最温柔的注解","s":"杭州西湖天地","u":"http://mp.weixin.qq.com/s?src=11\u0026timestamp=1791466613\u0026ver=7014\u0026signature=AuxiYgaaXki4J6Vihmxq4e7BUNXnkH3Bcsw4Ts4r1nZYyhpvNN0JhQfdXm0ijpKJZ5mPt2IG3Azq2waUAUHaj1p3hqDa17x8uG4M-NB5gRC-g0zx-XqJtVM4B96k1kib\u0026new=1","k":"微信公众号","r":""},{"t":"春分时节,来西湖天地,慢享一席盎然的下午茶!桃花轻舞,碧波微澜,闲坐湖畔,静静沉醉在春光里","s":"杭州西湖天地","u":"http://mp.weixin.qq.com/s?src=11\u0026timestamp=1791466613\u0026ver=7014\u0026signature=AuxiYgaaXki4J6Vihmxq4e7BUNXnkH3Bcsw4Ts4r1nY2pZRroZ6WZJBjlIP2-qPhc5zf3F0353*28He252IF2VEwCtxn0MgTqVZhsQb1gg3kHJoIIwJT772XsjNtrg8h\u0026new=1","k":"微信公众号","r":""},{"t":"三个年轻人去杭州有那些可以玩的和吃的?","s":"百度知道","u":"https://zhidao.baidu.com/question/137735817.html","k":"百度系","r":""},{"t":"普利欧(南山店)","s":"大众点评网","u":"https://www.dianping.com/review/62592413","k":"大众点评和美团","r":""},{"t":"用100张图告诉你:杭州究竟有多好吃!_地址","s":"今日看点","u":"https://m.kandian5.com/articles/18575.html","k":"其他网站","r":""}]}],"q03_deepseek":[{"text":"的 **cycle \u0026 cycle** 和 **SICO SICO** 的冰面包口碑较好，两者都因龙井豆乳口味受到推荐。\n\n*   **cycle \u0026 cycle**：冰面包的面包体被形容为“生吐司的口感”，内馅有“爆浆感”。其龙井豆乳味被评价为茶香与豆乳融合得很好，完全不腻，是当时最受推荐的口味。另有金桂酒酿等特色口味。不过有食客认为价格偏高（当时约18元/个）。\n*   **SICO SICO**：有食客特别推荐其**龙井豆乳冰面包**，认为面包体蓬松柔软，内馅的豆乳奶油冰凉丝滑，并带有淡淡的龙井茶清香，完全符合预期。\n\n此外，杭州日报报道过一家冷冻烘焙工厂店 **“早安咚咚”**（萧山区合欢路），店内售卖**爆浆冰面包**，主打价格优势，售价为 **4.5元/个**。这类店铺的核心陈设是冰柜，产品需冷冻储存，可解冻直接食用。\n\n如果你对某个品牌的具体门店位置感兴趣，可以再告诉我。","mentioned":false,"memory":false,"refs":[{"t":"杭州有哪些人气超高的甜品店推荐？ - 唧唧复唧唧 的回答","s":"知乎","u":"https://www.zhihu.com/question/640033883/answer/1947237400901296564?utm_medium=openapi_platform\u0026utm_source=e10c3ad29e50","k":"知乎","r":""},{"t":"单价个位数 撬动面包囤货新场景","s":"杭州日报","u":"https://hzdaily.hangzhou.com.cn/mrsb/2026/08/05/article_detail_3_20260805A124.html","k":"其他网站","r":""},{"t":"喜欢在杭州吃吃吃，还不是因为有这些神仙面包店","s":"zhihu","u":"https://zhuanlan.zhihu.com/p/531175441#1","k":"知乎","r":""}]},{"text":"这几家的冰面包口碑比较好：\n\n*   **Cycle \u0026 Cycle**：冰面包是它家的夏季招牌，口味很有记忆点。其中 **龙井豆乳** 和 **金桂酒酿** 被提及最多，茶香和豆乳结合，酒酿发酵味浓郁，甜度控制得不错。不过价格偏贵，个头较小，大概 18 元一个。\n*   **AZAHAR 安莎烘焙**：这家店的 **豆乳口味冰面包** 比较受欢迎，专门针对低糖偏好者推出，适合不喜欢太甜的人。此外，**艾草豆乳冰面包** 也是店里的人气款。\n*   **宽焙客手感烘焙**：如果追求性价比，可以考虑这家。它的 **白桃冰面包** 价格在 12 元左右，面包口感新鲜，奶油不甜腻。","mentioned":false,"memory":false,"refs":[{"t":"喜欢在杭州吃吃吃，还不是因为有这些神仙面包店","s":"zhihu","u":"https://zhuanlan.zhihu.com/p/531175441#1","k":"知乎","r":""},{"t":"夏日专属冰面包来袭 携低糖、茶味等创新口感更符合年轻客群偏好 杭州网消费-消费维权-杭州网","s":"杭州网","u":"https://xiaofei.hangzhou.com.cn/xfzx/content/2020-06/18/content_9068541.htm","k":"其他网站","r":""},{"t":"杭州有哪些人气超高的甜品店推荐？ - 唧唧复唧唧 的回答","s":"知乎","u":"https://www.zhihu.com/question/640033883/answer/1947237400901296564?utm_medium=openapi_platform\u0026utm_source=e10c3ad29e50","k":"知乎","r":""},{"t":"AZAHAR安莎烘焙(中山北路店)","s":"Apple Maps: Directio","u":"https://maps.apple.com/place?auid=1118414693039645\u0026lsp=57879","k":"地图","r":""},{"t":"宽焙客手感烘焙(绿城杨柳郡店)","s":"Apple Maps: Directio","u":"https://maps.apple.com/place?auid=1118368789058979\u0026lsp=57879","k":"地图","r":""}]}],"q03_doubao":[{"text":"我分两类：西湖湖滨就近（逛西湖顺路）、口碑网红（愿意跑一点路），冰面包核心看：面包体松软、内馅是冰凉动物奶油，买完尽快吃，要冷藏。\n \n📍湖滨西湖边（优先选，逛街不用绕远）\n \n1. Cycle\u0026Cycle面包店（湖滨in77店）\n \n📍位置：湖滨银泰in77 C区，龙翔桥地铁附近，逛西湖湖滨最方便。\n✅冰面包亮点：杭州冰面包老牌，日式抹茶、龙井豆乳、白桃都是热门口味。面包体软软的，奶油馅冰爽，抹茶微苦不齁甜，龙井豆乳很有杭州本地特色；夏天买记得要冰袋。\n \n\n \n✨值得跑一趟的网红店（馅料巨足）\n \n2. 入口天物（万象城店）\n \n📍位置：钱江新城万象城B1，地铁钱江路站，离湖滨有几公里，适合专门跑过去探店。\n✅冰面包亮点：榴莲椰粒、龙井生巧冰面包口碑很强，馅料给得很足，咬开有爆浆感，奶油绵密，榴莲味很浓郁。\n \n提示：馅料量大，吃多容易腻，建议1‑2人分食。\n \n\n \n快速帮你选\n \n人就在西湖湖滨、龙翔桥逛街，不想跑远 → 直接选 Cycle\u0026Cycle湖滨店，口味稳，位置最方便。\n\n愿意专门跑钱江新城，想吃馅料爆炸、榴莲/生巧口味 → 选 入口天物。\n \n💡小提醒：冰面包一定要冷藏保存，现买现吃口感最好；不要放常温久放，奶油容易化。\n \n你现在大概在西湖哪一段？我帮你看哪家过去更省事。","mentioned":false,"memory":false,"refs":[{"t":"入口天物你什么时候开到我家楼下…#吃货日常甜品 #入口天物 #榴莲面包 #杭州美食 #这个世界上不能没有甜品","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7664599594248989285","k":"抖音","r":""},{"t":"杭州面包店又打卡啦！！🥐 这次吃到的榴莲王，口感真的绝了～#面包 #面包脑袋 #美食 #入口天物 #入口天物杭州","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7662779528549370222","k":"抖音","r":""},{"t":"杭州面包节大测评！爽吃8家，内附价格～ #面包测评 #面包节","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7640304164106624625","k":"抖音","r":""},{"t":"第一次在Cycle Cycle吃到了这么多口味的冰面包 每一款都清爽不腻夏日必备哦#抖音美食推荐官 #冰面包 #cyclecycle #网红","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7118360272041037096","k":"抖音","r":""},{"t":"特种兵24h极限逛吃杭州，附攻略和美食地图 #快乐碳水的正确打开方式 #杭州旅游 #杭州攻略 #杭州美食","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7646430000010415202","k":"抖音","r":""},{"t":"杭州到底私藏了多少面包好货！！ 面包脑袋简直掉进了米缸里 真的是有被美食荒漠之称的杭州惊艳到（当然醋鱼除外） horse•victory的蛋","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7646629275910573318","k":"抖音","r":""},{"t":"杭州中山北路攻略请查收！#杭州美食 #杭州中山北路 #一天吃什么 #杭州面包 #中山北路美食","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7537241301063404860","k":"抖音","r":""},{"t":"杭州不是美食荒漠！至少面包不是🦥🦥 #面包特种兵 #杭州美食 #杭州面包 #杭州面包店","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7380568559811841314","k":"抖音","r":""},{"t":"杭州面包路线！步行爽吃六家店 #杭州美食 #面包 #值得去的面包店 #杭州面包 #杭州面包到底还藏着多少惊喜","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7681895270490370990","k":"抖音","r":""},{"t":"携程笔记-它家的冰面包在杭州真的没有对手！","s":"m.ctrip.com","u":"https://m.ctrip.com/webapp/you/community/detail?articleId=66336649\u0026hidePublishButton=true\u0026hideTitle=true\u0026allianceid=7144873\u0026sid=263483165","k":"携程","r":""}]},{"text":"给你挑两家口碑很稳、冰面包评价高的，风格不一样，按需选：\n \n1.红跑车（来福士店）｜咸香芝士内馅首选\n \n✅亮点：北海道冰面包，面包体松软云朵感，内馅是微微咸香的芝士动物奶油，不会齁甜，很多食客专门冲这款来买。\n📍上城区新业路228号来福士B1层37A号；地铁4号线江锦路站直达。\n💡小提醒：冰面包是冷藏款，买完尽快吃，口感最佳。\n \n\n \n2.迦南（庆春店）｜多口味选择，减糖不腻\n \n✅亮点：冰面包口味多（抹茶、巧克力等），面包软，奶油清爽减糖，动物奶油，不容易腻，性价比高，适合喜欢多口味尝鲜的人。\n📍上城区太平门直街395号，庆春广场地铁口附近。\n \n\n \n快速帮你选\n \n偏爱咸芝士奶油、追求稳定不出错 → 优先红跑车北海道冰面包\n\n想要抹茶/巧克力多种口味、偏好清爽减糖 → 选迦南\n \n你在哪个区？我可以再帮你筛就近门店。","mentioned":false,"memory":false,"refs":[]}],"q03_hunyuan":[{"text":"杭州提到“冰面包”，本地面包党基本第一个想到 **Cycle\u0026Cycle**，如果想换口味，可以再看看 **富贵面包公司 / 猫咪面团**。\n\n### 1. Cycle\u0026Cycle（最稳、最常被推）\n- 门店：中山北路377号、天目里、益乐路、万象城等\n- 特点：日式冰面包老网红，面包体软、内馅冰凉不腻，口味迭代快\n- 闭眼试：**龙井豆乳、日式抹茶、红茶啵啵、玫瑰荔枝、白桃牛乳**\n- 适合：第一次吃、带朋友打卡、夏天解腻 [1][5][7]\n\n### 2. 富贵面包公司\n- 门店：湖墅北路总店，运河店/奥体/西溪印象城等也有\n- 特点：偏“新中式+创意冰面包”，果味清爽、奶味重\n- 推荐：**椰子柠檬、生椰拿铁、青葡萄、黄瓜芦荟**\n- 适合：不想跟 Cycle 撞款、喜欢清爽果香的人 [6][9]\n\n### 3. 猫咪面团\n- 门店：春晓路、河坊街、小河直街\n- 特点：不是传统冰面包，但“抹茶麻薯克林姆”冰吃会爆浆，麻薯党会喜欢\n- 适合：顺路逛景区（河坊街/小河直街）时买\n\n### 4. 小提醒\n- 冰面包**当天冷藏吃最好**，放久面包体会干、奶油变腻\n- Cycle 热门口味下午容易售罄，想凑多种口味建议上午去\n- 便利店/超市的冰面包（咸蛋黄、奶茶等）胜在便宜，但奶油质感和面包体一般，别抱太高期待 [11]\n\n如果你在 **西湖区/拱墅区/上城区** 哪一片，我可以按“离你最近 + 不排队”再缩到 1–2 家。","mentioned":false,"memory":false,"refs":[{"t":"杭州面包脑袋集合!这一篇让你爽吃到停不下来!!","s":"Judy吃喝玩乐指南","u":"http://mp.weixin.qq.com/s?__biz=MzcwMDI0MjIzOQ==\u0026mid=2247483706\u0026idx=1\u0026sn=532334ed95e92055bdc1a694940b0468\u0026chksm=f5f26e8c55931ba3d97a2c64d54ac853f7c19f4cff984555c3917394359f97264aae42195bfa#rd","k":"微信公众号","r":""},{"t":"外地人来杭州必去的一... - 小猪噜噜_3577的｢此刻｣ - 十六番","s":"16fan","u":"https://live.16fan.com/info/438522.html","k":"其他网站","r":""},{"t":"赴旧港:刷到好多人推荐杭州这几家面包店,周末挑了几家去试｡Cycle\u0026Cycle在杭州有多家分店,龙井豆乳冰面包确实清爽,冰着吃很舒服｡上城","s":"今日头条","u":"https://www.toutiao.com/a1865751171603593","k":"今日头条","r":""},{"t":"微博正文 - 微博","s":"微博","u":"https://weibo.com/6749640086/Nr238hK0Z?from=page_1005056749640086_profile\u0026wvr=6\u0026mod=weibotime","k":"微博","r":""},{"t":"杭州探店 一起大富大贵呀","s":"QQ浏览器","u":"https://so.html5.qq.com/page/real/search_news?docid=70000021_30760a02b6a77369\u0026faker=1","k":"其他网站","r":""},{"t":"四子探店杭州最好吃的冰面包被我们找到了!","s":"肆拾记","u":"http://mp.weixin.qq.com/s?__biz=MzkwNjI0OTU3OA==\u0026mid=2247483813\u0026idx=1\u0026sn=ef48bb2c2fb16ad47f690d689dac1353\u0026chksm=c1e9661ebd6bf76731a29e24e001569e511b9222e0ee0de1904a6aced912948687359c8c277d#rd","k":"微信公众号","r":""},{"t":"“包治百病”,“偷偷”享受碳水带来的愉悦","s":"杭州网","u":"https://2022jnh.hangzhou.com.cn/content/content_8306513.html","k":"其他网站","r":""},{"t":"半页书:刷到好多人在说富贵面包公司,周末就去运河店试了下｡ 这波夏季新品还真有点东西｡椰子柠檬冰面包清清爽爽,椰香里带点柠檬的酸,天热吃刚好","s":"今日头条","u":"https://www.toutiao.com/a1867879052305412?channel=","k":"今日头条","r":""},{"t":"那些松软美味的面包,杭州好吃的3家面包店攻略","s":"xinchufang","u":"https://www.xinchufang.com/shipu/129883932551201/","k":"其他网站","r":""},{"t":"前方避雷预警!杭城7-11便利店网红人气单品别盲买!","s":"网易","u":"https://www.163.com/dy/article/FIQ0GHEN0522983A.html","k":"网易","r":""},{"t":"【杭州探店】老牌网红日式面包店—Cycle\u0026C","s":"QQ浏览器","u":"https://so.html5.qq.com/page/real/search_news?docid=70000021_42260e36ccf09769","k":"其他网站","r":""},{"t":"探店西湖区夏日最爽的第一口,都在这里了!","s":"西湖文旅发布","u":"http://mp.weixin.qq.com/s?__biz=MzkzODY1MzYyMQ==\u0026mid=2247608620\u0026idx=1\u0026sn=71b60140b7ed716e5fd89774afb9b40a\u0026chksm=c36a985a6226426fddf440361019efee31818507e41cdedd96290d140ddf806970bde7fbb106#rd","k":"微信公众号","r":""}]},{"text":"杭州冰面包，本地面包脑袋常点的两家：\n\n- **Cycle \u0026 Cycle**：冰面包“老网红”，面包体软有嚼劲，**龙井豆乳、白桃牛乳、红茶啵啵、抹茶**都稳，龙井豆乳最杭州。[4]\n- **富贵面包公司**：冰面包偏“馅大、面包体有韧性”，**百香果、树莓、椰子柠檬、生椰拿铁、开心果**好吃，不是单纯甜奶油挂的。[1][8]\n\n顺路可试：\n- **wode 沃德面包**（湖滨银泰 in77 D 区）：冰面包+前任咖啡是老组合，黄油感重，适合喜欢“像冰淇淋”的。\n- **Ponson 澎松**（拱墅后横港路）：榛巧脏脏冰面包、水牛乳类小甜面包很稳，社区店气质，不是游客店。[13]\n\n游客别专门跑远的话：**湖滨/武林/龙坞/运河附近优先 Cycle \u0026 Cycle 或 富贵面包公司**；想“杭州特色”就冲 **龙井豆乳冰面包**。\n\n小贴士：冰面包基本**当天做当天吃**，别买常温摆放的；看到“冷藏/冷冻柜里拿出来”的才对路。\n\n要不要我按“湖滨/小河直街/龙坞/西溪/奥体”几个游客动线，直接排好顺路买冰面包的店？","mentioned":false,"memory":false,"refs":[{"t":"推荐","s":"微博","u":"https://weibo.com/2639443307/Ja4xLjDFR?from=page_1005052639443307_profile\u0026wvr=6\u0026mod=weibotime","k":"微博","r":""},{"t":"杭州探店 一起大富大贵呀","s":"携程旅行","u":"https://m.ctrip.com/webapp/you/community/detail?articleId=8480721\u0026isHideNavBar=YES\u0026seo=0","k":"携程","r":""},{"t":"那些松软美味的面包,杭州好吃的3家面包店攻略","s":"xinchufang","u":"https://www.xinchufang.com/shipu/129883932551201/","k":"其他网站","r":""},{"t":"杭州可莎蜜儿探店体验银联云闪付南瓜夹心包菠菜欧包生产日期配料表_新浪新闻","s":"新浪网","u":"https://www.sina.cn/news/detail/5343355610333515.html","k":"其他网站","r":""},{"t":"wode沃德面包(湖滨银泰店)","s":"大众点评网","u":"https://www.dianping.com/review/413445444","k":"大众点评和美团","r":""},{"t":"杭州可莎蜜儿面包推荐:那些年最爱的味道","s":"百度一下","u":"https://mbd.baidu.com/newspage/data/dtlandingsuper?nid=dt_4642734247632185032","k":"百度系","r":""},{"t":"半页书:刷到好多人在说富贵面包公司,周末就去运河店试了下｡ 这波夏季新品还真有点东西｡椰子柠檬冰面包清清爽爽,椰香里带点柠檬的酸,天热吃刚好","s":"今日头条","u":"https://www.toutiao.com/a1867879052305412?channel=","k":"今日头条","r":""},{"t":"国内城市","s":"大众点评网","u":"https://www.dianping.com/review/442479925","k":"大众点评和美团","r":""},{"t":"可莎蜜儿(凤起店)","s":"百度百科","u":"https://baike.baidu.com/item/%E5%8F%AF%E8%8E%8E%E8%9C%9C%E5%84%BF%EF%BC%88%E5%87%A4%E8%B5%B7%E5%BA%97%EF%BC%89/14307146","k":"百度系","r":""},{"t":"魔都面包界人气担当开到杭州,手撕前任套餐了解一下?","s":"xinchufang","u":"http://www.xinchufang.com/shipu/316638434731087","k":"其他网站","r":""},{"t":"可莎蜜兒(临平万宝城店)","s":"携程旅行","u":"https://you.ctrip.com/food/wuhan145/122727409-map.html","k":"携程","r":""},{"t":"面包节“顶流”竟在身边!运河边后横港路,飘起杭州最温柔的麦香","s":"拱宸","u":"http://mp.weixin.qq.com/s?src=11\u0026timestamp=1791466632\u0026ver=7014\u0026signature=ZMkboYvPQTN0f8EctTxeUashtkIn84KoDOEyBZaZCM77c-zDd-AGGE3DnNDqdWLx3OVweJt-PmKdvcZW1g7NqzjMAI44GIQhzxe5iSB1PW40U94zdlqP3jPbEPaqSkzx\u0026new=1","k":"微信公众号","r":""}]}],"q04_deepseek":[{"text":"可以买到碱水面包的店有这几家：\n\n**林先生的面包店**：有多家分店，庆春店位于上城区庆春路与燕子弄交叉口西60米，天荟未来之光城店位于余杭区。红豆碱水、全麦碱水、青酱碱水、抹茶碱水棒都有人推荐，口感有嚼劲。\n\n**慢熟bud bread**：有碱水酥，长条扭结造型，碱水味比较足，还有蒜香烟熏火腿碱水酥和芝士烟熏鸡胸碱水酥等料理款。\n\n**雀吉Meraki Bakery**：位于将军路52号，碱水比较出名，抹茶红豆碱水、红茶奶酥碱水是推荐较多的口味。\n\n**号麦面包**：位于西湖区西溪路418-7号庆丰公寓，地铁3号线古荡站附近。碱水味道很重，表皮韧、微咸，属于平价选择，晚上有买赠活动。\n\n**B\u0026C 黄油与面包**：有红豆黄油碱水、熔岩芝士碱水球，但这家店排队情况比较严重。\n\n**猫咪面团nekopan**：春晓路店和小河直街店都有碱水面包供应。","mentioned":false,"memory":false,"refs":[{"t":"烘焙地图 | 西湖边的面包店，和猫咪一样治愈~","s":"zhihu","u":"https://zhuanlan.zhihu.com/p/378787395#0","k":"知乎","r":""},{"t":"林先生的面包店LamsBakery(庆春店)","s":"Apple Maps: Directio","u":"https://maps.apple.com/place?auid=1118492926518577\u0026lsp=57879","k":"地图","r":""},{"t":"人均排队2小时的杭州网红面包店，到底值不值得？","s":"zhihu","u":"https://zhuanlan.zhihu.com/p/554815707#0","k":"知乎","r":""},{"t":"林先生的面包店(天荟未来之光城店)","s":"Apple Maps: Directio","u":"https://maps.apple.com/place?auid=1118636845099449\u0026lsp=57879","k":"地图","r":""},{"t":"杭州有什么好吃的面包店吗? - 杭州有什么好吃的面包店吗?","s":"知乎","u":"https://www.zhihu.com/question/31839418#1","k":"知乎","r":""},{"t":"均价个位数，杭州也有平价又好吃的面包店-今日生活-杭州网","s":"e69dade5b79ee7bd91","u":"https://jrsh.hangzhou.com.cn/content/2024-03/16/content_8702342.html","k":"其他网站","r":""},{"t":"闪现杭州！博主推荐12公里跑步路线串联的3家顶流面包店","s":"微博","u":"https://www.weibo.com/2/detail/5351738975980336","k":"微博","r":""},{"t":"漫步杭州 总有各式各样的惊喜 杭州网消费-消费维权-杭州网","s":"杭州网","u":"https://xiaofei.hangzhou.com.cn/xfzx/content/2024-01/11/content_9643842.htm","k":"其他网站","r":""},{"t":"司考、奶酪面包、墨西哥面包……杭州人记忆里的味道回归了 杭州网消费-消费维权-杭州网","s":"杭州网","u":"https://xiaofei.hangzhou.com.cn/xfzx/content/2024-01/02/content_9641029.htm","k":"其他网站","r":""},{"t":"好吃面包店合辑","s":"下厨房","u":"https://hanwuji.xiachufang.com/recipe/105871047/","k":"其他网站","r":""}]},{"text":"好吃的碱水面包主要集中在几家口碑不错的社区面包店，也有特色窑烤款可选：\n\n### 🥨 推荐店铺\n\n**慢熟 bud bread**\n碱水是招牌之一。除了经典款，特别推荐**碱水酥**，长条扭结造型让碱水味更足，还融合了黄油酥香和迷迭香。蒜香烟熏火腿碱水酥也很受欢迎。有多家分店，孩儿巷店在**孩儿巷70号**。\n\n**雀吉Meraki Bakery**\n碱水比较出名。推荐**抹茶红豆碱水**和**红茶奶酥碱水**，被不少人评价味道惊艳。原味碱水也很香。位置在**将军路52号**。\n\n**红跑车bakery**\n主打**芝麻坚果碱水面包**，口感偏硬、韧性好，带有黑芝麻香气，甜度适中。滨江天街店在**滨江区龙湖滨江天街负一楼**。\n\n**布咕面包**\n**红豆黄油碱水**是店里的热门款，外皮有嚼劲带咸香，里面甜而不腻。地址在**上城区顺福路345-2号**，景芳地铁站附近。\n\n**林先生的面包店**\n有多家分店，部分门店有**红豆碱水**和**全麦碱水**。庆春店在**上城区庆春路与燕子弄交叉口西60米**，天荟未来之光城店在**余杭区**（杜甫村地铁站附近）。\n\n**炙屿SPACE窑烤面包空间**\n比较特别的一家，用窑炉烤制。**脆肠碱水面包**外酥里嫩，肉粒咸香，还带有果木炭烤的烟熏风味。位置在**萧山区南阳街道**，距大会展中心地铁站约700米。\n\n如果你有大概想去的区域，可以告诉我，我帮你看看哪家更顺路。","mentioned":false,"memory":false,"refs":[{"t":"人均排队2小时的杭州网红面包店，到底值不值得？","s":"zhihu","u":"https://zhuanlan.zhihu.com/p/554815707#0","k":"知乎","r":""},{"t":"朗月流霜","s":"Weibo","u":"https://m.weibo.cn/status/5211946422901233","k":"微博","r":""},{"t":"烘焙地图 | 西湖边的面包店，和猫咪一样治愈~","s":"zhihu","u":"https://zhuanlan.zhihu.com/p/378787395#0","k":"知乎","r":""},{"t":"在杭州🍰终于吃上了爆火的红跑车-大众点评","s":"大众点评网","u":"https://m.dianping.com/ugcdetail/173924280?sceneType=0\u0026bizType=29\u0026msource=baiduappugc","k":"大众点评和美团","r":""},{"t":"杭州有什么好吃的面包店吗? - 杭州有什么好吃的面包店吗?","s":"知乎","u":"https://www.zhihu.com/question/31839418#1","k":"知乎","r":""},{"t":"恰巴塔和米面包，早餐新选择！健康又美味。","s":"Weibo","u":"https://m.weibo.cn/status/5291976891043650","k":"微博","r":""},{"t":"地铁直达！萧山这里又开出一家“宝藏小店”！是城里没有的味道~","s":"澎湃新闻","u":"https://m.thepaper.cn/newsDetail_forward_33190956","k":"其他网站","r":""},{"t":"两天一夜躺平攻略🍃住进山水里吃窑炉面包","s":"知乎专栏","u":"https://zhuanlan.zhihu.com/p/2060742053391234960?utm_medium=openapi_platform\u0026utm_source=e10c3ad29e50","k":"知乎","r":""},{"t":"林先生的面包店LamsBakery(庆春店)","s":"Apple Maps: Directio","u":"https://maps.apple.com/place?auid=1118492926518577\u0026lsp=57879","k":"地图","r":""},{"t":"林先生的面包店(天荟未来之光城店)","s":"Apple Maps: Directio","u":"https://maps.apple.com/place?auid=1118636845099449\u0026lsp=57879","k":"地图","r":""},{"t":"布咕面包, 中国浙江省杭州市","s":"Apple Maps: Directio","u":"https://maps.apple.com/place?place-id=H2710I3F9A16E47F545\u0026_provider=57879","k":"地图","r":""},{"t":"均价个位数，杭州也有平价又好吃的面包店-今日生活-杭州网","s":"e69dade5b79ee7bd91","u":"https://jrsh.hangzhou.com.cn/content/2024-03/16/content_8702342.html","k":"其他网站","r":""}]}],"q04_doubao":[{"text":"我挑了杭州3家碱水口碑靠谱的店，分不同风格，方便你按位置和口味选：\n \n1. 枣叔的店（来福士广场店）｜馅料扎实、性价比高\n \n📍上城区来福士广场4楼｜江锦路地铁站附近\n🔥碱水推荐：碱水南瓜吐司、碱水豆乳软欧。面包体紧实有韧性，碱水味适中，内馅给得足，甜度偏低，很适合做早餐；门店试吃大方，商场店交通方便。\n \n\n \n2. 多乐之日（高德置地广场店）｜钱江新城上班族友好\n \n📍上城区高德置地中心1楼｜市民中心地铁站附近\n🔥碱水推荐：碱水红豆黄油盐面包。属于软碱风格，面包体柔软带嚼劲，红豆+黄油咸甜平衡，早上开门早，适合顺路买早餐，店里还有座位可以歇脚。\n \n\n \n3. 黄油与面包（万象城店）｜碱水结、逛街随手买\n \n📍上城区万象城L1层｜江锦路地铁站附近\n🔥碱水推荐：芝麻碱水结、巧克力碱水结。外皮紧实有嚼劲，碱香明显，造型好看；同时泡芙、牛角包也很出彩，逛万象城的时候可以一并入手，包装颜值高。\n \n\n \n快速选店小建议\n \n想吃馅料足、性价比高 → 枣叔的店\n\n在钱江新城上班，想要软碱盐面包 → 多乐之日\n\n在万象城逛街，想吃碱水结 → 黄油与面包\n \n你大概在杭州哪个区域？我帮你筛离你更近的店。","mentioned":false,"memory":false,"refs":[{"t":"杭州下沙学生也太幸福了吧🙉13款面包全实测 13款面包全测评，比较推荐软欧和碱水～平价手作面包，下沙宝宝可直接冲！ #杭州下沙美食 #杭州大","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7678186646399180977","k":"抖音","r":""},{"t":"珍藏❗杭州堪称特产的12家面包店㊙。珍藏❗杭州堪称特产的12家面包店㊙ 把我珍藏的一些面包店分享给大家！㊙愿所有要去杭州旅游的姐妹都刷到这篇","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7296071836855487798","k":"抖音","r":""},{"t":"杭州89💰面包自助吃恰巴塔 米面包 冰面包 碱水 布丁 #杭州美食 #面包 #面包自助 #自助餐 #抹茶","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7680424244027985883","k":"抖音","r":""},{"t":"饭张力爆炸💥杭州外卖分享【土著权威版】 复工复产的进来！本人上班5天吃4天！真真正正的年度爱吃！外卖！吃的喝的夜宵甜品都有！有需要您来！#杭","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7611883297611188139","k":"抖音","r":""},{"t":"开年就吃到超满意的面包！真的是肥糯糯的胶质感！好吃到差点误机 #杭州甜品 #面包 #恰巴塔 #行行的面包 #碱水面包","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7592249548321875299","k":"抖音","r":""},{"t":"滨江面包脑袋看过来！这家新开的毛毛头bakery新店开业 只要个位数就能拿下#毛毛头bakery #毛毛头面包料理 #甜品治愈一切 #甜食控","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7511298520352738598","k":"抖音","r":""},{"t":"这里也发一遍我的白海豚杭州吃包日记 #杭州 #杭州面包 #减脂小汉堡 #小狗日记","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7676033870983032037","k":"抖音","r":""},{"t":"推荐两家无限回购的碱水面包！ #碱水 #无广测评 #青年创作者成长计划","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7631823526181227830","k":"抖音","r":""},{"t":"吃到了超级好吃的抹茶碱水面包！ 今天去参加了一个碳水节，买了好多小面包，但是没想到最好吃的是一家商场免门票的面包小铺的抹茶碱水包！是一个杭州","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7663891831994562742","k":"抖音","r":""},{"t":"杭州也不是美食荒漠吧～面包脑袋可以来杭州吃好多甜品！！#杭州美食 #夏日citywalk偶遇的美食 #抖音博主的夏日美食局#美食探店","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7393639799057321266","k":"抖音","r":""}]},{"text":"我挑了两家风格不一样的，一家主打馅料多、性价比高，一家是口感韧劲做得很到位，方便你按位置选。\n \n1. 麦时（下沙首选，奶酥碱水爱好者）\n \n✅亮点：碱水种类非常多，抹茶奶酥、咸蛋黄肉松、蓝莓乳酪碱水都是热门款，碱水皮韧劲足，馅料给得实在，价格亲民，适合当早餐囤货。\n📍钱塘区宝龙商业中心23幢103室；靠近文海南路地铁站。\n \n\n \n2. 照亮烘焙研究所Liang Bakery（黄龙附近，追求面包体口感）\n \n✅亮点：手作功底强，碱水的胶质感、嚼劲很到位；推荐苦咖啡黑巧燕麦棒碱水米堡，创意口味，不齁甜，适合喜欢扎实碱水体、不爱太甜馅料的人。\n📍西湖区西溪路395‑1‑2号；黄龙体育中心D口步行几十米，交通方便。\n \n\n \n简单帮你选\n \n爱吃奶酥、咸蛋黄这类丰富夹心，预算友好 → 优先麦时\n\n看重碱水面包本身的嚼劲、少甜馅料、创意款，在黄龙/城西一带 → 照亮烘焙\n \n你在杭州哪个区？我可以再给你筛附近1‑2家备选。","mentioned":false,"memory":false,"refs":[]}],"q04_hunyuan":[{"text":"杭州买碱水面包，按“想要哪种碱水”挑：\n\n**日式柔韧、低糖低油（最稳不踩雷）**\n- **Cycle \u0026 Cycle**（武林/湖滨一带）：海盐卷、芝士碱水球、圈圈碱水酥，面包体柔韧，碱水味不冲，新手友好。[3][8]\n- **猫咪面团 nekopan**（滨江春晓路）：宣威火腿碱水、黑松露盐面包，日系软包底子，咸口很能打。[2]\n\n**正统德式/硬核碱水（越嚼越香）**\n- **colorful 烤乐面包**（西湖区西溪路）：碱水味重、外壳红棕、低糖低油，价格便宜，学生党/老面包客喜欢。[4]\n- **mud\u0026field bakery**（黄龙片区，注意是否还在营）：碱水小馒头、普雷结，碱水味温和，入门款。\n- **红跑车**（滨江龙湖天街等）：红豆碱水个大、硬欧也行，性价比高。\n\n**咸口创新/本地口味**\n- **时屿·法式面包店**（彭埠附近）：青花椒竹笋芝士碱水、奶酪碱水，敢做辣口，有意思。\n- **巧克怪兽**：青花椒竹笋芝士碱水、德式香肠芝士贝果。\n- **Up Up Bakery**（拱墅/上城）：黑金薄荷巧克力碱水棒，夹心清爽，复烤也好吃。[5]\n\n**平价手作/日常回购**\n- **照亮烘焙研究所**（余杭禹航路）：碱水、贝果 7–9 元，现打现烤，口粮级。[4]\n- **[ ](@styleLink?key=0d54f438aece504f385452349df6be39\u0026style=iconLink\u0026display=miniProgram)[山姆](@styleLink?key=0d54f438aece504f385452349df6be39\u0026display=miniProgram)/山姆手作类门店**：大分量、价格低，但“手作”不一定比专门店惊艳。\n\n**小技巧**\n- 碱水最好**当天买当天吃**，回家用烤箱/空气炸锅 160℃ 复热 3 分钟，比微波炉强太多。\n- 真碱水：外表深棕、有小麦碱香、咸味收口、内里紧实有嚼劲；太软像吐司、甜到发腻的，是“碱水风味面包”不是正统款。\n- 想买硬核德式就去烤乐/mud\u0026field；想拍照带咖啡就去 Cycle \u0026 Cycle / 猫咪面团。\n\n要不要我按“西湖区/上城拱墅/滨江/余杭”把这几家排个就近采购路线？","mentioned":false,"memory":false,"refs":[{"t":"滨江日式面包房の治愈系碳水","s":"百度一下","u":"https://mbd.baidu.com/newspage/data/dtlandingsuper?nid=dt_4011850882249934467","k":"百度系","r":""},{"t":"面包脑袋私藏的杭州9 家面包店!","s":"寻味慢旅","u":"http://mp.weixin.qq.com/s?src=11\u0026timestamp=1791466648\u0026ver=7014\u0026signature=vODcMLIoOMwfrQj5uZqa*nEUwiEM-bsSk3j*k9E2FTuXlGe4CvmI-yd07vXSnRNJEWTqQlIlnrRqDx9HIPeqEUHv8HuVXVT8PezHbYP8dHgmgXVpmIiY876Poe1cCx2p\u0026new=1","k":"微信公众号","r":""},{"t":"均价个位数,杭州也有平价又好吃的面包店","s":"杭州网","u":"https://jrsh.hangzhou.com.cn/content/2024-03/16/content_8702342.html","k":"其他网站","r":""},{"t":"杭州的面包店是真卷啊!这里的小店,面包脑袋逛吃一整天不重样","s":"途野小记","u":"http://mp.weixin.qq.com/s?src=11\u0026timestamp=1791466648\u0026ver=7014\u0026signature=rSC92gfiRsTLO2cK*xkIQmLBjbi0BwP4bxEAMyIbxsdaLwdJ3wDpoXXI5E3hQSEiyriXjwMpEjX8IVIA1NvSn1ktUhened5p6bi*5eFzwy9zLZDWnIYSSgCdZcKyrQT8\u0026new=1","k":"微信公众号","r":""},{"t":"梧桐树下のCycle\u0026Cycle","s":"dianping","u":"https://s.dianping.com/topic/45011411?pageno=1","k":"大众点评和美团","r":""},{"t":"寻包记!面包星人的快乐源泉,杭城好吃的欧包在哪里?是时候吸一波欧气了!","s":"搜狐网","u":"https://www.sohu.com/a/258478141_349194","k":"搜狐","r":""},{"t":"Cycle\u0026Cycle(湖滨店)","s":"携程旅行","u":"https://you.ctrip.com/food/beijing1/15095947-map.html","k":"携程","r":""},{"t":"杭州黄龙饭店·D’BAKER德贝克","s":"携程旅行","u":"https://you.ctrip.com/food/guangzhou152/5546889-hotels.html","k":"携程","r":""},{"t":"【携程攻略】携程旅游攻略,自助游,自驾游,出游,自由行攻略指南","s":"携程旅行","u":"https://m.ctrip.com/webapp/you/community/detail?articleId=27313034\u0026isHideNavBar=YES\u0026seo=0\u0026sid=29927766","k":"携程","r":""},{"t":"半甜不甜(BAN SUCRÉ)","s":"chenmin123","u":"http://mp.weixin.qq.com/s?src=11\u0026timestamp=1791466648\u0026ver=7014\u0026signature=UMLNtJkqC2VuwkhQW43BKs1Ok3R8kM6PMJRuIOhd7HlhFJsAuApIUXZOtad7vpiy7nEcNs3g6grcXb7d45Dp*qYg-q5UCQdV*aov5vSDad4ZL*CTWdYuNmQNIMbNWsLx\u0026new=1","k":"微信公众号","r":""},{"t":"年终盘点vol1!2019杭州独立面包店地图来了!","s":"网易","u":"https://dy.163.com/v2/article/detail/F1NDID530525TST2.html","k":"网易","r":""}]},{"text":"杭州碱水面包好吃的，按“顺路好买”给你排：\n\n- **Cycle \u0026 Cycle**（中山北路377号、益乐路81号、天目里等）：日系柔韧挂，芝士碱水球、海盐卷、碱水结都稳，越嚼越香，游客最不容易踩雷。[5][11]\n- **慢熟面包 bud bread**（孩儿巷）：碱水结有嚼劲，日系小店氛围好，逛孩儿巷顺手买。\n- **时屿**（上城维萨新筑底商）：青花椒竹笋芝士碱水，中式咸口很特别，想尝新派碱水去这家。[2]\n- **micro / 米高烘焙**（华星路6-1-9号）：偏欧包恰巴塔，但也有花椒腰果恰巴塔等咸香款，硬核面包脑袋爱去。[2][5]\n- **猫咪面团**（小河直街1-10号、河坊街31号）：不是纯碱水店，但米面包/贝果出圈，逛景区顺路带。\n- **红跑车**（多家分店）：德式碱水香肠、芝士碱水、穗麦碱水，性价比高，不想排小店可逛商场店。\n- **枣叔的店**（下沙宝龙/萧山宝龙）：抹茶红豆碱水棍是老粉回购款，住下沙/萧山方便。[4]\n\n**游客最省事组合**：  \n武林/湖滨一带 → Cycle \u0026 Cycle（中山北路）或慢熟（孩儿巷）  \n小河直街/拱墅 → 猫咪面团  \n天目里/西溪 → Cycle \u0026 Cycle 天目里店  \n想拍“杭州限定” → 时屿青花椒竹笋芝士碱水\n\n小提醒：碱水早上刚出炉最香，**上午10—11点去**款式最全；买回去别放冰箱冷藏，吃前烤箱/空气炸锅160℃复烤3分钟，外脆内韧回来。\n\n要不要我按你住“西湖边 / 武林广场 / 滨江 / 未来科技城”再缩成步行可达的2家？","mentioned":false,"memory":false,"refs":[{"t":"赴旧港:刷到好多人推荐杭州这几家面包店,周末挑了几家去试｡Cycle\u0026Cycle在杭州有多家分店,龙井豆乳冰面包确实清爽,冰着吃很舒服｡上城","s":"今日头条","u":"https://www.toutiao.com/a1865751171603593","k":"今日头条","r":""},{"t":"呼叫仙贝 - vol.77 面包脑袋紧急集合!请带1tb的胃来杭州! - EarsOnMe - 精选播客,一听即合","s":"earsonme","u":"https://earsonme.com/episodes/fQNtbhgM5Giq","k":"其他网站","r":""},{"t":"一篇推送写不完的下沙美食,这里是绝对不能错过的“TA”!","s":"搜狐网","u":"https://www.sohu.com/a/444098622_349236","k":"搜狐","r":""},{"t":"面包脑袋私藏的杭州9 家面包店!","s":"寻味慢旅","u":"http://mp.weixin.qq.com/s?src=11\u0026timestamp=1791466730\u0026ver=7014\u0026signature=vODcMLIoOMwfrQj5uZqa*nEUwiEM-bsSk3j*k9E2FTuXlGe4CvmI-yd07vXSnRNJaGo5tPi8xukmyNwSwoGZoQtpWemOPZb*lT2yD9g7VbwGWIdT5Uo5PwMabeVCQl0Y\u0026new=1","k":"微信公众号","r":""},{"t":"杭州面包最全2.0攻略 没吃过都不意思说自己到过杭州","s":"今日头条","u":"https://www.toutiao.com/article/7044519732556415496/","k":"今日头条","r":""},{"t":"杭州的面包店是真卷啊!这里的小店,面包脑袋逛吃一整天不重样","s":"途野小记","u":"http://mp.weixin.qq.com/s?src=11\u0026timestamp=1791466730\u0026ver=7014\u0026signature=rSC92gfiRsTLO2cK*xkIQmLBjbi0BwP4bxEAMyIbxsdaLwdJ3wDpoXXI5E3hQSEifhOmjMPeaqLcSp-pPI4psQ1YiAnFbiJO5A8MFNIC2ieW9rebJGNdwz7XbVxzWwcc\u0026new=1","k":"微信公众号","r":""},{"t":"杭州黄龙饭店·D’BAKER德贝克","s":"携程旅行","u":"https://you.ctrip.com/food/guangzhou152/5546889-hotels.html","k":"携程","r":""},{"t":"不求甚解","s":"fakeye","u":"https://channel.fakeye.xyz?before=818/","k":"其他网站","r":""},{"t":"人均二三十,老转塘这些便宜又好吃的店,你都吃过哪些?","s":"网易","u":"https://www.163.com/dy/article/JB61JV9K05456Z18.html","k":"网易","r":""},{"t":"杭州这条“宝藏Citywalk路线”藏不住了,周末去刚刚好打卡避暑两不误","s":"杭州-WOW","u":"http://mp.weixin.qq.com/s?src=11\u0026timestamp=1791466730\u0026ver=7014\u0026signature=bFw91jG2WXAWuMRvjSVi1aem5HMHC4Ya3TkM0AYwSzVnKu3dGfW8pd98GngiYwKHF4Wk4iTRn3ZH8OJ*qrw3hw4Z-lRFTKcZVX6JxUXpyWuqjhRtVlrZEcKWFaKqkPga\u0026new=1","k":"微信公众号","r":""},{"t":"不求甚解","s":"fakeye","u":"https://channel.fakeye.xyz/?before=399","k":"其他网站","r":""}]}],"q05_deepseek":[{"text":"杭州旅游想带点烘焙类伴手礼，可以重点考虑这几样：\n\n### 🍵 龙井茶酥 / 龙井茶饼\n这是最有杭州辨识度的茶点，把西湖龙井的清香融进了酥皮里，甜度通常不高，带着淡淡的茶味回甘。知味观、老杭邦、南宋胡记都有出品，其中知味观的龙井酥还入选过“十大杭式茶点”，外皮酥松，内馅有绿豆、金沙奶黄等口味可选。\n\n### 🍰 南宋胡记的“西湖故事”系列\n如果追求有文化趣味和精致包装的，南宋胡记的许仙饼、白娘子饼是不错的选择。许仙饼内馅是咸蛋黄配绿豆沙，口感松软细腻；白娘子饼口味选择更多，加上荷花酥、蛋黄酥等，礼盒颜值很高，很适合送人。\n\n### 🥜 杨先生糕点\n它是杭州亚运会官方指定糕点品牌，主打非遗手工技艺。招牌芡实糕软糯有嚼劲，甜度低，蒸一下会更软糯，还有红糖麻花、糯米小麻花等选择，线下可以在西溪湿地的体验馆买到。\n\n### 🏮 塘栖古镇的老字号糕点\n如果你会去临平或塘栖古镇，法根糕点、朱一堂这些老字号很值得一逛。它们保留了很多传统手工糕点，比如椒桃片、绿豆糕、枇杷梗，价格实惠，是很有烟火气的伴手礼。\n\n如果你有偏好的口味（比如爱喝茶香、爱糯叽叽，或者想送长辈），可以再告诉我，我帮你具体推荐～","mentioned":false,"memory":false,"refs":[{"t":"杭城小店｜奥运冠军和明星都钟爱的杭州糕点是啥？尝一口，就“糕”定你！","s":"知乎专栏","u":"https://zhuanlan.zhihu.com/p/1963002586027233929?utm_medium=openapi_platform\u0026utm_source=e10c3ad29e50","k":"知乎","r":""},{"t":"老杭邦","s":"百度百科","u":"https://baike.baidu.com/item/%E8%80%81%E6%9D%AD%E9%82%A6/13804109?svcp_stk=1_4tG1bpkoXfN8Xv99UrLkcEi9Dh2ESHthOEXQ_jRXUxHL72n7Cx1ndqAMaTqo5JSPAtucH4C5FfOkirf4_OsMATGfXDrAUC8J71WO6KQhNMp5l_eIxFcfr-QcV8elNyBwAT7sQ6rZiJale8_BAbR5XwdEWFCBbhq_wshdtkj1-eLw51KujormW9tTERHcwb_i\u0026bst=1790977042.40e2714cb6e6118","k":"百度系","r":""},{"t":"有哪些好吃又便宜的的零食？ - 臭宝子 的回答","s":"知乎","u":"https://www.zhihu.com/question/1909035907421538248/answer/2056868069683770743?utm_medium=openapi_platform\u0026utm_source=e10c3ad29e50","k":"知乎","r":""},{"t":"知味观龙井酥","s":"百度百科","u":"https://baike.baidu.com/item/%E7%9F%A5%E5%91%B3%E8%A7%82%E9%BE%99%E4%BA%95%E9%85%A5/68384592?bst=1791062669.4d9225f07b4ba896","k":"百度系","r":""},{"t":"2026年最新TOP浙江/杭州特产推荐:杭州特产送人伴手礼哪里买? - 知乎","s":"知乎","u":"https://zhuanlan.zhihu.com/p/413265186?utm_medium=openapi_platform\u0026utm_source=e10c3ad29e50","k":"知乎","r":""},{"t":"杨先生非遗手工麻花","s":"百度百科","u":"https://baike.baidu.com/item/%E6%9D%A8%E5%85%88%E7%94%9F%E9%9D%9E%E9%81%97%E6%89%8B%E5%B7%A5%E9%BA%BB%E8%8A%B1/64069830?bst=1790217865.896d2623e2a37c0f#1","k":"百度系","r":""},{"t":"杭州特产推荐 | 本地人推荐这10 种,物美价廉,送礼有面 - 知乎","s":"知乎","u":"https://zhuanlan.zhihu.com/p/2024513009419076936?utm_medium=openapi_platform\u0026utm_source=e10c3ad29e50","k":"知乎","r":""},{"t":"杭州法根加料椒桃片礼盒 浙江老字号中式糕点 特产果仁点心250克-Taobao-Tmall","s":"Taobao.com","u":"https://www.taobao.com/list/item/Sjg3MjZqNUhYNnJmZU1EUHlOYXFwUT09.htm?spm=a21wu.10013406.taglist-content.1","k":"电商平台","r":""},{"t":"径山·珍酱酥:径山书院出品的双非遗宋韵茶点礼盒 - 知乎","s":"知乎","u":"https://zhuanlan.zhihu.com/p/2081792280650856400?utm_medium=openapi_platform\u0026utm_source=e10c3ad29e50","k":"知乎","r":""},{"t":"老杭州爱的糯叽叽 杨先生糕点 传承百年非遗技艺","s":"杭州日报","u":"https://mdaily.hangzhou.com.cn/dskb/2025/05/06/article_detail_2_20250506A158.html","k":"其他网站","r":""},{"t":"不愧是面包大市，卷得生生不息，面包脑袋都跑来这里取经 - 不愧是面包大市，卷得生生不息，面包脑袋都跑来这里取经","s":"知乎专栏","u":"https://zhuanlan.zhihu.com/p/2025253494664307972#1","k":"知乎","r":""},{"t":"让“非遗茶食”焕新出圈","s":"lybs.com.cn","u":"http://www.lybs.com.cn/html/2025-09/13/content_118660_18885075.htm","k":"其他网站","r":""}]},{"text":"杭州旅游想带烘焙类伴手礼，首选**龙井茶酥**和**定胜糕**，前者是杭州独有的茶香风味，后者有“一定胜利”的好彩头。如果追求精致送礼，**南宋胡记**的荷花酥和许仙饼礼盒很合适；想买老底子味道，去**江南春**或**知味观**准没错。\n\n### 🍵 最具杭州风味的茶点\n*   **龙井茶酥**：知味观和杨先生糕点都有，酥皮带着龙井茶的清香，内馅通常是细腻的奶酪或豆沙，微甜不腻，是杭州独有的味道。\n*   **径山珍酱酥**：如果对茶点礼盒感兴趣，这款融合了非遗酱艺与酥饼工艺的礼盒很有特色，内含松茸、云腿等咸口酥饼，适合不爱吃甜的人。\n\n### 🎁 寓意好且颜值高的选择\n*   **定胜糕**：源于南宋的传统糕点，粉红色，寓意“定胜吉祥”。**江南春**的定胜糕是很多老杭州的念想，**知味观**也有售。\n*   **南宋胡记（许仙饼/白娘子饼/荷花酥）**：把西湖爱情故事做成了点心，包装精美适合送人。许仙饼是咸蛋黄绿豆沙馅，白娘子饼口味选择多，荷花酥造型精致。\n\n### 🥮 其他本地人常买的老味道\n*   **条头糕**：软糯的糯米皮裹着细腻红豆沙，知味观和江南春的都很经典，本地人日常也爱吃。\n*   **芡实糕**：杨先生糕点的招牌之一，有淡淡的谷物米香，口感扎实，是杭州亚运会的指定糕点品牌。\n\n**选购建议**：如果图方便、一站式买齐，直接去**知味观**的湖滨店或延安路店；如果想感受老底子的市井气，可以去**江南春**解放路店或十五奎巷社区店。","mentioned":false,"memory":false,"refs":[{"t":"杭城小店｜奥运冠军和明星都钟爱的杭州糕点是啥？尝一口，就“糕”定你！","s":"知乎专栏","u":"https://zhuanlan.zhihu.com/p/1963002586027233929?utm_medium=openapi_platform\u0026utm_source=e10c3ad29e50","k":"知乎","r":""},{"t":"知味观（庆春店）","s":"百度百科","u":"https://baike.baidu.com/item/%E7%9F%A5%E5%91%B3%E8%A7%82%EF%BC%88%E5%BA%86%E6%98%A5%E5%BA%97%EF%BC%89/14253580?bst=1791038493.b2a2f646d1210009","k":"百度系","r":""},{"t":"八宝饭、大福糕、条头糕……杭州老底子点心让年过得甜甜蜜蜜","s":"浙江新闻","u":"https://zjnews.zjol.com.cn/zjnews/202602/t20260220_31515482.shtml","k":"其他网站","r":""},{"t":"【独家专访】芋泥蛋糕“鼻祖”，杭州甜品的“定海神针”！「Foamy Foamy」主理人：热爱比流量更重要","s":"知乎专栏","u":"https://zhuanlan.zhihu.com/p/1996621534282945486?utm_medium=openapi_platform\u0026utm_source=e10c3ad29e50#1","k":"知乎","r":""},{"t":"中山中路走九遍，搜寻到一大波宝藏老店！-上城新闻网","s":"Hzsc","u":"https://www.hzsc.com.cn/content/content_9916387_3.html","k":"其他网站","r":""},{"t":"《太平年》里的定胜糕火出圈，八宝饭、大福糕、条头糕……杭州老底子点心让年过得甜甜蜜蜜","s":"杭州日报报业集团","u":"https://web-cshd.hbjt.com.cn/article/draft/share/480272?scene=1\u0026id=480272\u0026hbId=843qJM3d0YXb#1","k":"其他网站","r":""},{"t":"径山·珍酱酥:径山书院出品的双非遗宋韵茶点礼盒 - 知乎","s":"知乎","u":"https://zhuanlan.zhihu.com/p/2081792280650856400?utm_medium=openapi_platform\u0026utm_source=e10c3ad29e50","k":"知乎 「杭州特色」和「本地网红面包」两条线：\n\n### 一、有杭州味、送人稳（新中式糕点/茶点）\n- **知味观**：龙井茶酥、条头糕、定胜糕、桂花糕——百年老号，景区/火车站都有，送长辈不翻车 [7][13]\n- **南宋胡记**：荷花酥、龙井茶酥、白娘子酥、许仙饼——宋韵包装好看，正式送人最有面子 [4][12]\n- **杨先生糕点**：芡实糕（龙井/桂花/杨梅味）、龙井茶酥、红糖肉松麻花——低糖、配料干净，老人小孩都好接受 [13]\n- **江南春**：松花蛋糕、乌饭团、玫瑰蜜糕——糯叽叽、甜度低，但保质期短（约3天），适合同城带 [7]\n- **法根糕点（塘栖古镇）**：椒盐桃片、枇杷糕、芝麻核桃——老底子江南味，去塘栖顺手买\n\n### 二、本地面包店「可带但不耐放」\n- **富贵面包公司**：猪肉脯吐司、南瓜吐司、斑斓米面包——杭州面包圈名片，但吐司最好当天/次日吃，外地带回去要冷冻\n- **Cycle \u0026 Cycle**：龙井豆乳冰面包（夏天神）、生吐司、海盐卷、日式红豆包——冰面包别长途带，生吐司/碱水可带\n- **猫咪面团 NEKOPAN**：斑斓神户吐司、斑斓米面包、乌米饭酵液吐司——日系软包，适合年轻人朋友\n- **micro 米高 / 慢熟 / 安莎 / 时峪**：欧包、恰巴塔、碱水、米面包——懂面包的朋友会喜欢，普通长辈未必吃惯\n\n### 三、游客闭眼买方案\n- 送领导/老丈人/长辈 → **知味观龙井茶酥礼盒** 或 **南宋胡记荷花酥礼盒**\n- 送同事/朋友（年轻群体） → **富贵猪肉脯吐司（冻着带回）** + **杨先生龙井芡实糕**\n- 自己路上吃 → Cycle 龙井豆乳冰面包、猫咪面团斑斓吐司\n- 赶火车没时间 → 湖滨/东站/萧山机场买**知味观/南宋胡记/杨先生**礼盒，别在河坊街摊贩买“三无龙井饼”\n\n### 四、避坑\n- “龙井饼干/龙井酥”景区摊很多，选**老字号门店+看生产日期+配料表有龙井粉/龙井茶**的\n- 冰面包、生吐司、可颂：**飞机/高铁超 4 小时别带常温**，要买就冻藏+保温袋+冰袋，或回程前再买\n- 伴手礼别买“现烤榨菜鲜肉月饼”长途带（九月生活/九芝斋的可以，但当天吃最香）\n\n要不要我按「湖滨/小河直街/龙坞/塘栖/东站」动线，直接排一份“边逛边买、回程不坏”的烘焙伴手礼清单？","mentioned":false,"memory":false,"refs":[{"t":"不愧是面包大市,卷得生生不息,面包脑袋都跑来这里取经","s":"什么值得买","u":"https://post.smzdm.com/p/a26wlgx7","k":"什么值得买","r":""},{"t":"探店推荐 米高micro,这是我们最想推荐的职人面包店!","s":"网易新闻客户端","u":"https://c.m.163.com/news/a/K7E745GV0522DD07.html","k":"网易","r":""},{"t":"喜欢在杭州吃吃吃,还不是因为有这些神仙面包店","s":"什么值得买","u":"https://post.m.smzdm.com/p/ao9rkp79/","k":"什么值得买","r":""},{"t":"雷峰塔印章爆火,谁曾想杭州伴手礼都进化成这样了……","s":"搜狐网","u":"https://www.sohu.com/a/716918185_121117478","k":"搜狐","r":""},{"t":"杭州遍地治愈碳水!猫咪面团NEKOPAN全门店合集","s":"七克拉的巧克力","u":"http://mp.weixin.qq.com/s?src=11\u0026timestamp=1791466785\u0026ver=7014\u0026signature=sQWnRaAXvND8UcMK19k*nfay4uDYk9zwRNDy7j813imx8Qrm1ftH5SkfiHE4BY6DP3u*AowpvAfLtSMUIaytkD3OrcRqIOq-2jW3*jHvhKw*opzym6X*SFgaeQdlADVj\u0026new=1","k":"微信公众号","r":""},{"t":"面包脑袋私藏的杭州9 家面包店!","s":"寻味慢旅","u":"http://mp.weixin.qq.com/s?src=11\u0026timestamp=1791466786\u0026ver=7014\u0026signature=vODcMLIoOMwfrQj5uZqa*nEUwiEM-bsSk3j*k9E2FTuXlGe4CvmI-yd07vXSnRNJqRSe 荐单品：** 松花晶团、条头糕、三色糕、双酿团。\n- **特色：** 整体甜度相对克制，糯米糕团更有老杭州日常点心的感觉。\n- **适合：** 送给长辈或偏爱传统软糯口感的人。[1][6]\n\n\n\n### 四、法根糕点：去塘栖顺路买更合适\n\n- **推荐单品：** 椒桃片、小桃酥、云片糕、桂花年糕。\n- **特色：** 更偏传统茶食和老式酥点，适合不爱奶油蛋糕、喜欢酥脆干香的人。\n- **购买：** 塘栖古镇水北街门店较方便，其他城区可先查就近门店。[1]\n\n\n\n### 五、琦本的店：短保面包更偏现代烘焙\n\n- **推荐单品：** 原味生吐司、抹茶吐司、水果挞。\n- **特色：** 口感柔软、麦香明显，适合自己吃或送年轻朋友。\n- **取舍：** 缺少杭州传统符号，但比酥点耐吃，适合返程时间短、能尽快食用的行程。\n\n\n\n### 六、按需求直接选\n\n- **第一次来、想买杭州特色：** 知味观。\n- **正式送礼、看重包装：** 南宋胡记。\n- **送长辈、口味偏传统：** 江南春。\n- **去塘栖游玩顺路采购：** 法根糕点。\n- **自己吃或送年轻人：** 琦本的店。\n\n传统糕团和酥点通常保质期较短，临上飞机或高铁再买，并确认收礼人能否尽快食用。\n\n你准备送长辈、同事还是朋友？我可以按人数帮你配一套伴手礼组合。","mentioned":false,"memory":false,"refs":[{"t":"杭州有哪些好吃的老字号糕点?","s":"杭州本地宝","u":"https://m.hz.bendibao.com/weixin/csfw?action=banshi\u0026bid=143163\u0026controller=home.Index","k":"其他网站","r":""},{"t":"杭州伴手礼选购指南,送人不踩雷","s":"iHangzhou","u":"http://mp.weixin.qq.com/s?__biz=MzA3NTY3NDAwMg==\u0026mid=2447808009\u0026idx=1\u0026sn=0a6df3648261a275ef337129904f56c2\u0026chksm=8a5c4eac26e3787985672256b0c398162777ea36c45023cd693edba2211371f3b77f952bba0e#rd","k":"微信公众号","r":""},{"t":"杭州哪里买特产比较好:分品类精准选购","s":"有味呀","u":"https://www.youweiya.com/html/meiweishipu/wuydunthj0.html","k":"其他网站","r":""},{"t":"超全“杀糕”指南!甜品之神眷顾的“糕都”,名不虚传!","s":"今日头条","u":"https://www.toutiao.com/article/7611441728122143247","k":"今日头条","r":""},{"t":"文末送月饼!余杭中秋“饼”王争霸,月亮都馋了","s":"余杭文旅","u":"http://mp.weixin.qq.com/s?src=11\u0026timestamp=1791466627\u0026ver=7014\u0026signature=a2CrAVaWrLmPRi6BqXgfXClc1jppYlVkIxL3*ZSeOkRtNCBsBjA1hUcmt7VI8TGZPrmyn0kZOUYoeMs2T8At*gvgFEG23IaptfJ0bDYmbhOm6Kh2LVpDWN9jaO5TlbUY\u0026new=1","k":"微信公众号","r":""},{"t":"火爆街头几十年!杭州人对这些“古早”点心的爱,外地人不会懂","s":"网易","u":"https://www.163.com/dy/article/G4VJGRH30514PQMG.html","k":"网易","r":""},{"t":"杭州伴手礼不踩雷本地人私藏非遗糕点杨先生,把江南风味打包带回家","s":"腾讯新闻","u":"https://new.qq.com/rain/a/20260710A06ZRA00","k":"腾讯新闻","r":""},{"t":"爆单!一年一度重要日子,很多人记挂杭州这口酥香!老板:早6点忙到晚12点…","s":"杭州发布","u":"http://mp.weixin.qq.com/s?src=11\u0026timestamp=1791466627\u0026ver=7014\u0026signature=NyTGw 层次丰富。\n*   **Luobo‘s Mom**：主打南瓜巴斯克和南瓜吐司，面包体蓬松湿润，内馅清甜。店里面包香浓郁，环境温馨，很适合坐下来慢慢吃。\n\n**塘萍路 / 丰登街**\n*   **澄沙ann**：一家少见的日式喫茶店，氛围安静注重“慢”体验，主打茶饮和咖啡，甜品有焦糖布丁，还可以自选喜欢的杯具。\n*   **marufuwa**：主打日式餐包，红豆泥餐包是热门款。店里可爱元素随处可见，适合闲逛时坐下来吃个面包。\n\n**其他区域**\n*   **炙屿SPACE窑烤面包空间**：位于萧山南阳街道，离大会展中心地铁站不远。有院子、露营桌椅和窑炉，面包带着果木炭烤的烟熏风味，环境偏田园治愈风。\n\n如果你有偏好的区域（比如西湖区或滨江），我可以再帮你看看附近的选择。","mentioned":false,"memory":false,"refs":[{"t":"面包新语（华商店）","s":"百度百科","u":"https://baike.baidu.com/item/%E9%9D%A2%E5%8C%85%E6%96%B0%E8%AF%AD%EF%BC%88%E5%8D%8E%E5%95%86%E5%BA%97%EF%BC%89/14262749?bst=1789897581.0535f7bd78e3719a","k":"百度系","r":""},{"t":"桐庐最近新开了一家非常值得去的店——Bread Boom 面包热潮，就在未来湖水街。","s":"知乎专栏","u":"https://zhuanlan.zhihu.com/p/2053776046533636343?utm_medium=openapi_platform\u0026utm_source=e10c3ad29e50","k":"知乎","r":""},{"t":"甜之盐法式西点","s":"百度百科","u":"https://baike.baidu.com/item/%E7%94%9C%E4%B9%8B%E7%9B%90%E6%B3%95%E5%BC%8F%E8%A5%BF%E7%82%B9?bst=1790681160.5abd590b3e5dfb94","k":"百度系","r":""},{"t":"这条好吃的快乐小街，是我冬天出门的动力！","s":"zhihu","u":"https://zhuanlan.zhihu.com/p/593809346#0","k":"知乎","r":""},{"t":"Mlamlai美拉美来（高沙店）","s":"百度百科","u":"https://baike.baidu.com/item/Mlamlai%E7%BE%8E%E6%8B%89%E7%BE%8E%E6%9D%A5%EF%BC%88%E9%AB%98%E6%B2%99%E5%BA%97%EF%BC%89/14289733?bst=1789793265.91012fc68157c2ce","k":"百度系","r":""},{"t":"这条小马路，是无数躺平青年的快乐老家","s":"zhihu","u":"https://zhuanlan.zhihu.com/p/564567726#0","k":"知乎","r":""},{"t":"地铁直达！萧山这里又开出一家“宝藏小店”！是城里没有的味道~","s":"澎湃新闻","u":"https://m.thepaper.cn/newsDetail_forward_33190956","k":"其他网站","r":""},{"t":"朗月流霜","s":"Weibo","u":"https://m.weibo.cn/status/5211946422901233","k":"微博","r":""},{"t":"📍杭州で話題！まるで美術館のようなベーカリー🥐✨ | Trip.com 杭州","s":"Trip.com","u":"https://jp.trip.com/moments/detail/hangzhou-14-149236978/","k":"其他网站","r":""},{"t":"海丰西餐社 - 电话邦","s":"Dianhua","u":"https://www.dianhua.cn/dt/3411d3fa9bd142dfac5a0c6601d90246/a94fc641561654a5164c1770e0a2d6ab","k":"其他网站","r":""},{"t":"莫卡乡村(星桥店) - 电话邦","s":"Dianhua","u":"https://www.dianhua.cn/dt/f613b2bfe36f4d2ebd4758bdbe072b66/5af75928c5a56272134c177abfa2d6da","k":"其他网站","r":""},{"t":"达克布蕾(定安店) - 电话邦","s":"Dianhua","u":"https://www.dianhua.cn/dt/471aec34c84e4905ad1185e1d559d021/d3779fa1e3919ba115d1177ddaa2d67f","k":"其他网站","r":""}]},{"text":"适合坐下来喝下午茶的面包店，目前有明确堂食信息的不多，以下是根据现有信息整理出的几家：\n\n### 🍞 有明确堂食区域的店\n\n**可莎蜜儿（体育场路店）**\n位于下城区体育场路。这家店在2013年翻新后扩大了堂食区，座位增至 **24个**，是少数明确能坐下来慢慢吃的连锁面包店。\n\n**拾㧚耍·SCHWASU（西湖银泰店）**\n海底捞旗下的烘焙品牌，开在西湖银泰1楼。店门口设有 **室外桌椅**，可供顾客休息，面包价位多在20元以下。\n\n### 🪑 环境氛围适合的店\n\n**micro boulangerie（西湖区）**\n被描述为“静谧天地”，装修有原木调桌椅、木质书架，整体氛围安宁，适合坐着慢慢感受面包与时光。\n\n**PALMPARK BREAD\u0026COFFEE（滨江区）**\n这家店 **室内外都有座位**，工业风混搭木质调，面积挺大，环境有质感，适合休闲久坐。\n\n**松菓songuo（城西）**\n主理人有意打造“沉浸其中”的空间，装修是暖色调做旧风格，定位是让人能待得住的面包店。\n\n**BakingPower（湖滨银泰店）**\n位于湖滨银泰B1层，百科标签中明确写着 **“适宜休闲小憩”**，提供下午茶服务，配有WiFi。\n\n### ⚠️ 需要注意\n\n**甜蜜工坊（德胜店等）** 虽然主营面包甜点，但百科信息明确标注 **“不设餐位”**，无法堂食。桐庐的 Bread Boom 不在杭州市区范围内。\n\n如果你有具体想去的区域（比如西湖区、滨江），我可以帮你进一步筛选附近的选择。","mentioned":false,"memory":false,"refs":[{"t":"桐庐最近新开了一家非常值得去的店——Bread Boom 面包热潮，就在未来湖水街。","s":"知乎专栏","u":"https://zhuanlan.zhihu.com/p/2053776046533636343?utm_medium=openapi_platform\u0026utm_source=e10c3ad29e50","k":"知乎","r":""},{"t":"可莎蜜儿（体育场路店） - 浙江省杭州市下城区餐厅","s":"百度百科","u":"https://baike.baidu.com/item/%E5%8F%AF%E8%8E%8E%E8%9C%9C%E5%84%BF%EF%BC%88%E4%BD%93%E8%82%B2%E5%9C%BA%E8%B7%AF%E5%BA%97%EF%BC%89#1","k":"百度系","r":""},{"t":"不愧是面包大市，卷得生生不息，面包脑袋都跑来这里取经 - 不愧是面包大市，卷得生生不息，面包脑袋都跑来这里取经","s":"知乎专栏","u":"https://zhuanlan.zhihu.com/p/2025253494664307972#1","k":"知乎","r":""},{"t":"朗月流霜","s":"Weibo","u":"https://m.weibo.cn/status/5211946422901233","k":"微博","r":""},{"t":"在这里，面包与生活正发生，坚持自己的面包理念！","s":"zhihu","u":"https://zhuanlan.zhihu.com/p/644789607#0","k":"知乎","r":""},{"t":"甜蜜工坊德胜店、滨江店、回龙路店","s":"百度百科","u":"https://baike.baidu.com/item/%E7%94%9C%E8%9C%9C%E5%B7%A5%E5%9D%8A%E5%BE%B7%E8%83%9C%E5%BA%97%E3%80%81%E6%BB%A8%E6%B1%9F%E5%BA%97%E3%80%81%E5%9B%9E%E9%BE%99%E8%B7%AF%E5%BA%97/14299356","k":"百度系","r":""},{"t":"多多邦手作工坊｜让时光慢下来/过有滋味的生活","s":"zhihu","u":"https://zhuanlan.zhihu.com/p/539640773#0","k":"知乎","r":""},{"t":"BakingPower","s":"百度百科","u":"https://baike.baidu.com/item/BakingPower","k":"百度系","r":""},{"t":"这条小马路，是无数躺平青年的快乐老家","s":"zhihu","u":"https://zhuanlan.zhihu.com/p/564567726#0","k":"知乎","r":""},{"t":"PALMPARK BREAD\u0026COFFEE","s":"Apple Maps: Directio","u":"https://maps.apple.com/place?place-id=H2710I3F9845C8B4F78\u0026address=%E4%B8%AD%E5%9B%BD%E6%B5%99%E6%B1%9F%E7%9C%81%E6%9D%AD%E5%B7%9E%E5%B8%82%E6%BB%A8%E6%B1%9F%E5%8C%BA%E6%9C%88%E6%98%8E%E8%B7%AF199%E5%8F%B7%E8%B6%A3%E9%93%BE%E7%A7%91%E6%8A%80%E4%BA%A7%E4%B8%9A%E5%9B%AD104%E5%AE%A4\u0026coordinate=30.205575","k":"地图","r":""},{"t":"有赞蛋糕行业解决方案——这家面包店不停做「减法」，终于开出了「最好」的状态……","s":"zhihu","u":"https://zhuanlan.zhihu.com/p/635075160#0","k":"知乎","r":""},{"t":"跨界烘焙首店落地杭州 海底捞的野心","s":"杭州日报","u":"https://mdaily.hangzhou.com.cn/mrsb/2025/05/08/article_detail_3_20250508A096.html","k":"其他网站","r":""}]}],"q06_doubao":[{"text":"我挑了两家风格不一样的，一家商场里稳妥好约，一家社区小店、面包口味更突出，都可以坐下来喝咖啡吃面包下午茶。\n \n1. 红跑车(来福士店)｜商场稳妥首选，适合朋友小聚\n \n✅亮点：来福士B1，座位充足，环境干净简约，不用怕没位置；面包品类多，欧包、碱水、巴斯克都有，店员可以帮忙把面包切小块，配咖啡很适合下午茶；地铁直达，雨天也友好。\n📍上城区新业路228号来福士B1层37A号（江锦路地铁站）\n \n\n \n2. 點點烘焙｜社区小店，碱水爱好者优先选\n \n✅亮点：宝善桥附近，有座位可以小坐；主打碱水球、贝果，开心果碱水球是招牌；有现成的面包+咖啡下午茶套餐，性价比不错；小店氛围松弛，适合安静地坐一会儿。\n📍拱墅区环城北路115号一层（宝善桥地铁站A口附近）\n \n\n \n快速帮你选\n \n追求位置方便、座位充足、不怕天气、朋友闲聊 → 红跑车来福士店\n\n偏爱碱水面包、想要松弛小店氛围、性价比套餐 → 點點烘焙\n \n你在哪个区？我可以再给你筛附近备选。","mentioned":false,"memory":false,"refs":[]},{"text":"给你挑了两家湖滨附近、能坐下来歇脚的面包店，风格不一样，一家安静日式，一家热闹商场款：\n \n五谷七福｜安静日式，适合慢慢聊天\n \n📍上城区平海路30‑2,30‑3（龙翔桥步行几分钟）\n✅亮点：日式面包店，店内有十来个座位，环境安静不嘈杂，很适合下午茶小坐。面包整体甜度克制，推荐奶油开心果子、生奶油红豆包、炼乳盐面包，可以点面包+咖啡套餐，逛西湖累了来这里歇脚很舒服。\n✅适合：想要安静、避开商场喧闹，偏爱清淡日式面包。\n \n\n \nHOT CRUSH趁热集合｜商场人气款，选择多\n \n📍上城区湖滨银泰in77 C1区负一楼\n✅亮点：in77热门烘焙，座位明亮干净，面包、蛋挞、马卡龙品类很丰富，试吃大方；开心果榛巧马卡龙、趁热心动蛋挞、坚果棒是招牌，逛街顺路吃很方便，缺点是周末人会比较多。\n✅适合：逛in77，想吃花样多的面包甜品，不介意热闹环境。\n \n\n \n简单帮你快速选：\n \n追求安静、日式清淡面包、坐下来聊天 → 五谷七福\n\n逛湖滨in77，品类多、热闹便捷 → 趁热集合\n \n如果你告诉我偏好咸口还是甜口，或者想要抹茶/可颂这类，我可以再给你补备选。","mentioned":false,"memory":false,"refs":[]}],"q06_hunyuan":[{"text":"杭州想“买完能坐下来、配咖啡喝茶待一下午”的，别去纯外带档口（富贵面包部分店、可莎蜜儿大多偏走量）。按场景给你排：\n\n### 🍃 运河 / 老街慢坐\n- **猫咪面团 NEKOPAN（小河直街店）**：独栋两层，落地大窗，二楼完整休息区，直面运河。斑斓神户吐司、米面包、国王饼都行，最适合闺蜜聊天+拍照。[6]\n- **Cycle \u0026 Cycle（天目里店）**：天目里红枫/水泥风，店外一圈座椅、店内小座区，盐面包+冰面包+龙井豆乳冰面包是杭州特色款，逛天目里顺带坐。[4]\n\n### 🌳 森系 / 度假感下午茶\n- **丽高莉（西溪湿地北门里）**：林间面包房，恰巴塔+熟豆核桃+拿铁，白天“森林醒来时”套餐，晚上有小提琴+特调，杭州最像“小南法”的烘焙空间。[12]\n- **半甜不甜 BAN SUCRÉ（富阳）**：复古木调+旋转楼梯，二楼座位舒服，芝士玉米包/玫瑰草莓恰巴塔配咖啡，富阳约会神店。[1]\n- **Mongogo（富阳银湖）**：面包+咖啡+画店，二楼艺术空间，明太子法棍、莓乳酪贝果，坐一下午不发呆都可惜。[5]\n\n### 🏙 城西 / 拱墅：面包+咖啡一条街\n- **37 Domain \u0026 Bakery（金茂悦）**：藤椒腊肠恰巴塔、蓝纹核桃恰巴塔，咸口欧包党天堂，周边丰登路/塘萍路全是甜品咖啡店，买完串店坐。\n- **micro boulangerie（华星路）**、**marufuwa（塘萍路）**、**慢熟 Bud bread（孩儿巷/萍水街）**：慢熟碱水结、marufuwa 菠菜扭扭/玫瑰核桃恰巴塔，社区店氛围，坐得久没人赶。\n\n### ☕ 面包一般但“坐得很舒服”\n- **咕噜妮 Gurunie（滨江天街）**：山茶花面粉+法式软包，商场店但座位能待。\n- **安莎 AZAHAR（中山北路）**：敞开大窗，日式乳酪包+抹茶小松薯，室内外都 chill。[14]\n- **SEJERS KONDITORI 赛耶司（杭罐1958）**：丹麦酸种/苹果酥，老厂房改造，适合慢嚼黑麦面包的人。\n\n### 别踩的坑\n- 富贵面包（运河/奥体/河坊街）：东西好但**部分店座位少/纯外带**，想坐选有座次的店。\n- 可莎蜜儿/九月生活/熊治：早餐级，不是下午茶店。\n- 网红店周末 14:00–16:00 没座，建议 14 点前或 16:30 后去。\n\n要不要我按你“在西湖区/拱墅区/滨江/萧山”再缩成 3 家就近路线，顺便标出哪家 14 点后还有座？","mentioned":false,"memory":false,"refs":[{"t":"半甜不甜(BAN SUCRÉ)","s":"chenmin123","u":"http://mp.weixin.qq.com/s?__biz=Mzg5MTY2ODUxOQ==\u0026mid=2247485761\u0026idx=1\u0026sn=507c21c4dd4a681d8b75b10aad3b1d91\u0026chksm=ce733b24f635f5dce3f3a139dc73e2ea6c5ada34f73fe33dcb7d7fd12e44b0f1e4d4464a4d57#rd","k":"微信公众号","r":""},{"t":"藏在红枫林里的美食店你知道多少!","s":"吃不饱团队","u":"http://mp.weixin.qq.com/s?__biz=MzkyNjI0NDcxNA==\u0026mid=2247485159\u0026idx=2\u0026sn=555dbfcaf5eced007a71eecf6110ed81\u0026chksm=c343d67f1b36275254ad69bfda603a5d5463a3e41dd122138d377473f32691c4056f55896d6d#rd","k":"微信公众号","r":""},{"t":"Mongogo咖啡､面包","s":"chenmin123","u":"http://mp.weixin.qq.com/s?__biz=Mzg5MTY2ODUxOQ==\u0026mid=2247485918\u0026idx=1\u0026sn=dc6f6ae90a599a7db8c18d9c9b802af2\u0026chksm=ce00d8e80ca37102d657b0206d10bcda15cadfae8b49bb27a9b151398e6898c958f439a0f2f2#rd","k":"微信公众号","r":""},{"t":"杭州遍地治愈碳水!猫咪面团NEKOPAN全门店合集","s":"七克拉的巧克力","u":"http://mp.weixin 649881396\u0026idx=1\u0026sn=c90c5571914b30193d2d05618b4c78b1\u0026chksm=bed42bc489a3a2d2edf055a21f9401b2eea1c98ae4260c641d2b4aa734ff16afc2ed402bc8d2#rd","k":"微信公众号","r":""},{"t":"地铁直达!萧山这里又开出一家“宝藏小店”!是城里没有的味道","s":"萧山发布","u":"http://mp.weixin.qq.com/s?src=11\u0026timestamp=1791466721\u0026ver=7014\u0026signature=R96guyonnNR*-haPypnanuXbHxYEh5ieJWbamSkLZu1PuMczTTN5HOaNFczJcrrJ67AWnvRLkgkdCS9LYONBB59BHvjm6i9fWPWSwT82KplMjmF9Z1aPM0SMmJ*a5v8E\u0026new=1","k":"微信公众号","r":""}]},{"text":"杭州能“坐下来喝下午茶”的面包店，按场景直接给：\n\n**日系软包 / 久坐舒服**\n- **猫咪面团 NEKOPAN（小河直街店）**：独栋两层，二楼窗边看运河，斑斓吐司、盐面包、米面包都稳，闺蜜下午茶最对味。[1][13]\n- **Cycle \u0026 Cycle（天目里店 / 恒隆 / 湖滨等）**：日式盐面包、龙井豆乳冰面包、芝士碱水球，玻璃窗+绿植，买完坐店外/店内都舒服。[11]\n\n**欧包 / 恰巴塔 / 面包控向**\n- **micro 米高烘焙（华星路）**：花椒腰果恰巴塔、黑松露罗勒芝士，配咖啡很顶，空间不如猫咪大但要碰运气有座。\n- **Beyond Bread（城西银泰附近润园街）**：盐面包、碱水球、可露丽都专业，社区店气质，适合真面包脑袋。\n- **37domain**：全麦/恰巴塔/藤椒腊肠，咸口调味强，少油少甜。\n\n**运河/历史街区慢坐**\n- **林先生的面包店（小河路运河工厂店）**：工厂风+大树下座位，咖啡配吐司/盐面包，下午晒着太阳发呆很杭州。\n- **时峪 / 时屿（上城维萨新筑）**：青花椒竹笋芝士碱水、德式香肠贝果，社区小店，咸口面包党下午茶首选。\n\n**甜品+面包+能坐半天**\n- **Römer**：现烤吐司+切块甜品，有甜品自助/茶饮，单人解馋、朋友小聚都行。\n- **巧克怪兽（屏风街）**：核桃肉桂卷、黑巧曲奇，甜党下午茶，配美式不腻。\n- **红跑车（西溪天街）**：欧式复古、堂食区大，流心多拿滋/瑞士卷/法棍，约人见面不翻车。[9]\n\n**商场里体面见人**\n- **B\u0026C 黄油与面包（嘉里中心）**：法式黑金风，可颂/甜品颜值高，外面有座，送礼感下午茶。\n- **Manner 坤和中心店**：咖啡+烘焙一体，武林码头运河景，室外座很松弛。\n\n**懒人选法**\n- 想拍照发呆 → 猫咪面团小河直街\n- 想认真吃面包 → Cycle \u0026 Cycle / micro / Beyond Bread\n- 想咸口不腻 → 时峪 / 37domain\n- 想甜品自由 → Römer / 巧克怪兽\n- 想见朋友体面 → B\u0026C 嘉里中心 / 红跑车西溪天街\n\n下午 2–4 点去，热门款还在、座位也比饭点好抢。要不要我按“西湖区 / 上城拱墅 / 滨江”排一条下午茶面包店散步路线？","mentioned":false,"memory":false,"refs":[{"t":"杭州遍地治愈碳水!猫咪面团NEKOPAN全门店合集","s":"七克拉的巧克力","u":"http://mp.weixin.qq.com/s?src=11\u0026timestamp=1791466721\u0026ver=7014\u0026signature=sQWnRaAXvND8UcMK19k*nfay4uDYk9zwRNDy7j813imx8Qrm1ftH5SkfiHE4BY6D9mb4inLnel*3EsAW1a72no5wV0cqD0rEyqEff1er1-5fm6X00U75uvFjzi-GNhY1\u0026new=1","k":"微信公众号","r":""},{"t":"赴旧港:刷到好多人推荐杭州这几家面包店,周末挑了几家去试｡Cycle\u0026Cycle在杭州有多家分店,龙井豆乳冰面包确实清爽,冰着吃很舒服｡上城","s":"今日头条","u":"https://www.toutiao.com/a1865751171603593"," n \n2. Cycle\u0026Cycle（多家门店）\n \n小程序：CycleCycle\n✅ 亮点：网红老牌，盐面包、圈圈碱水酥、芋泥大鼓；小程序可预约，杭州大部分区域支持同城配送，门店多，配送时效稳定[11]。\n适合：日常早餐，喜欢日式软面包+碱水。\n \n3. U bakery（信义坊/解放路）\n \n小程序：U cake bakery\n✅ 亮点：黑胡椒牛肉碱水、花椒腰果恰巴塔是招牌；小程序直接下单，同城配送，咸口面包很出彩，黄油小包、蝴蝶酥也不错。\n \n4. 可莎蜜儿（杭州本土连锁）\n \n小程序：可莎蜜儿\n✅ 亮点：杭州遍地门店，稳定性高；碱水结、吐司、欧包都有，全城小程序同城配送，配送范围广，雨天也很稳，性价比高。\n适合：不想赌手作店翻车，日常刚需早餐。\n \n5. 照亮烘焙研究所Liang Bakery（黄龙）\n \n小程序：照亮烘焙研究所\n✅ 亮点：就是前面推荐的那家，碱水胶质感很强，苦咖啡黑巧碱水棒很推荐；小程序预约，西湖区为主，杭州大部分区域支持同城配送。\n \n📌 补充小提示\n \n成屿烘焙：主打米胖丁、艾草碱水，是公众号接单模式，没有独立小程序，一般只能自提或者邮寄，不做同城即时配送，这点注意区分。\n\n手作店（猫咪面团、照亮烘焙）一般需要提前一天小程序预定，当日现烤，配送大多是下午/傍晚送达；连锁（Cycle、可莎蜜儿）当日单更容易抢到。\n\n碱水面包建议收到后烤箱/空气炸锅复烤，嚼劲会回来。\n \n快速选型\n \n想吃碱水、米面包：猫咪面团首选\n\n西湖区附近、偏爱扎实碱水体：照亮烘焙\n\n随手买、追求稳定不出错：可莎蜜儿 / Cycle\n \n你在西湖区哪个位置？我帮你挑配送时效最快的一家。","mentioned":false,"memory":false,"refs":[{"t":"甜品烘焙连锁品牌「欢牛蛋糕屋」获近千万美元A轮融资_资讯_观潮新消费","s":"www.tidesight.com","u":"https://www.tidesight.com/news/1363126.html","k":"其他网站","r":""},{"t":"2026年入围蛋糕品牌介绍-工会2023","s":"ghnw.hzvtc.edu.cn","u":"https://ghnw.hzvtc.edu.cn/details.jsp?urltype=news.NewsContentUrl\u0026wbtreeid=1004\u0026wbnewsid=1613","k":"其他网站","r":""},{"t":"为什么杭州叫中国糕都?这里聚集了全国最卷的烘焙门店._苏州新芦苇科技有限公司","s":"www.szreed.cn","u":"https://www.szreed.cn/article-item-506.html","k":"其他网站","r":""},{"t":"被面包之神眷顾的城市!凭什么说TA不好吃?_超市便利_什么值得买","s":"post.smzdm.com","u":"https://post.smzdm.com/p/a8w3rngl","k":"什么值得买","r":""},{"t":"源麦甜西湖店上线小程序和饱饱碗外卖啦 下雨天和源麦甜超配哒#源麦甜 #源麦甜西湖店 #杭州 #西湖 #外卖","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7644041691988582629","k":"抖音","r":""},{"t":"萧山有家无人售货的小小面包店，运行一个多月，状况如何?_都市快报橙柿互动","s":"m.toutiao.com","u":"http://m.toutiao.com/group/7300897354449568306/","k":"今日头条","r":""},{"t":"这里也发一遍我的白海豚杭州吃包日记 #杭州 #杭州面包 #减脂小汉堡 #小狗日记","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7676033870983032037","k":"抖音","r":""},{"t":"抹茶乳酪碱水-抹茶乳酪碱水促销价格、抹茶乳酪碱水品牌 - 淘宝","s":"mobile-phone.taobao.","u":"https://mobile-phone.taobao.com/chanpin/66722709aa505407e3d64541c0ceeb465d47e7675f8f7b0254af478d471ff8c3.html", ed":false,"memory":false,"refs":[{"t":"杭州Marufuwa,惊喜挑战!","s":"百度一下","u":"https://mbd.baidu.com/newspage/data/dtlandingsuper?nid=dt_3970090773466671074","k":"百度系","r":""},{"t":"同城帮买帮送一键下单蜂鸟跑腿小程序","s":"氧气少女的收藏夹","u":"http://mp.weixin.qq.com/s?src=11\u0026timestamp=1791466736\u0026ver=7014\u0026signature=aAyGvzfMsdNtjSQye9XTenHg4vSccLKBeKKxmkfVmr7ceh-Z5zoJfrcjZD7BWkrc7haTeGMXoMQyw0cOjSLFyN4hg0PGOyH0f0*saCF9fZbX7n5Tip*uSAG0saAAy7yQ\u0026new=1","k":"微信公众号","r":""},{"t":"杭州旅游攻略,杭州美食探店","s":"穷游网","u":"https://biu.qyer.com/p/XcFWmgHpsNk3BD0gjYSxOQ.html","k":"其他网站","r":""},{"t":"微信同城配送怎么用?小程序下单流程与服务范围说明","s":"快递鸟","u":"http://www.kdniao.cn/message/detail/122108","k":"其他网站","r":""},{"t":"超全“杀糕”指南!甜品之神眷顾的“糕都”,名不虚传!","s":"今日头条","u":"https://www.toutiao.com/article/7611441728122143247","k":"今日头条","r":""},{"t":"一口流沙的咸蛋黄可颂!城北面包地图必须有这家温馨小店","s":"拱宸","u":"http://mp.weixin.qq.com/s?__biz=Mzg4NDgxMzA3NQ==\u0026mid=2247641062\u0026idx=1\u0026sn=0790d7a9c81341ded39e57385c814c75\u0026chksm=ce60a12c9f453b4be45893ef6d259f0bf0ea34dfa7ef629f2c3cd7e4774c3a04b90cfa6d5365#rd","k":"微信公众号","r":""},{"t":"顺丰同城","s":"sf-cityrush","u":"https://www.sf-cityrush.com/","k":"其他网站","r":""},{"t":"城记·杭州最好吃的可颂和司康在哪里【Cycle\u0026Cycle】","s":"穷游网","u":"https://biu.qyer.com/p/bXXwXbKj_V6ME5auG4fGMQ.html","k":"其他网站","r":""},{"t":"微信上怎么找跑腿服务?","s":"筱筱网","u":"http://www.sboyo.com/2/1465451.html","k":"其他网站","r":""},{"t":"“面包脑袋”集合!城厢这几家宝藏面包店,一口就爱上!","s":"萧山城厢","u":"http://mp.weixin.qq.com/s?src=11\u0026timestamp=1791466736\u0026ver=7014\u0026signature=xOS9uVE0*uZD23QLrNhcx8AQYW2kVhn3*m6APkk7jJE7whE0gwzlyLm-02Wp-NuSUhrwALDWm18s3uScdg*wR*pxiHOZVwF6Ojj2QS0TQZVPHQcGmpInNhhYBdutwy0i\u0026new=1","k":"微信公众号","r":""}]},{"text":"有，杭州不少本地面包店都支持**微信小程序下单 + 同城配送/自提**，但模式分两种：\n\n### 一、本地面包店自有小程序（预售/次日送为主）\n- **富贵面包公司**：微信搜「[ ](@styleLink?key=b7078aa2d2a60052bf02e10a66a40b92\u0026style=iconLink\u0026display=miniProgram)[富贵面包Richesbread](@styleLink?key=b7078aa2d2a60052bf02e10a66a40b92\u0026display=miniProgram)」，杭州同城配送+自提，当天订次日发，猪肉脯吐司/冰面包都能买 [10]\n- **Cycle \u0026 Cycle**：有「[ ](@styleLink?key=ca921a60154d1cbb54d0c0aa22748490\u0026style=iconLink\u0026display=miniProgram)[CycleCycle](@styleLink?key=ca921a60154d1cbb54d0c0aa22748490\u0026display=miniProgram)」小程序，分店多，冰面包/生吐司强，部分门店支持小程序点单/自提，同城跑腿可加闪送\n- **猫咪面团 nekopan**：小程序「[ ](@styleLink?key=0765a3858d3db60a3f1dccd078d5309c\u0026style=iconLink\u0026display=miniProgram)[猫咪面团nekopan](@styleLink?key=0765a3858d3db60a3f1dccd078d5309c\u0026display=miniProgram)」，米面包/生吐司，滨江、小河直街店常接同城单\n- **麦陌**：微信搜「麦陌」，同城用 UU 跑腿/闪送，芋泥蛋黄流心吐司、核桃马里奥\n- **Cereal Bakery**：小程序「[ ](@styleLink?key=bb4c4f2bd5bc9502cac5e77f0a6a2132\u0026style=iconLink\u0026display=miniProgram)[hey cereal](@styleLink?key=bb4c4f2bd5bc9502cac5e77f0a6a2132\u0026display=miniProgram)」，法式欧包/生吐司，杭丝联、文二菜市场店\n- **樂松、慢熟、安莎、ichi nichi、成屿**：部分有公众号/小程序/微店，杭州同城常靠“小程序下单 + 闪送/跑腿取货”\n\n### 二、平台型小程序（最省事，但未必是“本地面包店直营”）\n- 美团外卖 / 饿了么（微信里也能进）：搜店名直接送，冰面包、盐面包、吐司都有\n- 京东秒送 / 淘宝闪购 / 闪送：本地面包店没上外卖时，用跑腿代买代送\n- 有赞/微店类：富贵、麦陌、成屿这种“微店/有赞/自研小程序”最常见\n\n### 三、游客实用结论\n- 想**买本地网红冰面包** → 富贵面包公司小程序（次日同城）、Cycle \u0026 Cycle 小程序+闪送\n- 想**现在就吃到** → 美团/饿了么搜“Cycle \u0026 Cycle / 富贵 / 猫咪面团 / 麦陌”，看是否营业+配送范围\n- 想**带回去当伴手礼** → 富贵小程序买“次日同城/全国邮寄”，别在景区摊买\n- 冰面包别走普通外卖放 1 小时，优先“小程序下单→门店现包→闪送 30–60 分钟”\n\n要不要我按你住**湖滨/小河直街/龙坞/奥体/东站**排一份“步行买 + 小程序补单”的面包动线？","mentioned":false,"memory":false,"refs":[{"t":"杭城小店 杭州人都在买什么“包”?","s":"腾讯新闻","u":"https://news.qq.com/rain/a/20241114A09J4500","k":"腾讯新闻","r":""},{"t":"问 杭州面包新语门店地址查询","s":"呀呀生活网","u":"https://www.yy66.cn/yxwd/202512/77689732208528.html","k":"其他网站","r":""},{"t":"富贵面包公司:面包控的福音","s":"百度一下","u":"https://mbd.baidu.com/newspage/data/dtlandingsuper?nid=dt_4537120220284678752","k":"百度系","r":""},{"t":"麦陌小程序点单","s":"mp.weixin.qq.com","u":"http://mp.weixin.qq.com/s?src=11\u0026timestamp=1791466711\u0026ver=7014\u0026signature=7cyw8r2DrZDnlvdIGdQJXGwPRJfvVCgCi8Sxo2T*sbvMDzyosF7zjKirRiLJ7SxaPEuOrEeFKSf0OnA9zhGOc5hx5ZE5HMBtrmjYjHdrB7jJqg2nXS-Ri4r*3ZkvoLE7\u0026new=1","k":"微信公众号","r":""},{"t":"一年网购了100箱面包,这是我们最爱的5家好店!","s":"搜狐网","u":"https://www.sohu.com/a/629118985_113612","k":"搜狐","r":""},{"t":"喜欢在杭州吃吃吃,还不是因为有这些神仙面包店","s":"嬉游","u":"http://mp.weixin.qq.com/s?__biz=MjM5MTM2Mjk4MQ==\u0026mid=2650339039\u0026idx=1\u0026sn=816c28fd67e77b99a8cc989af888f459\u0026chksm=bf288741cc0b5f767b91bb6b387a9930ca4f225aac88d516ccede63ca089c22430c4d336fb8a#rd","k":"微信公众号","r":""},{"t":"富贵面包公司,是怎么富贵的?","s":"szreed","u":"http://www.szreed.cn/article-item-73.html","k":"其他网站","r":""},{"t":"今年面包圈的C位已内定:米面包,出道吧!","s":"网易","u":"https://dy.163.com/article/FB9VKN4V0525TST2.html","k":"网易","r":""},{"t":"被面包之神眷顾的城市!凭什么说TA不好吃?","s":"今日头条","u":"https://m.toutiao.com/article/7551647211533124135/","k":"今日头条","r":""},{"t":"富贵面包公司","s":"微店官网-微信开店用微店","u":"https://weidian.com/?userid=1667897","k":"其他网站","r":""},{"t":"杭州探店 一起大富大贵呀","s":"携程旅行","u":"https://m.ctrip.com/webapp/you/community/detail?articleId=8480721\u0026isHideNavBar=YES\u0026seo=0","k":"携程","r":""},{"t":"这几条老城区的小巷子,平价又惊艳的小店竟有这么多","s":"今日头条","u":"https://m.toutiao.com/article/7559851615226741311","k":"今日头条","r":""},{"t":"“包治百病”,“偷偷”享受碳水带来的愉悦","s":"杭州网","u":"https://2022jnh.hangzhou.com.cn/content/content_8306513.html","k":"其他网站","r":""}]}],"q09_deepseek":[{"text":"专门的低 GI 面包店选择不多，但有几家店可以买到适合控糖人群的**无糖无油全麦面包**，或者**低糖碱水、贝果**。按你方便的位置看看：\n\n### 🍞 可按需定制：嘉唐烘焙\n如果你需要严格的无糖无油，这家是可以直接跟老板提要求的。有顾客反馈在这里**定做过无糖无油的高全麦含量吐司**，很适合需要严格控碳水的人。位置在钱塘区宋都晨光国际。\n\n### 🌾 现成低糖选择\n*   **五谷七福（平海店）**：上城区平海路。可以找**玄米素面包**，明确标注无油脂、无蔗糖、无蛋无奶，饱腹感强。\n*   **林先生的面包店（天荟未来之光城店）**：余杭区。有**手熬低糖红豆包**、**全麦碱水**，相对健康。\n*   **鹿松面包店**：西湖区跑马场路。这家社区老店会主动介绍**无糖无油的新品**，可以到店问店员当天款。\n*   **Fascino / 慢熟面包店**：播客推荐里提到了 Fascino 的**全能贝果**标注了“粗粮低糖”。慢熟面包店（孩儿巷）有**黑芝麻碱水棍、全麦芋泥碱水**，碱水包通常糖油含量比甜面包低不少。\n\n### 💡 避坑提醒\n注意避开名字里带“糖友饱饱”的网店。它虽然在杭州有公司，但**曾因宣传“不升糖”被行政处罚**，被认定无法提供证据证明其控糖功能。\n\n如果你想找某个特定区域（比如滨江、萧山）的店，可以告诉我，我再帮你筛一下。","mentioned":false,"memory":false,"refs":[{"t":"糖友饱饱获数千万A+轮融资，曾因虚假广告被罚，朱水旺真假控糖？","s":"zhihu","u":"https://zhuanlan.zhihu.com/p/592890664#0","k":"知乎","r":""},{"t":"五谷七福(平海店)","s":"Apple Maps: Directio","u" %A8%E6%88%BF/63086807?bst=1790983196.dcdf2af230d6657e#1#1","k":"百度系","r":""},{"t":"多多邦手作工坊｜让时光慢下来/过有滋味的生活","s":"zhihu","u":"https://zhuanlan.zhihu.com/p/539640773#0","k":"知乎","r":""},{"t":"杭州姑娘晨跑后啃完两片黑麦奇亚籽吐司，血糖稳了，肚子也不咕咕叫了","s":"淘江湖","u":"https://jianghu.taobao.com/detail/47730_88689391?order=1","k":"电商平台","r":""},{"t":"五谷七福(平海店)","s":"Apple Maps: Directio","u":"https://maps.apple.com/place?place-id=H2710I3F93192A72D11\u0026_provider=57879","k":"地图","r":""},{"t":"糖友饱饱（杭州）健康食品有限公司","s":"Newseed","u":"https://m.newseed.cn/company/181280","k":"其他网站","r":""},{"t":"杭州程序员林薇晨跑后连吃两周轻态包，早餐不再饿得发慌","s":"淘江湖","u":"https://jianghu.taobao.com/detail/47545_92872253?order=3","k":"电商平台","r":""},{"t":"牧唐(杭州)科技有限公司","s":"猎聘","u":"https://m.liepin.com/company/13718973/","k":"其他网站","r":""},{"t":"若米","s":"百度百科","u":"https://baike.baidu.com/item/%E8%8B%A5%E7%B1%B3/50207764?bst=1790976750.a52babec2ce2530c","k":"百度系","r":""},{"t":"校地协同赋能健康食品创新 浙大智慧绿洲低GI技术让控糖食品有效又好吃","s":"新华网浙江","u":"http://zj.xinhuanet.com/20260708/442b3c9810034020b1c2f56caf5da591/c.html","k":"其他网站","r":""}]}],"q09_doubao":[{"text":"我给你挑两家适合控糖人群，优先选碱水、全麦、多谷物款；没有真正认证“低GI”门店，只能选少糖、高纤维的品类，买的时候避开带馅料、果干蜜渍的款。\n \n1、枣叔的店（来福士店）｜控糖首选，碱水、全麦选择多\n \n✅适合：找低糖油碱水、全麦吐司，有不少无额外加糖的主食面包，商场门店方便买，可试吃。\n👉控糖优先选：碱水南瓜吐司、碱水结、全麦硬欧；尽量避开芋泥麻薯、流心这类甜馅料欧包。\n📍上城区新业路228号来福士广场F4\n \n\n \n2、红跑车（501城市广场店）｜多谷物欧包，选择丰富\n \n✅适合：想买大只多谷物欧包、法棍、碱水，门店多，也可以小程序下单，适合做早餐。\n👉控糖优先选：多谷物欧包、法棍、碱水系列；避开桑葚乳酪、带大量果干蜜饯的款式。\n📍上城区景昙路9号西子国际中心一楼\n \n\n \n小提醒（控糖买面包要点）\n \n不要只看名字，优先看配料表：第一位是全麦粉/黑麦粉，白砂糖尽量排在末尾；\n\n碱水、硬欧、法棍＞软欧包；带麻薯、奶酪、蜜果干的一般糖分偏高；\n\n市面上几乎很少有真正官方检测“低GI”的线下烘焙店，只能靠选高纤维少糖的品类来控制。\n \n你大概在杭州哪个片区？我帮你筛更近的门店。","mentioned":false,"memory":false,"refs":[]},{"text":"我给你挑了杭州3家适合控糖、主打低油低糖、粗粮全麦的面包店；⚠️注意：门店不会标注“低GI认证”，优先选无额外加糖、全麦/多谷物、少馅料的款式，避开甜馅、吐司、可颂。\n \n1. 枣叔的店（来福士广场店）｜控糖首选，全麦贝果\u0026碱水欧包\n \n📍上城区来福士广场4楼，江锦路地铁口附近\n✅适合控糖的选品：咖啡奇亚籽全麦贝果、碱水南瓜吐司、墨鱼肠法棍。整体低油低糖，面包体扎实有嚼劲，甜款甜度克制；尽量选无夹心的基础款，避开麻薯、流心甜馅款。\n💡优势：商场店，试吃大方，可切分，适合做早餐代餐。\n \n\n \n2. 红跑车（来福士店）｜多谷物欧包，性价比高\n \n📍上城区来福士B1层，江锦路地铁站旁\n✅适合控糖选品：多谷物面包、法棍、碱水芝士球。多谷物欧包坚果果干丰富，不甜腻，麦香足；尽量避开桑葚乳酪这类甜软欧包。\n💡优势：面包选择多，可以试吃，价格亲民，外卖方便。\n \n\n \n3. 赛耶司烘焙（杭州大厦店）｜恰巴塔、硬欧，适合武林/湖滨片区\n \n📍拱墅区杭州大厦B座B1，武林广场地铁站附近\n✅适合控糖选品：黑豆松子恰巴塔、松鼠坚果欧包、法棍。恰巴塔水分足、气孔大，坚果欧包麦香浓郁，适合身材管理期；优先选咸口/无甜馅的恰巴塔。\n💡优势：位置在市中心，逛街顺路买，部分面包可以买半份。\n \n\n \n控糖买面包小提醒\n \n优先：全麦、多谷物、碱水、恰巴塔、法棍、无馅贝果；\n\n少选：甜吐司、可颂、大量糖渍果干、流心乳酪夹心欧包；\n\n若血糖比较敏感，购买时可以问店员：该款是否额外添加蔗糖。\n \n你大概在杭州哪个区？我帮你筛离你更近的门店。","mentioned":false,"memory":false,"refs":[{"t":"#枣叔的店(来福士广场店)#","s":"weitoutiao.zjurl.cn","u":"https://weitoutiao.zjurl.cn/rogue/topic_share/?concern_id=1867213763849275\u0026prevent_activate=1","k":"其他网站","r":""},{"t":"杭州首家控糖社区食堂 #街坊食堂 #控糖 #控糖饮食 #萧山 #减脂","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7650113676423746161","k":"抖音","r":""},{"t":"携程笔记-杭州城北万象城！值得N刷！面包脑袋赶紧冲！！","s":"m.ctrip.com","u":"https://m.ctrip.com/webapp/you/community/detail?articleId=129411360\u0026hidePublishButton=true\u0026hideTitle=true\u0026allianceid=7144873\u0026sid=263483165","k":"携程","r":""},{"t":"杭州湾新开的这家面包店🥹 新开的新开的！开业啦宋面包！各种碱水软欧蛋糕真的好好吃#强烈推荐 #杭州湾 #杭州湾美食推荐 #甜品烘焙","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7528739887626407177","k":"抖音","r":""},{"t":"moto面包料理44.9代60 当天现做，环境优雅，品种丰富#moto one面包料理 #面包 #烘焙 #日式面包##美味上新了","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7647730291474424441","k":"抖音","r":""},{"t":"携程笔记-微医绿谷｜🍰零卡糖烘培试营业啦❗️","s":"m.ctrip.com","u":"https://m.ctrip.com/webapp/you/community/detail?articleId=252890576\u0026hidePublishButton=true\u0026hideTitle=true\u0026allianceid=7144873\u0026sid=263483165","k":"携程","r":""},{"t":"枣叔的店咖啡奇亚籽全麦贝果面包欧包早餐点心零食代餐健身低GI","s":"hzzsdd.cn","u":"http://hzzsdd.cn/product_detail.aspx?id=308","k":"其他网站","r":""},{"t":"杭州上城天街新开了一家山栗triplebakery面包店颜值口味双在线 性价比高快冲#山栗triplebakery #面包 #甜品治愈一切 ","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7613958626134627530","k":"抖音","r":""},{"t":"IU Planet膳食纤维工坊 #真实生活分享计划 #杭州探店 #杭州面包店 #健康欧包#美食","s":"www.iesdouyin.com","u":"https://www.iesdouyin.com/share/video/7674506997858342821","k":"抖音","r":""},{"t":"薄皮抹茶碱水球-薄皮抹茶碱水球促销价格、薄皮抹茶碱水球品牌 - 淘宝","s":"mobile-phone.taobao.","u":"https://mobile-phone.taobao.com/chanpin/c630538f4ea73d770754f4522fb0af9c8a761e688752850030cb701ddfee7d1f.html","k":"电商平台","r":""},{"t":"控糖欧包-控糖欧包促销价格、控糖欧包品牌 - 淘宝","s":"mobile-phone.taobao.","u":"https://mobile-phone.taobao.com/chanpin/7041dd7f8f6ed9e47447c10bc458632d.html","k":"电商平台","r":""},{"t":"枣叔的店抹茶-枣叔的店抹茶促销价格、枣叔的店抹茶品牌 - 淘宝","s":"mobile-phone.taobao.","u":"https://mobile-phone.taobao.com/chanpin/29a3d16af1784aa54304a9000376455317663044ff2622d5d52447da434014c2.html","k":"电商平台","r":""}]}],"q09_hunyuan":[{"text":"杭州**真正“低GI认证、适合糖友/控糖期”的现烤面包店很少**，大多是“低糖低油/全麦/无糖无油”但不是真低GI。按需求分三档：\n\n## 一、真·控糖/低GI食品品牌（不是街边面包香，但最稳）\n- **糖友厨房 / 糖友饱饱**（杭州公司，线上为主）：低GI手撕面包、控糖面包、鲜肉包/馒头/面都走“0白面粉、轻碳水”路线，有第三方低GI/控糖研发背景，糖前期、糖尿病、减脂人群更合适。[4][6]\n- **麦谷道**：杭州电商系低GI烘焙品牌，低GI全麦面包/蛋糕/曲奇线上卖，适合买回去当早餐，不是门店体验型。\n\n\u003e 控糖严格（糖友/孕糖/胰岛素抵抗）：直接买这类，别迷信“全麦=低GI”。\n\n## 二、健康面包店：低糖低油、无糖无油款多（不是低GI认证，但比普通软甜包好）\n- **micro / 米高烘焙**（华星路）：恰巴塔、花椒腰果、黑松露罗勒，高水分面团、无糖无油，健身/控碳人爱去。\n- **37Domain\u0026Bakery**（拱墅金茂悦）：全麦、恰巴塔、咸口欧包，少油少甜，控糖期吃一小块比可颂强。\n- **Cycle \u0026 Cycle**（中山北路/益乐路/天目里）：海盐卷、红酒坚果、芝士碱水球，低糖低油、越嚼越香，但别选冰面包/红豆包。\n- **慢熟 bud bread**（孩儿巷）：黑芝麻松子碱水、酸奶盐面包，日式低油路线，分量小、碳水没那么炸。\n- **AMO Bakery**（杭州本地口碑）：裸麦、鲁邦种、无糖无油黑麦款，酸度高但升糖相对慢，适合懂面包的人。\n- **枣叔的店**（下沙/萧山/滨江宝龙）：低糖低油、芋泥米面包，但有些款仍有糖油，别当控糖主食猛吃。\n\n## 三、别买错\n- “全麦吐司”“养生欧包”“0蔗糖”≠低GI：0蔗糖可能加麦芽糖浆/蜂蜜，全麦粉排第二也算伪全麦。\n- 麻薯、流心、冰面包、生吐司、可颂、猪肉脯吐司：控糖期基本别碰。\n- 真要买：看配料表**小麦粉/白面粉排第一就放弃**，看每100g碳水、糖、膳食纤维，优先**全谷物+高纤+无添加糖+分量小**。\n\n## 四、一句话\n- 糖友/医生让控糖 → **糖友厨房 / 糖友饱饱 / 麦谷道**（线上买）\n- 自己减脂、想吃点“像面包的东西” → **micro、37Domain、Cycle 碱水款、慢熟碱水**\n- 旅游顺路吃一口 → 买**小个碱水/恰巴塔/裸麦**，别买软甜包，别当主食吃\n\n要不要我帮你列一份“杭州面包店点单避坑清单”：每家居哪些能拿、哪些绝对别拿？[](@ma","mentioned":false,"memory":false,"refs":[{"t":"杭州面包店合辑面包和汤和猫咪好天气","s":"网易","u":"https://m.163.com/dy/article/EIKHM9790518F15K.html","k":"网易","r":""},{"t":"糖友厨房是正规品牌吗","s":"爱企查","u":"https://aiqicha.baidu.com/details/rankList?query=defe97949a2618ffc6579eef3504301a\u0026type=20","k":"百度系","r":""},{"t":"糖友饱饱","s":"百度百科","u":"https://baike.baidu.com/item/%E7%B3%96%E5%8F%8B%E9%A5%B1%E9%A5%B1/60446162","k":"百度系","r":""},{"t":"面包脑袋私藏的杭州9 家面包店!","s":"寻味慢旅","u":"http://mp.weixin.qq.com/s?src=11\u0026timestamp=1791466885\u0026ver=7014\u0026signature=vODcMLIoOMwfrQj5uZqa*nEUwiEM-bsSk3j*k9E2FTuXlGe4CvmI-yd07vXSnRNJnRlXO83D1dBD93x1*eACKxgqqqqmDSIYTIubOZK3rZxdLI4oMQeaHcfc7LmNfgB*\u0026new=1","k":"微信公众号","r":""},{"t":"糖友厨房","s":"百度百科","u":"https://baike.baidu.com/item/糖友厨房/63086807","k":"百度系","r":""},{"t":"#杭州面包脑袋#","s":"zjurl","u":"https://weitoutiao.zjurl.cn/rogue/topic_share/?concern_id=1798013945600195\u0026prevent_activate=1","k":"其他网站","r":""},{"t":"杭州面包最全2.0攻略 没吃过都不意思说自己到过杭州","s":"今日头条","u":"https://www.toutiao.com/article/7044519732556415496/","k":"今日头条","r":""},{"t":"低升糖指数健康食品选购,这些问题要注意","s":"免费黄页网","u":"https://www.b2b168.org/wvs213657233.html","k":"其他网站","r":""},{"t":"2026年广受信赖的面包店推荐好吃的门店用户力荐","s":"家电维修网","u":"https://www.bjjdwx.com/thread-420649-1-6161.html","k":"其他网站","r":""},{"t":"杭城春游踏青,这几家手作面包别错过!","s":"搜狐网","u":"https://www.sohu.com/a/456219158_450520","k":"搜狐","r":""},{"t":"糖尿病患者可以吃哪种面包","s":"baidu","u":"https://health.baidu.com/m/detail/ar_6814568012051885566","k":"百度系","r":""},{"t":"杭州这家食品企业获得千万元天使轮融资 产品能让糖尿病患者吃饱“不升糖”","s":"财富头条网","u":"http://www.jhrbs.com/jinhu/gn/2021/0915/44575.html","k":"其他网站","r":""},{"t":"杭州遍地治愈碳水!猫咪面团NEKOPAN全门店合集","s":"七克拉的巧克力","u":"http://mp.weixin.qq.com/s?src=11\u0026timestamp=1791466885\u0026ver=7014\u0026signature=sQWnRaAXvND8UcMK19k*nfay4uDYk9zwRNDy7j813imx8Qrm1ftH5SkfiHE4BY6D3XWDgZrRIl9pek3rWcV7vRmGkSYwSZxtd17zRWaLx7nN0vYImSYzD3pag22rINJU\u0026new=1","k":"微信公众号","r":""},{"t":"杭州AMO BAKERI","s":"大众点评","u":"https://m.dianping.com/discovery/830332109","k":"大众点评和美团","r":""}]},{"text":"杭州**真正“控糖友好”的店不多**——大多数网红店只是“低糖油”，不是低 GI。控糖/糖前/糖尿病家属，优先找**天然酵母酸种、100% 全麦/黑麦、无糖无油、配料表短**的店。\n\n### 一、杭州本地值得去的（控糖向）\n- **micro 米高烘焙**：高水分恰巴塔、无糖无油欧包，健身/控糖党常买，花椒腰果恰巴塔、黑松露罗勒芝士恰巴塔都偏干净碳水。[1]\n- **37domain**：少油少甜，全麦面包和恰巴塔强，藤椒腊肠/蓝纹核桃恰巴塔，咸口调味不踩雷。[1]\n- **AMO BAKERI**：配料和热量标得细，焦糖洋葱葛缕子裸麦吐司、鲁邦种恰巴塔、无糖无油黑麦款，适合懂面包的人。[6]\n- **SEJERS 赛耶司（杭罐1958）**：丹麦系，冠军酸种面包、100% 全麦+南瓜子无糖无油，天然酵母发酵，控糖人群能当主食。[3]\n- **枣叔的店**：低糖、芋泥/麻薯欧包用料扎实，有淘宝店；但部分款仍带馅料糖，别当“无糖”买。[12]\n- **AZAHAR 安莎 / 松柏 Pine\u0026Cypress**：安莎低油低糖米面包系；松柏每款标配料、全麦芋泥/芝麻面包偏健康。[1]\n\n### 二、连锁/商超里能买的“次优解”\n- **盒马烘焙**：羽衣甘蓝恰巴塔、原味全麦恰巴塔——看配料，别买芝士脆肠/红豆款（糖油上来了）。[7]\n- **可莎蜜儿**：有“经典全麦吐司”，但很多款仍加糖油，控糖只买原味全麦、别买奶油夹心。\n- **田园主义（杭州起家，线上为主）**：全麦欧包/0 脂欧包，减脂人群多，严格控糖也要看每百克碳水+膳食纤维，不是零碳水。[5]\n\n### 三、控糖买包“三看”\n1. 配料表第 1 位必须是**全麦粉/黑麦粉**，不是“小麦粉+少量全麦粉”\n2. 无“白砂糖/麦芽糖浆/炼乳/沙拉酱/起酥油”，最好无添加糖\n3. 优先：天然酵母酸面包、原味恰巴塔、原味贝果、100% 黑麦；避开：可颂、菠萝包、麻薯流心、芋泥乳酪吐司、肉松小贝 [10]\n\n### 四、一句话建议\n\u003e 杭州想“好吃又不太升糖”：**micro / 37domain / AMO / SEJERS 酸种全麦款**；  \n\u003e 图方便：**盒马原味全麦恰巴塔**；  \n\u003e 糖尿病/糖前：面包别当零食，正餐吃 1 片（30–40g）+ 鸡蛋/豆浆/蔬菜，别空腹吃。[13][14]\n\n要不要我按你住**西湖/滨江/城西/萧山**，直接排一份“控糖面包店+能买的具体款”清单？","mentioned":false,"memory":false,"refs":[{"t":"面包脑袋私藏的杭州9 家面包店!","s":"寻味慢旅","u":"http://mp.weixin.qq.com/s?src=11\u0026timestamp=1791466897\u0026ver=7014\u0026signature=vODcMLIoOMwfrQj5uZqa*nEUwiEM-bsSk3j*k9E2FTuXlGe4CvmI-yd07vXSnRNJkukQh846Bl2Jghk2rA10ebiggRrLpXhVxf8AccZKj0oWeHtVfoQZY2Ti5rLHXH2M\u0026new=1","k":"微信公众号","r":""},{"t":"2026年广受信赖的面包店推荐好吃的门店用户力荐","s":"家电维修网","u":"https://www.bjjdwx.com/thread-420649-1-6161.html","k":"其他网站","r":""},{"t":"楼下新开了家丹麦风味,自然发酵酸面包","s":"杭罐1958","u":"http://mp.weixin.qq.com/s?src=11\u0026timestamp=1791466897\u0026ver=7014\u0026signature=Wa1-JTeZx0J76d6d5uSSA7TGtTF1O2-r6FxFgyCj19ZjikNWhDlPb5AQQR0WKgYrdjvBYMWuBhbh81vHsrMw6u4G93UoQOOgq6mODScnNvJmEftGJjs7AUNiZnDA2Stl\u0026new=1","k":"微信公众号","r":""},{"t":"田园主义","s":"jtzslspxr","u":"http://www.jtzslspxr.com/jtzslspxr/7083728460530898189.html","k":"其他网站","r":""},{"t":"杭州AMO BAKERI","s":"大众点评","u":"https://m.dianping.com/discovery/830332109","k":"大众点评和美团","r":""},{"t":"“可甜可咸”还“万物皆可夹”! 萧山年轻人最近迷上这个新奇货……","s":"萧友圈","u":"http://mp.weixin.qq.com/s?__biz=MjM5OTE5MDMxMg==\u0026mid=2663202372\u0026idx=1\u0026sn=d48f398576c4e2c95310ff713af1db4f\u0026chksm=bdae3a000 ## 🍞 欧包推荐\n\n**慢熟 bud bread**\n主打日式社区面包，欧包选择多，有 **「黑松露恰巴塔」** 等款式，盲选也不容易出错。\n\n**林先生的面包店**\n**「椒香芝士夏巴塔」** 和 **「乡村无花果法式面包」** 都有不错的人气，整体性价比高。\n\n**红跑车**\n**「杂粮欧包」** 评价很好，麦香足、料实在，越嚼越香，适合喜欢谷物风味的人。\n\n如果追求比较独特的体验，萧山临浦横二村的 **789窑烤面包** 用果木窑烤，有 **「玫瑰荔枝恰巴塔」** 和 **「梅干菜恰巴塔」** 这类限定款，但位置较远，需要提前预约。","mentioned":false,"memory":false,"refs":[{"t":"喜欢在杭州吃吃吃，还不是因为有这些神仙面包店","s":"zhihu","u":"https://zhuanlan.zhihu.com/p/531175441#1","k":"知乎","r":""},{"t":"壮壮妈同款杭州面包脑袋的宝藏欧包｜up up","s":"xwjapp.com","u":"https://mapi.xwjapp.com/article/show-1139344006.html","k":"其他网站","r":""},{"t":"布咕面包, 中国浙江省杭州市","s":"Apple Maps: Directio","u":"https://maps.apple.com/place?place-id=H2710I3F9A16E47F545\u0026_provider=57879","k":"地图","r":""},{"t":"烘焙地图 | 西湖边的面包店，和猫咪一样治愈~","s":"zhihu","u":"https://zhuanlan.zhihu.com/p/378787395#0","k":"知乎","r":""},{"t":"甜之盐法式西点","s":"百度百科","u":"https://baike.baidu.com/item/%E7%94%9C%E4%B9%8B%E7%9B%90%E6%B3%95%E5%BC%8F%E8%A5%BF%E7%82%B9?bst=1790681160.5abd590b3e5dfb94","k":"百度系","r":""},{"t":"恰巴塔和米面包，早餐新选择！健康又美味。","s":"Weibo","u":"https://m.weibo.cn/status/5291976891043650","k":"微博","r":""},{"t":"林先生的面包店LamsBakery(庆春店)","s":"Apple Maps: Directio","u":"https://maps.apple.com/place?auid=1118492926518577\u0026lsp=57879","k":"地图","r":""},{"t":"PALMPARK BREAD\u0026COFFEE","s":"Apple Maps: Directio","u":"https://maps.apple.com/place?place-id=H2710I3F9845C8B4F78\u0026address=%E4%B8%AD%E5%9B%BD%E6%B5%99%E6%B1%9F%E7%9C%81%E6%9D%AD%E5%B7%9E%E5%B8%82%E6%BB%A8%E6%B1%9F%E5%8C%BA%E6%9C%88%E6%98%8E%E8%B7%AF199%E5%8F%B7%E8%B6%A3%E9%93%BE%E7%A7%91%E6%8A%80%E4%BA%A7%E4%B8%9A%E5%9B%AD104%E5%AE%A4\u0026coordinate=30.205575","k":"地图","r":""},{"t":"藏在千亩稻田里的窑烤面包，有人开车2小时去吃，凭啥这么火？ - 今日头条","s":"今日头条","u":"https://www.toutiao.com/article/7693772928655065628/?wid=1791353668361","k":"今日头条","r":""},{"t":"朗月流霜","s":"Weibo","u":"https://m.weibo.cn/status/5211946422901233","k":"微博","r":""},{"t":"红跑车(钱塘永旺梦乐城店)","s":"Apple Maps: Directio","u":"https://maps.apple.com/place?place-id=H2710I3F9897E4DF932\u0026addre 生的面包店LamsBakery(庆春店)","s":"Apple Maps: Directio","u":"https://maps.apple.com/place?auid=1118492926518577\u0026lsp=57879","k":"地图","r":""},{"t":"甜之盐法式西点","s":"百度百科","u":"https://baike.baidu.com/item/%E7%94%9C%E4%B9%8B%E7%9B%90%E6%B3%95%E5%BC%8F%E8%A5%BF%E7%82%B9?bst=1790681160.5abd590b3e5dfb94","k":"百度系","r":""},{"t":"红跑车(钱塘永旺梦乐城店)","s":"Apple Maps: Directio","u":"https://maps.apple.com/place?place-id=H2710I3F9897E4DF932\u0026address=%E4%B8%AD%E5%9B%BD%E6%B5%99%E6%B1%9F%E7%9C%81%E6%9D%AD%E5%B7%9E%E5%B8%82%E9%92%B1%E5%A1%98%E5%8C%BA%E4%B9%89%E8%93%AC%E8%A1%97%E9%81%93%E9%9D%92%E5%85%AD%E4%B8%AD%E8%B7%AF667%E5%8F%B7%E6%B0%B8%E6%97%BA%E6%A2%A6%E4%B9%90%E5%9F%8E%28%E6","k":"地图","r":""},{"t":"藏在千亩稻田里的窑烤面包，有人开车2小时去吃，凭啥这么火？ - 今日头条","s":"今日头条","u":"https://www.toutiao.com/article/7693772928655065628/?wid=1791353668361","k":"今日头条","r":""},{"t":"爱吃欧包的大橙子","s":"Weibo","u":"https://m.weibo.cn/status/5071189890302301","k":"微博","r":""},{"t":"布咕面包, 中国浙江省杭州市","s":"Apple Maps: Directio","u":"https://maps.apple.com/place?place-id=H2710I3F9A16E47F545\u0026_provider=57879","k":"地图","r":""},{"t":"面包5.8元起，海底捞要当“烘焙界小米”？ - - +1","s":"澎湃新闻","u":"https://www.thepaper.cn/detail/30790110#1","k":"其他网站","r":""},{"t":"唯唯带你吃","s":"Weibo","u":"https://m.weibo.cn/status/5032142383875419","k":"微博","r":""}]}],"q10_doubao":[{"text":"给你挑两家侧重点不一样，恰巴塔+欧包都能打的店：\n \n赛耶司烘焙(杭州大厦购物城北区店)\n✅亮点：恰巴塔是招牌强项，面包体胶质感强，气孔漂亮；推荐梅干菜扣肉恰巴塔、鸡枞菌恰巴塔，咸口很出彩；同时也有坚果欧包，适合喜欢硬韧口感面包的人。武林商圈，逛街顺路买很合适。\n \n\n \n红跑车(来福士店)\n✅亮点：软欧包实力强，桑葚乳酪软欧、多谷物欧包口碑稳定，馅料足、甜度克制；恰巴塔选择不算多，但整体面包品类丰富，支持试吃，适合偏好松软欧包，想一次多挑几种口味的人。\n \n\n \n快速选\n \n想吃地道、有特色的恰巴塔优先选赛耶司；\n\n更爱吃馅料丰富的软欧包，想试吃多选 → 红跑车。\n \n你要是告诉我在哪个区，我可以再帮你筛更近的备选。\n \n可以看地图对比两家位置：","mentioned":false,"memory":false,"refs":[]},{"text":"我给你挑两家侧重点不一样的，一家主打风味恰巴塔，一家主打馅料欧包，方便你按口味选。\n \n1. 赛耶司烘焙｜恰巴塔首选（咸口风味恰巴塔很强）\n \n✅亮点：恰巴塔是招牌，梅干菜扣肉、鸡枞菌恰巴塔很有杭州本地风味，面包体气孔漂亮、胶感足，越嚼越香。欧包、杂粮主食面包也做得不错，可以买半个试吃，适合旅游顺路买。\n📍门店：杭州大厦B座B133室（武林广场地铁口）\n \n\n \n2. 红跑车(来福士店)｜馅料欧包首选，游客友好\n \n✅亮点：软欧做得很稳，桑葚乳酪、核桃马里奥是爆款，乳酪馅饱满不糊嘴；多谷物欧包用料扎实，坚果果干多，甜度克制；店里可以试吃，买着不容易踩雷，来福士逛街顺路非常合适。\n📍门店：来福士购物中心B1层37A号，江锦路地铁站直达\n \n\n \n快速帮你选\n \n想吃有特色的咸口恰巴塔、喜欢主食面包 → 优先选赛耶司\n\n爱吃带馅料的软欧包，想试吃、逛钱江新城/来福士 → 优先选红跑车\n \n补充：你之前看过的麦的日尝，创意恰巴塔（三重芝士腐乳）是特色，偏创意咸香；赛耶司更偏向传统恰巴塔，本地风味更足。\n \n你更喜欢偏主食无馅，还是带乳酪馅料的？我可以再精简。","mentioned":true,"memory":true,"refs":[]}],"q10_hunyuan":[{"text":"杭州现在做恰巴塔/欧包不错的，按“风格”给你分一下，方便按口味挑：\n\n**1. micro boulangerie 米高烘焙（华星路）**\n硬欧/恰巴塔功底很稳，高含水量、外脆内润。  \n推荐：花椒腰果恰巴塔、黑松露罗勒芝士恰巴塔、莓果白巧恰巴塔。  \n适合：喜欢“正宗意式恰巴塔”、无糖无油、气孔漂亮的人。[2][7]\n\n**2. 37Domain\u0026Bakery（拱墅金茂悦）**\n杭州面包党常提的店，恰巴塔和全麦/酸种都强，口味偏“敢做”。  \n推荐：蓝纹核桃恰巴塔、藤椒腊肠恰巴塔、醋八蒜全麦吐司。  \n适合：吃腻了甜软包、想试咸口/重口味欧包的人。[1][2][4]\n\n**3. Cereal Bakery（丝联店/文二菜市场店）**\n法式街头风，硬欧、恰巴塔、丹麦酥都能打。  \n推荐：黑松露罗勒芝士恰巴塔、鸡枞菌恰巴塔。  \n适合：顺路城北/丝联一带，想买“咖啡配欧包”的人。[2][4]\n\n**4. bake post（刀茅巷）**\n法式欧包/酸包/法棍很受老面包客喜欢，油泼辣子蓝纹法棍是名场面。  \n适合：真·酸种/乡村面包爱好者，不是走“网红软恰巴塔”路线。[4]\n\n**5. GREYHOUND 灰狗面包（中山北路）**\n法式乡村、全麦、咸口欧包稳定，半个买也方便。  \n推荐：法式乡村、番茄乡村、罗勒芝士类。  \n适合：不想跑远、想买常规但不错的欧包。[4]\n\n**6. 咕噜妮 / 咕噜爷（临平艺尚小镇）**\n咕噜妮的“米曲恰巴塔”拿过 ITI 国际美味奖，糯、润、麦香干净；咕噜爷是窑烤/柴火线，天然酵母欧包有焦香。  \n适合：喜欢“杭州本土创新恰巴塔”或窑烤麦香的人。[8][14]\n\n**7. 麦浪小院（余杭下陡门村）**\n柴窑+自然发酵，硬欧、牛肝菌牛肉恰巴塔、黑芝麻红枣核桃恰巴塔都不错，氛围感强。  \n适合：周末专门跑村里吃面包+拍照，不是日常补货店。[11]\n\n**8. 安莎 AZAHAR（中山北路等）**\n老牌日式软欧/米面包，低油低糖，不是硬核欧包，但接受度高。  \n适合：给不吃硬欧的人带、买早餐面包。\n\n---\n\n如果你只想**闭眼先去两家**：  \n- 要“意式恰巴塔本体” → **micro 米高**  \n- 要“杭州特色咸口恰巴塔” → **37Domain**\n\n要不要我帮你按“城西/武林/滨江/临平”分区域，再列一份当天几点去、哪些款不容易售罄的动线？","mentioned":false,"memory":false,"refs":[{"t":"面包脑袋私藏的杭州9 家面包店!","s":"寻味慢旅","u":"http://mp.weixin.qq.com/s?src=11\u0026timestamp=1791466871\u0026ver=7014\u0026signature=vODcMLIoOMwfrQj5uZqa*nEUwiEM-bsSk3j*k9E2FTuXlGe4CvmI-yd07vXSnRNJZUvw18johSgCS-aUZqdOLDzEIq7cFGIq3CrkvUsgvobkn1BIgpjEVcdw7zVVBWXg\u0026new=1","k":"微信公众号","r":""},{"t":"被面包之神眷顾的城市!凭什么说TA不好吃?","s":"嬉游旅行指南","u":"http://mp.weixin.qq.com/s?__biz=MzA4MDQ3NDkxNA==\u0026mid=2248005216\u0026idx=1\u0026sn=49cf93a5c6abba94ea54f1170c84466d\u0026chksm=9e82259b1e1dab0f4e7fd4d15374de88921097ce8ea67f2b7ff41d63ae5dc9ac42e82d933fa4#rd","k":"微信公众号","r":""},{"t":"杭州真的是瞬... 来自杭州美食旅游攻略 - 微博","s 792cc13d824295983ad763013a07202f69dc16ef1b64f20f89ff76a29b7f2bdd8ad94#rd","k":"微信公众号","r":""},{"t":"壮壮妈同款杭州面包脑袋的宝藏欧包up up","s":"ix5j","u":"https://m.ix5j.cn/article/show-1139344006.html","k":"其他网站","r":""},{"t":"临平匠心斩获“奥斯卡奖”!这一口糯叽叽,征服24国米其林主厨!","s":"临平发布","u":"http://mp.weixin.qq.com/s?src=11\u0026timestamp=1791466871\u0026ver=7014\u0026signature=5wZh7BdRtyZbrOz9FPsS8ViUG6GHaJir3tdDiSMOgmR1nkfYX6ynrhAukft7gRDDNUSc**V9PfpT8JoOvScs*SR5MaVU6YjUvvdz-1mB50eWA-nyAqGdWXCmo1oe0llQ\u0026new=1","k":"微信公众号","r":""}]},{"text":"杭州恰巴塔/欧包第一梯队就这几家，按口味取向直接选：\n\n- **micro boulangerie（华星路）**：高水量恰巴塔天花板，花椒腰果、黑松露罗勒芝士、帕玛森福加斯都很能打，外脆内糯，无油无糖党最爱。[1][2]\n- **37 Domain \u0026 Bakery（金茂悦）**：咸口恰巴塔最野，蓝纹核桃、藤椒腊肠、山珍海味，少糖少油但风味重，面包脑袋探险首选。[1][4]\n- **Cereal Bakery（丝联店）**：法式硬欧+恰巴塔正经派，黑松露罗勒芝士、红豆黄油恰巴塔、红茶脆柿酸木瓜，大气孔、麦香足。[1][7]\n- **Franquette（中山北路）**：酸面包/法棍/苹果肉桂碱水稳，不炫技、几乎不踩雷，想坐下来喝咖啡选它。\n- **marufuwa（塘萍路）**：菠菜扭扭、卤牛肉沙葱、玫瑰核桃咸芝士恰巴塔，新中式调味很杭州，软欧路线但恰巴塔不弱。[1]\n- **RUSON 鹿松（黄龙）**：杭州老牌独立欧包，法棍、蒜香芝士、鹿角、可露丽都稳，传统欧式功底好。[11][13]\n- **Cycle \u0026 Cycle**：日式偏多，但红酒坚果、红豆乳酪恰巴塔、海盐卷也值得，低糖低油、越嚼越香。\n- **Sourdough No.521**：酸种乡村面包/黑麦硬欧，原麦酸香重，不喜欢酸味别去。\n\n速记：\n- 要**高水量恰巴塔** → micro\n- 要**咸口重风味** → 37 Domain\n- 要**法式硬欧/酸种** → Cereal、RUSON、Franquette\n- 要**新中式恰巴塔** → marufuwa\n- 要**坐下来配咖啡** → Franquette / Cycle \u0026 Cycle / Cereal\n\n小提醒：恰巴塔别常温捂到第二天，**冷冻保存 + 烤箱 180℃ 喷点水烤 3–4 分钟**才回到外脆内韧。\n\n要不要我按你在西湖区/拱墅区/上城区，排一条“恰巴塔+欧包+咖啡”半天下午茶路线？","mentioned":false,"memory":false,"refs":[{"t":"被面包之神眷顾的城市!凭什么说TA不好吃?","s":"嬉游旅行指南","u":"http://mp.weixin.qq.com/s?__biz=MzA4MDQ3NDkxNA==\u0026mid=2248005216\u0026idx=1\u0026sn=49cf93a5c6abba94ea54f1170c84466d\u0026chksm=9e82259b1e1dab0f4e7fd4d15374de88921097ce8ea67f2b7ff41d63ae5dc9ac42e82d933fa4#rd","k":"微信公众号","r":""},{"t":"面包脑袋私藏的杭州9 家面包店!","s":"寻味慢旅","u":"http://mp.weixin.qq.com/s?__biz=MzY5MzE4Mjc1Nw==\u0026mid=2247484835\u0026idx=1\u0026sn=099265684c99e476ab44fc60bedf87a2\u0026chksm=f5098c84adb7a46808c463fc6619c645720b08062c4c09c5c4c930a74ae91896ec4cddb9347b#rd","k":"微信公众号","r":""},{"t":"杭州面包专辑(1)如我一般以面
